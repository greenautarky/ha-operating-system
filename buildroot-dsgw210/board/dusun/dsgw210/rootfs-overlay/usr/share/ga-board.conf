# Per-board values read by the shared GA scripts (ga-firewall-gate,
# ga-manage-ethernet, ga-connectivity-recorder). POSIX sh, sourced. Each line
# is a default (`:=`): a value already set in the environment wins, which is
# how the host tests drive the scripts.

# Interfaces that face the customer network: wired and the board's own Wi-Fi.
# The modem interface (ppp0 / wwan0) is deliberately NOT listed: it is an uplink, not a LAN, so no
# service port is opened on it. The gate drops all ingress on every interface that is neither trusted
# (lo, mesh, container bridges) nor listed here (Odoo #1647).
: "${GA_LAN_IFACES:=end0 wlan0}"

# The wired NIC, for the Ethernet policy (ga-manage-ethernet).
: "${GA_ETH_IFACE:=end0}"

# Link rungs the connectivity recorder tracks, in uplink-ladder order. ppp0 is
# the interface NetworkManager creates for the AT/PPP-only modem.
: "${GA_CR_IFACES:=end0 wlan0 ppp0}"

# Fleet-manager seed is mandatory on this board (Odoo #1700). Unlike the iHost, no flasher
# writes GA_FLEET_ENV here, so ga-enroll must refuse an absent value instead of defaulting to prod.
: "${GA_FLEET_ENV_REQUIRED:=1}"

# Built-in modem (Quectel BG96): the uplink ladder treats the LTE profile as a rung that
# exists only while NetworkManager sees a usable modem, publishes the modem state in
# ga-uplink.json for ga_manager, and applies the APN (Odoo #2176). Absent on the iHost.
: "${GA_BUILTIN_MODEM:=1}"
# NM profile name of the modem connection (dsgw210-lte.nmconnection).
: "${GA_LTE_PROFILE:=DSGW-210 LTE}"
# APN used when /mnt/boot/ga-lte-apn is absent. Empty = ModemManager / NM auto-config from the
# SIM. Series production is expected to set the fleet APN here; do not put a carrier APN in the
# connection file.
: "${GA_LTE_APN_DEFAULT:=}"
# The BG96's AT port on USB interface 03 (udev symlink /dev/lte-ppp = ttyUSB3), NOT
# ModemManager's primary port: the uplink ladder writes AT+CFUN=1,1 here when the
# modem stays `sim-missing` (SIM inserted after boot, Odoo #2176).
: "${GA_MODEM_RESET_PORT:=/dev/lte-ppp}"

# Wi-Fi regulatory domain (Odoo #2183, CE R1): explicit, not adopted from a
# neighbour's access point. Per site: /mnt/boot/ga-wifi-country overrides it.
: "${GA_WIFI_COUNTRY:=DE}"
