# Per-board values read by the shared GA scripts (ga-firewall-gate,
# ga-manage-ethernet, ga-connectivity-recorder). POSIX sh, sourced. Each line
# is a default (`:=`): a value already set in the environment wins, which is
# how the host tests drive the scripts.

# Interfaces that face the customer network: wired and the board's own Wi-Fi.
# The modem interface is never listed: it is an uplink, not a LAN.
: "${GA_LAN_IFACES:=end0 wlan0}"

# The wired NIC, for the Ethernet policy (ga-manage-ethernet).
: "${GA_ETH_IFACE:=end0}"

# Link rungs the connectivity recorder tracks, in uplink-ladder order. ppp0 is
# the interface NetworkManager creates for the AT/PPP-only modem.
: "${GA_CR_IFACES:=end0 wlan0 ppp0}"
