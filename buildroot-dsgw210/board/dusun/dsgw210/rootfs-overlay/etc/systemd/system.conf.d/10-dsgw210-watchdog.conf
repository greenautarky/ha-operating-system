# DSGW-210 hardware watchdog.
#
# The runtime watchdog itself comes from the common HAOS drop-in
# usr/lib/systemd/system.conf.d/watchdog.conf: RuntimeWatchdogSec=300 on
# /dev/watchdog (RK3328 snps,dw-wdt @ 0xff1a0000, CONFIG_DW_WATCHDOG=y), the
# same as on the iHost. systemd merges drop-ins in filename order across
# directories, so that file (sorting after 10-...) wins for any key it sets;
# this file therefore sets only keys the common drop-in leaves out.
#
# RebootWatchdogSec only arms during the final reboot() window, so the
# slow Docker stop-job during shutdown does not trip it (PID 1 keeps
# pinging through the shutdown transaction). The common drop-in does not
# set it, so this value is in effect.
#
# RuntimeWatchdogPreSec turns a watchdog expiry into a kernel panic (the
# kernel's default pretimeout governor is "panic", board kernel.config),
# so ramoops keeps a dmesg record that systemd-pstore archives to
# /var/lib/systemd/pstore on the next boot. Without it the reset is silent.
# The common drop-in does not set this key, so this value is in effect.
# dw_wdt (drivers/watchdog/dw_wdt.c) does NOT honour the number: any
# non-zero value only switches the counter to interrupt mode, and the
# effective pretimeout is one hardware counter period (2^31 / 75 MHz,
# ~28 s), which systemd reads back and logs. 60 is a valid value (< 300)
# that would still leave ample time for the panic and the pstore write if
# a later driver honoured it.
[Manager]
RebootWatchdogSec=10min
RuntimeWatchdogPreSec=60
