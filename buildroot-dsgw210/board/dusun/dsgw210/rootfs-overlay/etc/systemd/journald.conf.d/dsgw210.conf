# DSGW-210 journal settings, on top of the shared GA drop-in 00-ga.conf (which
# sets Storage=volatile and the RAM cap). This file must not set Storage= or
# RuntimeMaxUse=: it sorts after 00-ga.conf, so it would win.
# The board used to keep a 1G persistent journal on its larger data partition;
# Odoo #1256 (option C) applies to both boards: the journal is RAM-only, the
# previous boot's evidence is the bounded dump in /mnt/data/journal-dump/ plus
# the pstore/ramoops crash record. Rate limits as on the iHost.
[Journal]
Compress=yes
RateLimitIntervalSec=30s
RateLimitBurst=200
