# DSGW-210 journal retention. The board has a much larger data partition than
# the iHost (28 GB), and the iHost's 200M cap would keep only about two days of
# logs here, so this board keeps 1G (roughly a week). Rate limits as on the
# iHost; the retention time limit comes from the shared GA drop-in.
[Journal]
Storage=auto
Compress=yes
SystemMaxUse=1G
SystemKeepFree=1G
RuntimeMaxUse=64M
RateLimitIntervalSec=30s
RateLimitBurst=200
