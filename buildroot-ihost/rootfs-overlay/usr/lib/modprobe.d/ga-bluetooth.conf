# Onboard RTL8723DS Bluetooth is boot-marker-gated (default OFF).
#
# The Bluetooth serdev device-tree node auto-triggers hci_uart via its
# modalias at boot, so a plain `blacklist` is NOT enough: blacklist only
# suppresses coldplug alias loads, and the serdev/of load path still fires.
# `install hci_uart /bin/true` hard-blocks EVERY autoload path. The gate
# (ga-bluetooth-gate) loads it explicitly with `modprobe --ignore-install`
# when Bluetooth is enabled for the device.
#
# ⚠️ Shipped under /usr/lib/modprobe.d, NOT /etc/modprobe.d: on HAOS the
# latter is a bind-mount from the (initially empty) overlay partition, which
# shadows anything placed there at build time — verified on K31 2026-07-21
# (hci0 came up despite the blacklist because the /etc file was hidden).
# /usr/lib/modprobe.d lives on the read-only rootfs and is honored by kmod.
install hci_uart /bin/true
blacklist hci_uart
