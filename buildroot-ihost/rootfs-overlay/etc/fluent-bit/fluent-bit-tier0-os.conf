# Fluent-Bit Tier-0 entry point (always-on, no consent gate).
#
# fluent-bit-tier0.service loads THIS file. It pulls in the tier-0 payload
# owned by the ga-telemetry-config component (fluent-bit-tier0.conf: kernel,
# rauc.service, auth, Supervisor, converge, the tier/identity stamps and the
# Loki OUTPUT) and adds the journal sources of OS units that this repository
# defines. Those units live here, so their log shipping lives next to them and
# changes in the same pull request as the units themselves.
#
# Everything below is tagged tier0.* and therefore goes through the included
# file's stamp FILTER and Loki OUTPUT unchanged — one stream, one credential.
#
# Privacy scope: PRIVACY_TIERS.md (tier-0 = operational, DSGVO Art. 6 (b)+(f)).
# Add a source here only with the same review a source in fluent-bit-tier0.conf
# gets. tests/gates/tier0_ota_journal/selftest.sh runs the real fluent-bit over
# a fixture journal and fails on any unit outside the list below that leaks
# into this stream.

@INCLUDE fluent-bit-tier0.conf

# --- OS update (OTA) host path ----------------------------------------
#
# Why: on 2026-10-08 an OTA was accepted by ga_manager, which wrote the host
# request file and reported success, while RAUC never installed anything. The
# cloud held only ga_manager's side. Nothing from the host path arrived, so
# "the host did nothing" could not be told apart from "the host logged nothing".
#
# What, at EVERY priority (no grep FILTER on this tag, deliberately):
#   _SYSTEMD_UNIT=ga-rauc-install.service  the install helper's own output:
#       request read, version validated, OTA endpoint pin, download URL, bytes,
#       rauc info/install verdict. Its child processes (ga-resolve-ota when no
#       endpoint is pinned, `rauc install` client progress) run in the same
#       cgroup and arrive with it.
#   UNIT=ga-rauc-install.service           PID 1's lifecycle lines for it
#       ("Starting…", "Finished…", "Failed with result…", timeouts). These are
#       logged by systemd itself (_SYSTEMD_UNIT=init.scope), so the
#       _SYSTEMD_UNIT match above never sees them — and "was it ever started"
#       is exactly the question the incident could not answer.
#   UNIT=ga-rauc-install.path              PID 1's lines for the watcher. A
#       .path unit runs no process, so it has no _SYSTEMD_UNIT lines at all;
#       this is the only way it appears in the journal.
#   UNIT=rauc.service                      PID 1's lifecycle lines for the RAUC
#       daemon. Its OWN output (_SYSTEMD_UNIT=rauc.service, including the
#       ga-release-floor pre-install handler, which RAUC runs as its child)
#       already ships through tier0.rauc in the included file; matching it here
#       too would ship every line twice, and the gate asserts it does not.
#
# Not here, on purpose:
#   ga-resolve-ota.service — a 5-minute timer; at every priority it would add
#       over a thousand lines per device per day (288 runs) of "endpoint unchanged". Its run during an
#       install is already captured above (child of ga-rauc-install).
#   ga-gm-host-release.*   — ga_manager host-release path, not the OS update.
#   There are no ga-ota-* units in this image.
#
# Personal data: none. These lines carry versions, the BOS release label, slot
# names, byte counts, the OTA host name, the OTA server's mesh address and
# download URLs of the form https://<ota host>/releases/<version>/[<release>/]
# haos_ihost-<version>.raucb — no user, token or query string. The device's
# own identity is already a label on every tier-0 line.
#
# Systemd_Filter_Type is the default `Or`: every match below is an
# alternative (see the note in fluent-bit-tier0.conf on why mixing fields
# with a PRIORITY match in one input does not do what it looks like).
[INPUT]
    Name                systemd
    Tag                 tier0.ota
    DB                  /mnt/data/fluent-bit/db/tier0-ota.db
    Systemd_Filter      _SYSTEMD_UNIT=ga-rauc-install.service
    Systemd_Filter      UNIT=ga-rauc-install.service
    Systemd_Filter      UNIT=ga-rauc-install.path
    Systemd_Filter      UNIT=rauc.service
