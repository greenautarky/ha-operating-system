[Unit]
# GA boot-time gate: bluetoothd only runs when ga-bluetooth-gate decided BT is
# enabled this boot (either the fleet /share flag or the manual /mnt/boot
# marker) AND the mode is "managed". Default OFF, fleet-safe.
#
# The raw-mode exclusion is load-bearing: a raw-HCI consumer (bumble's
# hci-socket, used by the watch-telemetry add-on) opens the HCI User Channel,
# which needs the controller DOWN and unclaimed — a running bluetoothd holds
# hci0 and makes that fail with EBUSY. So in raw mode the module is loaded but
# bluetoothd stays off.
ConditionPathExists=/run/ga-bluetooth.enabled
ConditionPathExists=!/run/ga-bluetooth.raw
After=ga-bluetooth.service
