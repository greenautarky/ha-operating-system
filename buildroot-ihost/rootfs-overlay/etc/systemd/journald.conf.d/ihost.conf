# iHost journald drop-in. Storage and the size bounds live in the GA
# journald.conf only (option C: RAM-only journal, Odoo #1256); a drop-in is
# read after the main file and would override them, so this file sets
# compression and rate limits only.
[Journal]
Compress=yes
RateLimitIntervalSec=30s
RateLimitBurst=200
