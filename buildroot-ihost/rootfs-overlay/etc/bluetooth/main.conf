[General]
Experimental=true
# LE-only: GA scope is BLE for Home Assistant (sensors/advertisements).
# BR/EDR (classic audio/serial profiles) stays off — sound subsystem is
# disabled on this board anyway.
ControllerMode = le
# Increase temporary device timeout from 30s to 195s to prevent device
# removal during connection retries and to align with Home Assistant's
# Bluetooth stack expectations (matches upstream HAOS main.conf)
TemporaryTimeout=195

[Policy]
AutoEnable=true
