# Onboard RTL8723DS Bluetooth is boot-marker-gated (default OFF).
# The blacklist stops udev/serdev *autoload* only — the explicit modprobe in
# ga-bluetooth.service (which runs iff /mnt/boot/ga-bluetooth exists) is
# unaffected, as are dependency loads.
blacklist bluetooth
blacklist hci_uart
blacklist btrtl
blacklist btusb
