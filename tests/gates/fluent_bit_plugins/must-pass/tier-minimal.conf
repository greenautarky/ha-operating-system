[SERVICE]
    Flush 5
    Parsers_File parsers.conf

[INPUT]
    Name  systemd
    Tag   t
    DB    /tmp/db
    DB.Sync Off

[INPUT]
    Name  tail
    Path  /var/log/x

[INPUT]
    Name  kmsg

[INPUT]
    Name  exec
    Command true

[FILTER]
    Name  grep
    Match *
    Regex PRIORITY ^[0-4]$

[FILTER]
    Name  record_modifier
    Match *
    Record a b

[FILTER]
    Name  modify
    Match *
    Remove x

[OUTPUT]
    Name  loki
    Match *
