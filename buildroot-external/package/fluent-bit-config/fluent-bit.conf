[SERVICE]
    Flush        60
    Daemon       off
    Log_Level    warning
    Parsers_File parsers.conf
    # Persistent buffering on device (store & forward)
    storage.path              /mnt/data/fluent-bit/storage
    storage.sync              normal
    storage.checksum          on
    storage.backlog.mem_limit 5M

# =====================================================================
# SOURCE ALLOWLIST — read this before adding an INPUT.
#
# This stream exists to surface operational faults, not to mirror the
# device. Sources are therefore an explicit allowlist, not everything
# minus a few exclusions: container output is high-volume and almost
# entirely routine, so forwarding it costs bandwidth and storage
# without improving fault detection.
#
# Current allowlist: OS/system units, the Supervisor log, and one
# container — ga_manager, our own structured logger, at WARNING and
# above. Everything else stays on the device and is collected on
# demand when an incident needs it.
#
# Adding a source here is a deliberate decision with review criteria
# recorded in ga-ihost-docs/PRIVACY_TIERS.md. Do not widen the list
# without going through it.
# =====================================================================

# --- INPUTS ----------------------------------------------------------
# 1) Systemd: selected OS units only.
#
# `docker.service` is deliberately ABSENT here and handled by its own
# input further down, because the PRIORITY filter below cannot bound
# container volume: Docker's journald driver stamps every container
# line written to stderr as PRIORITY=3 (err), whatever the application
# itself logged. journald priority is a transport property, not an
# application severity — a `PRIORITY [0-4]` filter on container output
# therefore drops nothing and lets the full stream through.
[INPUT]
    Name              systemd
    Tag               ihost.systemd
    Read_From_Tail    true
    storage.type      filesystem
    Systemd_Filter    _SYSTEMD_UNIT=network.service
    Systemd_Filter    _SYSTEMD_UNIT=supervisor.service
    Systemd_Filter    _SYSTEMD_UNIT=netbird.service
    Systemd_Filter    _SYSTEMD_UNIT=ga-disk-guard.service
    # GA self-heal / OTA / crash units (event-driven, low volume). The
    # PRIORITY [0-4] filter below keeps only warn+ from these, so we get the
    # rtw88 degraded-TX triggers + recoveries (ga-wifi-watchdog logs those at
    # <4>/<3>), OTA install failures (ga-rauc-install: systemd emits the
    # timeout/failure at err), boot WiFi-recovery failures (ga-rtw-recover),
    # and unclean-shutdown detection (ga-boot-check) — but NOT the routine
    # every-3-min healthy checks (those log at info and are dropped).
    Systemd_Filter    _SYSTEMD_UNIT=ga-wifi-watchdog.service
    Systemd_Filter    _SYSTEMD_UNIT=ga-rtw-recover.service
    Systemd_Filter    _SYSTEMD_UNIT=ga-rauc-install.service
    Systemd_Filter    _SYSTEMD_UNIT=ga-boot-check.service

# 2) Supervisor log — add-on start/stop, update results, job failures.
#    Severity-filtered below. This is a GA/HA platform log, not tenant
#    content: it names add-ons and versions, not entities or rooms.
[INPUT]
    Name              tail
    Tag               ihost.supervisor
    Path              /mnt/data/supervisor/logs/supervisor.log
    Parser            homeassistant
    DB                /mnt/data/fluent-bit/db/supervisor.db
    Mem_Buf_Limit     2M
    Skip_Long_Lines   On
    storage.type      filesystem

# 3) Containers — allowlisted by name in the FILTER section below.
#
# The systemd input cannot express "only these containers": its
# Systemd_Filter needs exact values, and the add-on prefix differs per
# device (addon_99f1cad4_ga_manager on K07, addon_48a36628_… on K33).
# So take docker.service whole here and let a grep filter keep only the
# allowlisted names by suffix. Anything not matched is dropped on the
# device and never reaches the network.
[INPUT]
    Name              systemd
    Tag               ihost.containers
    Read_From_Tail    true
    storage.type      filesystem
    Systemd_Filter    _SYSTEMD_UNIT=docker.service

# --- PARKED INPUT — do not enable without review ---------------------
#
# Home Assistant Core log file. This is the same content the
# `homeassistant` container already produces, reached by a second
# route, and it is the highest-volume source on the device. Left off;
# collected on demand when an incident needs it.
#[INPUT]
#    Name              tail
#    Tag               ihost.hass
#    Path              /mnt/data/supervisor/logs/homeassistant.log
#    Parser            homeassistant
#    DB                /mnt/data/fluent-bit/db/homeassistant.db
#    Mem_Buf_Limit     5M
#    Skip_Long_Lines   On
#    storage.type      filesystem

# --- FILTERS ---------------------------------------------------------
# Add metadata so many devices are distinguishable in the backend
[FILTER]
    Name          record_modifier
    Match         ihost.*
    Record        device_type ihost
    Record        env ${GA_ENV}
    Record        device_label ${DEVICE_LABEL}

# Drop info/debug from OS units — only warnings, errors, critical.
# Sound for real systemd units: they set PRIORITY from their own
# severity. (It is NOT sound for container output — see the INPUT note.)
[FILTER]
    Name          grep
    Match         ihost.systemd
    Regex         PRIORITY [0-4]

# Supervisor log: only errors and warnings. Previously this stream had
# NO severity filter at all and shipped in full.
[FILTER]
    Name          grep
    Match         ihost.supervisor
    Regex         log (ERROR|WARNING|CRITICAL|error|warning|critical)

# Container ALLOWLIST. Matched on the name suffix so it holds across
# devices with different add-on repository prefixes. Anything not
# listed is dropped on the device — this is what bounds the volume of
# this stream, since the PRIORITY filter cannot (see the INPUT note).
#
# hassio_supervisor is deliberately NOT listed: its content already
# arrives through the supervisor.log tail above, and adding it here
# would ship every line twice.
[FILTER]
    Name          grep
    Match         ihost.containers
    Regex         CONTAINER_NAME _ga_manager$

# ga_manager: keep only WARNING/ERROR/CRITICAL. Its JSON log lines carry
# a "level" field; this drops the INFO firehose (MQTT (un)subscribe,
# health ticks). Note this filters on the APPLICATION level, not on
# journald PRIORITY — the latter is 3 for all container stderr and says
# nothing about severity.
[FILTER]
    Name          grep
    Match         ihost.containers
    Regex         MESSAGE "level": ?"(WARNING|ERROR|CRITICAL)"

# --- OUTPUTS ---------------------------------------------------------
# Send to central Loki.
# Endpoint + auth + tenant come from the systemd env (fluent-bit.service):
# without a delivered per-device cred the defaults are LOKI_HOST=
# loki.greenautarky.com:3100 with "anonymous" user/password/tenant — Loki in
# single-tenant mode ignores the Authorization + X-Scope-OrgID headers, so
# this is byte-compatible with the historical anonymous push. Once the
# fleet-manager delivers the per-device cred (ADR-0003 Step 3), the same
# vars point at the authenticated Caddy vhost with user dev_<KIB-SON> and
# tenant <KIB-SON>. NOTE: the tenant the server ENFORCES is stamped by Caddy
# from the authenticated user — tenant_id here is informational.
[OUTPUT]
    Name          loki
    Match         ihost.*
    Host          ${LOKI_HOST}
    Port          ${LOKI_PORT}
    URI           /loki/api/v1/push
    http_user     ${LOKI_USER}
    http_passwd   ${LOKI_PASSWORD}
    tenant_id     ${LOKI_TENANT}
    labels        job=ihost,uuid=${DEVICE_UUID},env=${GA_ENV},device_label=${DEVICE_LABEL},tier=1
    line_format   json
    drop_single_key On
    Retry_Limit   False
    storage.total_limit_size 300M
    compress      gzip
