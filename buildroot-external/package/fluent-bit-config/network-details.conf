# =============================================================================
# Phase 7 — LTE network-details pipeline (SCAFFOLD, NOT YET INCLUDED)
# =============================================================================
#
# Polls ga_manager's GET /network/details once per hour and ships the
# response to Loki tagged as ihost.network_details. Used for inventory
# / billing dashboards (= "which devices on which APN, on what dongle
# model"). The details are static-ish (= SIM ICCID, IMEI, firmware
# version don't change tick-over-tick) so a 1-hour cadence is plenty.
#
# Activation steps (= when Phase 7 ships):
#   1. Add `@INCLUDE network-details.conf` to fluent-bit.conf
#   2. Bake DEVICE_LABEL + LTE_DETAILS_TOKEN into /mnt/data/ga-env.conf
#      (LTE_DETAILS_TOKEN = the ga_manager bearer token at
#      /data/auth.token inside the ga_manager addon container — for now
#      bind-mount it to the host or have ga_manager export a read-only
#      copy at /mnt/data/ga-manager-readonly-token).
#   3. Verify the Loki labels show device_label + LTE inventory roll-up.
#
# Why opt-in: until concrete LTE dongle backends exist (Phase 3.x,
# waiting on hardware) the /network/details endpoint always returns
# available=false, and shipping that to Loki would just pollute the
# log volume with no payload.
#
# When this gets enabled, also flip ga_manager's NetworkConfig to
# enable a periodic LteDetails snapshot writer (so the data is fresh
# even when no operator hits the API).

# --- INPUTS ----------------------------------------------------------
[INPUT]
    Name              exec
    Tag               ihost.network_details
    # Curl ga_manager's /network/details. -s for silent, --max-time
    # so a stuck fetch can't block fluent-bit. We pull through the
    # local host port; the LTE_DETAILS_TOKEN env var carries the
    # ga_manager bearer.
    Command           sh -c 'curl -sS --max-time 10 -H "Authorization: Bearer $LTE_DETAILS_TOKEN" http://127.0.0.1:8099/network/details 2>/dev/null || echo "{}"'
    Interval_Sec      3600
    Parser            json
    storage.type      filesystem

# --- FILTERS ---------------------------------------------------------
# Drop the noise: when available=false, we don't want a Loki entry
# every hour. Only ship when the backend actually had data.
[FILTER]
    Name              grep
    Match             ihost.network_details
    Regex             available true

# Add the same metadata the other inputs get
[FILTER]
    Name              record_modifier
    Match             ihost.network_details
    Record            device_type ihost
    Record            env ${GA_ENV}
    Record            device_label ${DEVICE_LABEL}

# --- OUTPUT ----------------------------------------------------------
# Ship to Loki. Same endpoint as the main pipeline; just a different
# tag so dashboards can filter on it.
[OUTPUT]
    Name              loki
    Match             ihost.network_details
    Host              ${LOKI_HOST}
    Port              ${LOKI_PORT}
    URI               /loki/api/v1/push
    http_user         ${LOKI_USER}
    http_passwd       ${LOKI_PASSWORD}
    tenant_id         ${LOKI_TENANT}
    labels            job=ihost,uuid=${DEVICE_UUID},env=${GA_ENV},device_label=${DEVICE_LABEL},tier=1,stream=network_details
    line_format       json
    drop_single_key   On
    Retry_Limit       False
    storage.total_limit_size 50M
    compress          gzip
