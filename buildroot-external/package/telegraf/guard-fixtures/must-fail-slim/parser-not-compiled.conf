# must FAIL in the slim build: every input is compiled in, but
# data_format "json" needs parsers.json, which is not in TELEGRAF_GA_PLUGINS.
# expect-missing: parsers.json
[[inputs.file]]
  files = ["/nonexistent/*.json"]
  data_format = "json"
[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]
