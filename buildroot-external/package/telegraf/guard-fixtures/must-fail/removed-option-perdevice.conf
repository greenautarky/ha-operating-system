# must FAIL: `perdevice` was removed from inputs.docker in telegraf 1.38
# (influxdata/telegraf#17148); 1.38 refuses the WHOLE file, so telegraf
# does not start. This is the exact shape telegraf-debug.conf shipped with.
# expect-error: fields \["perdevice"\], but they were not used
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"
  perdevice = true
[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]
