###############################################################################
# Telegraf minimal config for iHost / HAOS
# Goal: low resource usage, essential host + Docker metrics
###############################################################################

[agent]
  interval = "300s"               # 5 min — saves ~1 GB/Mo vs 15s on LTE
  round_interval = true
  metric_batch_size = 500
  metric_buffer_limit = 100000    # ring size (count); ~10 MB max on disk at our volume
  collection_jitter = "5s"        # avoids spikes
  # SD-friendly store-and-forward: flush every 5 min so the on-disk WAL is
  # written infrequently (batched) — far less SD wear than 60s. Worst-case
  # loss on a hard crash is one flush window; the live "now" value comes from
  # the REST /network/status sonde, not this path (see TELEMETRY-DATA-FLOW.md).
  flush_interval = "300s"
  flush_jitter = "5s"
  # Durable disk buffer (telegraf native since 1.35): the metric buffer persists to
  # /mnt/data so metrics survive a reboot DURING a WAN/LTE outage and are
  # back-filled on recovery — incl. the WiFi/LTE signal you'd want to diagnose
  # that very outage. /mnt/data ONLY (NOT /tmp = 15 MB zram). Size-capped by a
  # tmpfiles.d rule on the buffer dir.
  buffer_strategy = "disk_write_through"
  buffer_directory = "/mnt/data/telegraf/buffer"
  logfile = ""
  quiet = false
  omit_hostname = true            # hostname is always "kibu", use uuid/device_label instead

[global_tags]
  env = "${GA_ENV}"
  device_type = "ihost"
  uuid = "${DEVICE_UUID}"
  device_label = "${DEVICE_LABEL}"
  os_version = "${GA_BUILD_TIMESTAMP}"
  # Privacy tier — telegraf collects Tier 2 (Performance & Patterns) per
  # ga-ihost-docs/PRIVACY_TIERS.md. This tag lets the Grafana / InfluxDB
  # side filter and apply tier-specific retention policies.
  tier = "2"

###############################################################################
# INPUTS - ESSENTIAL HOST METRICS
###############################################################################

# CPU usage (total only — per-cpu is noisy on 4-core devices)
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

# Memory usage
[[inputs.mem]]

# Swap usage (in case swap is enabled)
[[inputs.swap]]

# System uptime + load average
[[inputs.system]]

# Disk usage — only persistent data partition (rootfs is read-only erofs)
[[inputs.disk]]
  mount_points = ["/mnt/data"]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs", "erofs"]

# Network I/O (eth0/end0 varies by device, wt0 = NetBird)
[[inputs.net]]
  interfaces = ["eth0", "end0", "wlan0", "wt0"]
  ignore_protocol_stats = true

###############################################################################
# INPUTS - DOCKER METRICS (Home Assistant, Add-ons, etc.)
###############################################################################

# Requires access to the Docker socket
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = []     # include all containers by default
  container_name_exclude = ["telegraf"]  # do not monitor itself
  timeout = "5s"

###############################################################################
# INPUTS - NETWORK CONNECTIVITY
###############################################################################

# Ping gateway + internet to detect connectivity issues
# GATEWAY_IP is auto-detected at boot from default route
[[inputs.ping]]
  urls = ["${GATEWAY_IP}", "1.1.1.1", "8.8.8.8"]
  method = "native"
  count = 3
  ping_interval = 60.0             # was 1.0 — saves ~100 MB/Mo
  timeout = 4.0

###############################################################################
# INPUTS - WIFI SIGNAL STRENGTH
###############################################################################

# Reads /proc/net/wireless — provides RSSI (dBm), link quality, noise
[[inputs.wireless]]

###############################################################################
# INPUTS - CPU TEMPERATURE
###############################################################################

# SoC thermal zones (/sys/class/thermal) — native, no scrape/auth.
# NOTE (2026-06-24): the iHost kernel currently exposes NO thermal zones
# (/sys/class/thermal + /sys/class/hwmon are empty on K0), so this produces no
# data yet. It's kept ready for when the Rockchip thermal driver
# (CONFIG_ROCKCHIP_THERMAL / tsadc) is enabled in the kernel config — then
# cpu_temp flows with no further telegraf change. Tracked as a kernel follow-up.
[[inputs.temp]]

###############################################################################
# INPUTS - ga_manager NETWORK SIGNAL + INVENTORY (file-drop bridge)
###############################################################################

# ga_manager writes a small InfluxDB-line-protocol snapshot to this file each
# tick (active-uplink signal incl. WiFi/LTE RSSI + the normalized
# active_signal_dbm that works across every LTE backend + the integrated modem;
# and 1x/boot the static inventory: dongle SIM/IMEI/model + Zigbee IEEE).
# A FILE-DROP rather than an HTTP scrape on purpose: the addon API binds inside
# its own container namespace (host_network:false) and is not reliably reachable
# on host:8099 — a file needs no port, no Bearer token, no namespace plumbing.
# See ga-ihost-docs/TELEMETRY-DATA-FLOW.md (row 9 + inventory rows).
#   Path = the host view of the addon's /share (addon writes /share/telegraf/…,
#   host telegraf reads /mnt/data/supervisor/share/telegraf/… — the established
#   /share addon→host bridge, see memory:feedback_share_path_for_addon_host_bridge).
[[inputs.file]]
  # A DROP-IN DIRECTORY, not one filename. ga_manager writes ga-network.influx here and
  # ga_heating now writes ga-heating.influx; hardcoding the first meant the second was
  # collected by nothing and nobody would have noticed — a metric that never arrives
  # looks exactly like a healthy fleet.
  #
  # The bridge itself is unchanged and is the established one: /share is the addon→host
  # path, a file needs no port, no bearer token and no namespace plumbing, and telegraf's
  # disk buffer means a drop written during an outage is back-filled on recovery.
  files = ["/mnt/data/supervisor/share/telegraf/*.influx"]
  data_format = "influx"
  interval = "60s"            # finer signal history than the 300s default;
                              # samples batch into the 300s flush (SD-friendly)

###############################################################################
# INPUTS - BOOT TIMING
###############################################################################

# Report boot milestones to InfluxDB (static per boot, collected once per hour)
[[inputs.exec]]
  commands = ["/usr/libexec/ga-boot-timing"]
  timeout = "10s"
  interval = "1h"
  data_format = "influx"

###############################################################################
# OUTPUTS
###############################################################################

# Central InfluxDB (via NetBird)
[[outputs.influxdb]]
  urls = ["http://influx.greenautarky.com:8086"]
  database = "device_metrics"
  username = "${INFLUX_USER}"
  password = "${INFLUX_PASSWORD}"
  # The per-device user (dev_<KIB-SON>, ADR-0002) is WRITE-ONLY on device_metrics
  # and cannot CREATE the database — which already exists. Skip the create-check
  # so it doesn't log a harmless 403 every startup.
  skip_database_creation = true
  precision = "s"
  timeout = "5s"
  content_encoding = "gzip"       # ~50% less data over the wire

# Local InfluxDB (via Tailscale) — disabled until available
#[[outputs.influxdb]]
