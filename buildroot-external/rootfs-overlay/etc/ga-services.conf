# ga-services.conf — Central GA backend endpoint configuration
#
# ── DISCLOSURE: this file is in a PUBLIC repository, deliberately ────────────
# The addresses below are functional — the device needs them to resolve GA
# services — so they cannot be removed without breaking the product, and they
# have been public for months. That is an accepted trade, not an oversight.
#
# What must NOT be added here, or in a commit message touching this file:
# the STATE of any of these hosts. "X is unreachable", "Y still runs an expired
# certificate", "Z is the decommissioned one" turns a list of addresses into a
# map of where to look. An address alone is inert; an address plus its condition
# is a lead.
#
# Findings, measurements and host state belong in ga-ihost-docs (private) or the
# tracker. The public artefact names the CAUSE and the FIX and references them.
# Enforced for added lines by .github/workflows/disclosure-check.yml — but the
# gate only sees what a PR adds, so this note is the part that has to survive.
#
# This file defines the IP addresses for all GreenAutarky backend services.
# It is the SINGLE SOURCE OF TRUTH for GA endpoint resolution on the device.
#
# Two services consume this file at boot:
#
#   1. ga-resolve-ota.service — health-checks GA_OTA_IPS in priority order,
#      writes the first reachable IP to /run/ga-resolve-ota.active, and
#      retests periodically via ga-resolve-ota.timer (every 5min).
#
#   2. ga-update-hosts.service — generates /etc/hosts entries from this file
#      plus the dynamic OTA pick from /run/ga-resolve-ota.active. Re-runs
#      automatically when ga-resolve-ota detects a path change.
#
# RUNTIME OVERRIDE:
#   Copy this file to /mnt/data/ga-services.conf and edit. The override takes
#   precedence over the rootfs version. This allows IP changes without an OS
#   update (just SSH + edit + reboot — or `systemctl restart ga-resolve-ota`).
#
# IP CHANGE PROCEDURE:
#   1. Update this file in the source tree (for new builds)
#   2. For deployed devices: SSH and edit /mnt/data/ga-services.conf
#   3. Restart: systemctl restart ga-resolve-ota.service ga-update-hosts.service
#
# Format: KEY=value (sourced by /bin/sh, no spaces around =)

# ----- ga-tools server: OTA endpoint (multi-path failover) -----
#
# OTA bundle pulls work via several paths in priority order. During the
# 2026-06 ga-tools migration to the new host (ga-tools-hetzner), the NEW host
# is primary and the OLD host stays as a fallback until the migration is signed
# off (then a follow-up drops the old entries):
#   NEW ga-tools-hetzner:
#     1. NetBird VPN IP   (100.126.129.116) — preferred, WireGuard-encrypted mesh
#     2. Tailscale VPN IP (100.77.90.28)    — secondary mesh (only if tailscaled runs; future-proof)
#     3. Public-internet  (5.75.161.213)    — last resort for total VPN outage
#   OLD ga-tools (transition fallback, remove post-migration):
#     4. NetBird VPN IP   (100.126.142.217)
#     5. Public-internet  (164.30.7.180)
#
# ga-resolve-ota probes each in order at boot + every 5min, picks the first
# reachable one. Unreachable paths fail-fast (4s timeout) so the loop is quick.
# If all paths fail, the last-known-good is retained until the next probe.
GA_OTA_HOST=ota.greenautarky.com
GA_OTA_IPS="100.126.129.116 100.77.90.28 5.75.161.213 100.126.142.217 164.30.7.180"

# ----- ga-tools server: Logging/metrics (NetBird-only, direct backend) -----
#
# influx and loki are accessed directly on their native ports — they do NOT
# go through Caddy. Encryption is provided by the NetBird WireGuard tunnel,
# so plain HTTP on 8086/3100 is sufficient and intentional.
#   - influx.greenautarky.com:8086 — InfluxDB native (telegraf pushes metrics)
#   - loki.greenautarky.com:3100   — Loki native (fluent-bit pushes logs)
# 2026-06 migration: points at the NEW ga-tools-hetzner NetBird IP. This is a
# single IP (no failover by design) — influx/loki must be live on the new host
# before a device with this baked value cuts over (deployed devices use the
# /mnt/data runtime override for the staged per-device cutover). OLD was 100.126.142.217.
GA_SERVICES_IP=100.126.129.116
GA_INFLUX_HOST=influx.greenautarky.com
GA_LOKI_HOST=loki.greenautarky.com
# Fleet MQTT broker — resolved via /etc/hosts to GA_SERVICES_IP just like
# influx/loki, so the endpoint cutover covers MQTT uniformly. The device's
# /share/ga-fleet-mqtt.yaml carries this HOSTNAME (not a hardcoded IP), the
# token stays in /data/ga-fleet-mqtt.token. mosquitto :1884 native (plain over
# the WireGuard tunnel, per the TLS-skip lock).
GA_MQTT_HOST=mqtt.greenautarky.com

# ----- Fleet-manager (device self-enrollment, ADR-0010) -----
#
# ga-enroll.service POSTs /api/enroll here on every boot (host resolved
# via /etc/hosts to GA_SERVICES_IP like influx/loki/mqtt, so the endpoint
# cutover covers it uniformly). Leave GA_FLEET_HOST empty/absent to
# disable self-enrollment on an image.
GA_FLEET_HOST=fleet.greenautarky.com
GA_FLEET_PORT=8090

# ----- Connectivity check endpoint (public, not behind VPN) -----
GA_CHECKONLINE_HOST=checkonline.greenautarky.com
