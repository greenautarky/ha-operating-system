# Fluent-Bit Tier-0 (always-on, no consent gate).
#
# Ships baseline operational + security data that we process under
# DSGVO Art. 6 (b) Vertragserfüllung + (f) berechtigtes Interesse —
# NO consent required, see ga-ihost-docs/PRIVACY_TIERS.md.
#
# Scope is intentionally narrow:
#   - kernel panic / OOM / page-allocation-failure events
#   - RAUC update events (CRA-required: track update success/failure)
#   - failed-auth events on the device admin
#   - Supervisor service-failure events
#
# Storage buffer separate from tier1 so tier-0 backpressure can't
# starve tier-1 streams.

[SERVICE]
    Flush               5
    Daemon              Off
    Log_Level           info
    Parsers_File        parsers.conf
    HTTP_Server         Off
    Storage.path        /mnt/data/fluent-bit/storage/tier0
    Storage.sync        normal
    Storage.checksum    off
    Storage.backlog.mem_limit 5M

# --- Sources: kernel + RAUC + auth (all from journald) ---

[INPUT]
    Name                systemd
    Tag                 tier0.rauc
    DB                  /mnt/data/fluent-bit/db/tier0-rauc.db
    Systemd_Filter      _SYSTEMD_UNIT=rauc.service

[INPUT]
    Name                systemd
    Tag                 tier0.kernel
    DB                  /mnt/data/fluent-bit/db/tier0-kernel.db
    # PRIORITY filter: 0=emerg, 1=alert, 2=crit, 3=err
    Systemd_Filter      _TRANSPORT=kernel
    Systemd_Filter_Type Or
    Systemd_Filter      PRIORITY=0
    Systemd_Filter      PRIORITY=1
    Systemd_Filter      PRIORITY=2
    Systemd_Filter      PRIORITY=3

[INPUT]
    Name                systemd
    Tag                 tier0.auth
    DB                  /mnt/data/fluent-bit/db/tier0-auth.db
    # Catches sshd / pam / sudo authentication failures
    Systemd_Filter      _SYSTEMD_UNIT=sshd.service
    Systemd_Filter      _COMM=sudo

[INPUT]
    Name                systemd
    Tag                 tier0.supervisor
    DB                  /mnt/data/fluent-bit/db/tier0-supervisor.db
    Systemd_Filter      _SYSTEMD_UNIT=hassio-supervisor.service
    # Only failure-level entries from supervisor
    Systemd_Filter_Type Or
    Systemd_Filter      PRIORITY=0
    Systemd_Filter      PRIORITY=1
    Systemd_Filter      PRIORITY=2
    Systemd_Filter      PRIORITY=3

# --- Filters: stamp tier + identity ---

[FILTER]
    Name                modify
    Match               tier0.*
    Add                 tier 0
    Add                 device_label ${DEVICE_LABEL}
    Add                 device_uuid ${DEVICE_UUID}
    Add                 ga_env ${GA_ENV}

# --- Output: Loki on ga-tools ---

[OUTPUT]
    Name                loki
    Match               tier0.*
    Host                ${LOKI_HOST}
    Port                3100
    Tenant_ID           greenautarky
    Labels              tier=0, device_label=${DEVICE_LABEL}, ga_env=${GA_ENV}
    # Higher than tier1 so important events get through under backpressure
    Workers             1
    # Retry on network blips — Tier 0 is the most important stream
    Retry_Limit         False
