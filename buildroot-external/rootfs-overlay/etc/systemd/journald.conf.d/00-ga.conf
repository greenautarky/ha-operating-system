# GreenAutarky journald settings, on top of upstream HAOS's journald.conf
# (unmodified: Compress=yes, SystemMaxUse=500M). Until HAOS 18.x these were
# edits of that file. Board drop-ins (sorted after this one) may tighten them.
[Journal]
# Persistent storage ensures logs survive reboots (use journalctl -b -1 for previous boot)
Storage=persistent
# Keep logs from last 3 boots for crash analysis
MaxRetentionSec=7day
# Rate limiting — prevent a single misbehaving service from exhausting the 500MB journal.
# Production devices running tenant Home Assistant automations with broken Jinja2
# templates can generate thousands of error log lines per minute. Without rate
# limiting, this fills the journal in hours and rotates out boot/crash diagnostics.
# systemd-journald drops messages from a service that exceeds the burst within the
# interval and logs one "... messages suppressed" line instead. Per service (cgroup).
RateLimitIntervalSec=30s
RateLimitBurst=1000
