# GreenAutarky journald settings, on top of upstream HAOS's journald.conf
# (unmodified: Storage=auto, Compress=yes, SystemMaxUse=500M). Board drop-ins
# sort after this one; they may tighten the rate limits but MUST NOT set
# Storage= or RuntimeMaxUse= (tests/gates/journald_volatile reads the
# effective value over all drop-ins, per board).
[Journal]
# VOLATILE (Odoo #1256, option C): the journal lives in RAM (/run/log/journal)
# and is gone after a reboot. Persistent, journald was the largest single
# writer on the SD card (more than half of all writes on an idle device) and
# wrote many times what it stored. What a reboot would lose is kept by a
# bounded failure trail instead: /usr/libexec/ga-journal-dump writes the
# current boot's warnings and kernel/boot/RAUC/unit-failure evidence (max
# 2 MiB, newest 5 kept) to /mnt/data/journal-dump/ on clean shutdown, before a
# RAUC install and when ga-boot-check sees an unclean previous boot.
# `journalctl -b -1` no longer exists; read the dumps with:
#   zcat /mnt/data/journal-dump/dump-*.log.gz
# The log shippers (fluent-bit tier-0/tier-1) read the live journal, which
# works from /run as well. Upstream's /var/log/journal bind mount stays; it is
# no longer written.
Storage=volatile
# RAM budget of the journal (tmpfs). Oldest entries rotate out first. Sized
# for the smallest board (1 GiB RAM).
RuntimeMaxUse=64M
MaxRetentionSec=7day
# Rate limiting — prevent a single misbehaving service from flooding the
# journal. Production devices running tenant Home Assistant automations with
# broken Jinja2 templates can generate thousands of error log lines per
# minute; without a limit they rotate boot/crash diagnostics out of the
# journal. systemd-journald drops messages from a service that
# exceeds the burst within the interval and logs one "... messages suppressed"
# line instead. Per service (cgroup).
RateLimitIntervalSec=30s
RateLimitBurst=1000
