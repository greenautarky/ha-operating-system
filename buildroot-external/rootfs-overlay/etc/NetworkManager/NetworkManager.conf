[main]
dns=default
plugins=keyfile
# 0 means "retry forever" in NetworkManager. On a link-less eth0 with the
# ga-ethernet-force marker present that was ~15 activation attempts per second
# (818 in 60 s measured on K31 rc20, 2026-09-03), and the Supervisor mirrors
# every attempt over D-Bus until it wedges at 100 % CPU with its API dead
# (Odoo #753). 4 is NetworkManager's own default: a bounded burst, then the
# profile is blocked until the carrier changes. Measured with 4: 0 attempts
# in 60 s, Supervisor 0.1 % CPU.
autoconnect-retries-default=4
rc-manager=file

[keyfile]
unmanaged-devices=type:bridge;type:tun;driver:veth

[logging]
backend=journal

[connection]
connection.mdns=2
connection.llmnr=2
# No per-profile default for autoconnect-retries here: a value in this
# section is a PROPERTY DEFAULT and wins over [main]
# autoconnect-retries-default (NM consults the global default only when the
# property is -1). The former "connection.autoconnect-retries=0" (= retry
# forever) silently cancelled the bounded default above (Odoo #753).

[connection-wifi-defaults]
match-device=type:wifi
# Disable WiFi power save (2 = disabled) for stable connections
wifi.powersave=2
# Use permanent MAC address — no randomization for consistent device identity
wifi.cloned-mac-address=permanent
# Actively probe for hidden SSIDs
wifi.hidden=true
# Prefer WiFi over other connection types
connection.autoconnect-priority=100

# NetworkManager runs an HTTP probe in the background to determine whether
# devices have actual internet connectivity (used by `nmcli general status`,
# fallback-route ranking, and HA's connectivity hint). The probe MUST hit a
# URL that:
#   1. is whitelisted in the Vodafone fleet APN ACL (so it works on SIM dongles)
#   2. is operated by us (so it doesn't suddenly start serving 4xx/5xx or
#      change response body and break detection across the fleet)
#   3. returns exactly `NetworkManager is online` for the body match
#
# `https://checkonline.greenautarky.com/online.txt` is our dedicated endpoint
# for exactly this purpose. The greenautarky.com root domain hosts the public
# marketing site and is unsuitable as a probe target. `*.greenautarky.com` is
# in the Vodafone ACL, so this works through the constrained fleet APN.
[connectivity]
uri=https://checkonline.greenautarky.com/online.txt
response=NetworkManager is online
interval=600

[device]
# Disable scan-time MAC randomization — keep the hardware MAC visible during
# active scans. Cosmetic but helps fleet operators identify devices in
# sniffer logs.
wifi.scan-rand-mac-address=no
#
# Note: `wifi.mac-address-randomization` was the older NM config key for
# runtime randomization. NM logs `WARNING: unknown key` for it in our
# version — the key is no longer recognized. We removed it (used to be `=1`)
# to keep config logs clean. The effective control today is
# `wifi.cloned-mac-address=permanent` in [connection-wifi-defaults] above,
# which makes new connections use the hardware MAC. Verified on KIB-SON-0
# (2026-04-30): wlan0 cloned MAC == hardware MAC, no randomization.
