# GreenAutarky NetworkManager settings, on top of upstream HAOS's
# /etc/NetworkManager/NetworkManager.conf (unmodified). A conf.d key overrides
# the same key of the main file. Until HAOS 18.x these were edits of that file.

[main]
# 0 means "retry forever" in NetworkManager. On a link-less eth0 with the
# ga-ethernet-force marker present that was ~15 activation attempts per second
# (818 in 60 s measured on a bench unit, 2026-09-03), and the Supervisor mirrors
# every attempt over D-Bus until it wedges at 100 % CPU with its API dead
# (Odoo #753). 4 is NetworkManager's own default: a bounded burst, then the
# profile is blocked until the carrier changes. Measured with 4: 0 attempts
# in 60 s, Supervisor 0.1 % CPU.
# No per-profile autoconnect-retries default may be set in [connection]: a value
# there is a PROPERTY DEFAULT and wins over this global default (Odoo #753).
autoconnect-retries-default=4

[connection-wifi-defaults]
match-device=type:wifi
# Disable WiFi power save (2 = disabled) for stable connections
wifi.powersave=2
# Use permanent MAC address — no randomization for consistent device identity
wifi.cloned-mac-address=permanent
# Actively probe for hidden SSIDs
wifi.hidden=true
# Prefer WiFi over other connection types
connection.autoconnect-priority=100

# NetworkManager runs an HTTP probe in the background to determine whether
# devices have actual internet connectivity (used by `nmcli general status`,
# fallback-route ranking, and HA's connectivity hint). The probe MUST hit a
# URL that:
#   1. is whitelisted in the Vodafone fleet APN ACL (so it works on SIM dongles)
#   2. is operated by us (so it doesn't suddenly start serving 4xx/5xx or
#      change response body and break detection across the fleet)
#   3. returns exactly `NetworkManager is online` for the body match
#
# `https://checkonline.greenautarky.com/online.txt` is our dedicated endpoint
# for exactly this purpose. `*.greenautarky.com` is in the Vodafone ACL, so this
# works through the constrained fleet APN.
[connectivity]
uri=https://checkonline.greenautarky.com/online.txt
response=NetworkManager is online
interval=600
