# GA: keep the Home Assistant default NTP servers (time1-4.google.com) first and
# add time.cloudflare.com as the last fallback. Shipped in the image (not the
# /etc overlay, which is only seeded once and would never reach existing devices).
[Time]
FallbackNTP=time1.google.com time2.google.com time3.google.com time4.google.com time.cloudflare.com
