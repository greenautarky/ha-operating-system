[Unit]
RequiresMountsFor=/etc/ssh/keys /root/.ssh
# The dropbear invariant, carried over unchanged: never listen with nothing
# authorised. An empty authorized_keys means no sshd, not an open door.
ConditionFileNotEmpty=/root/.ssh/authorized_keys
# Systemd stops units in reverse start order, so ordering sshd before the
# Supervisor and Docker keeps SSH available while their (potentially minutes
# long) teardown runs. Both already require the same mounts sshd needs, so
# this adds no extra work to boot. (Upstream HAOS carries this as
# haos-supervisor.service; ours is still hassos-supervisor.service, KB #222.)
Before=hassos-supervisor.service docker.service

[Service]
# Buildroot's unit runs `ssh-keygen -A`, which would try to write host keys
# into the read-only /etc/ssh. Cleared; ga-sshd-prepare generates the ONE host
# key we use, in the overlay-backed /etc/ssh/keys.
ExecStartPre=
ExecStartPre=/usr/libexec/ga-sshd-prepare
KillMode=mixed
OOMPolicy=continue
