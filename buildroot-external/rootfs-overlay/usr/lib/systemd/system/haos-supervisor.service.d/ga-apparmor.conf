# GA: the Supervisor starts only with its AppArmor profile loaded (Odoo #1281,
# AA2). Upstream has Wants=haos-apparmor.service; Requires= makes a failed load
# stop the Supervisor here, visibly, instead of further down in docker run
# (--security-opt apparmor=hassio-supervisor). haos-apparmor loads the baked,
# sha256-pinned copy from the rootfs (patch 0132), so it does not depend on
# the network.
[Unit]
Requires=haos-apparmor.service
After=haos-apparmor.service
