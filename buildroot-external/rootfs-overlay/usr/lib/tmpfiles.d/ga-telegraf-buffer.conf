# /usr/lib/tmpfiles.d/ga-telegraf-buffer.conf
#
# Durable metric buffer for telegraf's native disk store-and-forward
# (buffer_strategy=disk_write_through, buffer_directory=/mnt/data/telegraf/buffer
# in telegraf.conf). The WAL persists here so metrics — incl. WiFi/LTE signal —
# survive a reboot DURING a WAN/LTE outage and are back-filled on recovery.
#
# MUST live under /mnt/data (HAOS /tmp is a 15 MB zram tmpfs —
# see memory:feedback_haos_tmp_zram_15mb).
#
# Size is bounded by `metric_buffer_limit` in telegraf.conf (the ring depth):
# at our metric volume that caps the dir at ~10 MB (≈ an 8-day outage). We do
# NOT age-out the contents here — that would corrupt telegraf's active WAL and
# lose buffered samples. Type `d` + age `-` = create-only, never clean.
#
#Type Path                        Mode UID  GID  Age Argument
d     /mnt/data/telegraf          0755 root root -   -
d     /mnt/data/telegraf/buffer   0755 root root -   -
