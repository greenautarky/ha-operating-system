# /usr/lib/tmpfiles.d/ga-mnt-data-tmp.conf
#
# Canonical scratch directory for anything that doesn't fit in /tmp
# (HAOS /tmp is a 15 MB zram tmpfs — see memory:feedback_haos_tmp_zram_15mb).
# Use /mnt/data/tmp/ for download staging, intermediate build artifacts
# during on-device operations, OTA bundles, etc.
#
# Files in this directory are aged out after 7 days by
# systemd-tmpfiles-clean.timer (= the standard /tmp cleanup hook,
# also covers /mnt/data/tmp/ because we list it here). The directory
# itself is never deleted — only its contents past the age threshold.
#
# Type column meanings (per systemd.tmpfiles(5)):
#   d  — create directory if absent, age-out contents
#   q  — create only (no clean) — useful for top-level mount points
# We use d here so the cleanup hook applies.

#Type Path           Mode UID  GID  Age Argument
d     /mnt/data/tmp  0755 root root 7d  -
