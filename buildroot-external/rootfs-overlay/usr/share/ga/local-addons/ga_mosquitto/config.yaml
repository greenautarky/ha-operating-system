---
version: 6.5.2
slug: ga_mosquitto
name: ga_Mosquitto broker
description: An Open Source MQTT broker
url: https://github.com/home-assistant/addons/tree/master/mosquitto
codenotary: notary@home-assistant.io
arch:
  - armv7
  - aarch64
  - amd64
auth_api: true
discovery:
  - mqtt
# `image:` — V1.2-clean OS bake. This addon is shipped as a Supervisor LOCAL
# addon (this dir is copied to /mnt/data/supervisor/addons/local/ga_mosquitto
# by ga-bootstrap.service). With `image:` set, the Supervisor INSTALLS from
# the pre-baked container image instead of building from a Dockerfile — so the
# install works fully offline (no network pull, no buildkit). The matching
# image `homeassistant/{arch}-addon-mosquitto:6.5.2` is baked into the data
# partition's docker store via buildroot-external/package/hassio/addon-images.json.
# Keep this `version:`, the addon-images.json `version`, and the image tag in
# lockstep. This addon is *installed* by ga_manager's `converge` worker (step 1,
# slug local_ga_mosquitto), not by ga-bootstrap — see VENDORED.md.
image: homeassistant/{arch}-addon-mosquitto
map:
  - ssl
  - share
options:
  logins: 
    - username: ga_zigbee2mqtt
      password: ga_zigbee2mqtt
    - username: ga_telegraf
      password: ga_telegraf
  require_certificate: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  customize:
    active: false
    folder: mosquitto
ports:
  1883/tcp: 1883
  1884/tcp: 1884
  8883/tcp: 8883
  8884/tcp: 8884
schema:
  logins:
    - username: str
      password: password
      password_pre_hashed: "bool?"
  require_certificate: bool
  certfile: str
  cafile: str?
  keyfile: str
  customize:
    active: bool
    folder: str
  debug: bool?
services:
  - mqtt:provide
startup: system
watchdog: tcp://[HOST]:1883
init: false
