# Boot filesystem for the OTA BUNDLE — deliberately NOT the same artifact as
# the SD image's boot.vfat.
#
# The two differ in exactly one file: /ga-ethernet-force. The SD image carries
# it (provisioning runs over the LAN socket, operator decision 2026-07-30); the
# OTA bundle must not, because the RAUC install_boot hook copies the bundle's
# boot partition over /mnt/boot wholesale and preserves only *.txt and grubenv.
# A marker inside the bundle is therefore RE-CREATED on every device an update
# reaches — including customer devices where the LAN socket was never on and
# nobody asked for it.
#
# Measured on the rc43 bundle, 2026-09-19:
#   unsquashfs bos_ihost-…raucb -> boot.vfat -> `GA-ETH~1  112  ga-ethernet-force`
# Before ha-operating-system#582 the defect was masked: ga-ethernet-retire.path
# won the race against ga-ethernet-guard.service, so the restored marker was
# deleted before anything read it. Fixing the race turned a dormant bug into a
# fleet-wide posture change, which is why this file exists.
#
# The durable switch is the fleet's, not the image's: ga_manager's
# `ethernet.force_enabled` writes an add-on-private marker that survives every
# reboot and is removed only when the fleet-manager clears it. Provisioning
# sets it; nothing else may.
image boot-ota.vfat {
	size = ${BOOT_SIZE:-PLEASE_SPECIFY_BOOT_SIZE}

	vfat {
		label = "hassos-boot"
	}
}
