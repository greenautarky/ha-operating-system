# QEMU CI — passwordless root autologin on the primary serial console.
#
# Rationale: the CI harness drives the VM via stdio (-nographic -serial
# stdio) and runs probes by typing into the shell. Having to crack a
# shadow hash on every CI run is operationally painful and would leak
# a build-time secret into the test harness for zero security benefit —
# the image is destroyed at teardown, and there is no network ingress.
#
# Drop-in scope: ONLY the qemu board overlay ships this file. The iHost
# board (which goes to production devices) does not contain this path
# in its rootfs-overlay, so production builds keep the standard shadow-
# backed login.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I 115200 linux
