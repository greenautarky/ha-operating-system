name: Lint (shellcheck + actionlint)

# NO `paths:` filter, deliberately.
#
# On 2026-07-30 shellcheck, actionlint and gate-selftest became REQUIRED status
# checks on master. A required check combined with a path filter is a deadlock:
# GitHub does not mark a filtered-out check as skipped-and-satisfied, it simply
# never reports, and the pull request stays "Expected — waiting for status" for
# ever. It was hit within the hour by a PR touching only .gitleaks.toml, which
# no path here matched.
#
# The filter was saving nothing worth having: these three jobs finish in about
# forty seconds in total on a GitHub-hosted runner and never touch the builder.
# The alternative — a companion job that reports success when the real one is
# skipped — buys the same result by asserting a green that nothing produced,
# which is the failure class this repo spent the day removing.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Why this exists:
#   The Version Chain Check workflow validates the version chain + source-level
#   test invariants, but it doesn't catch bash bugs (quoting, unused vars,
#   subshell pitfalls) or workflow-yaml mistakes (wrong action ref, missing
#   permissions). This workflow adds a thin lint pass over both.
#
# Severity:
#   shellcheck --severity=error  — actual bugs only, not style suggestions.
#                                   We can ratchet up later by removing the flag.
#   actionlint                   — default rules (good signal-to-noise).
#
# What's scanned:
#   - scripts/*.sh                                — build + release glue
#   - buildroot-ihost/rootfs-overlay/usr/sbin/ga-*  — on-device scripts
#   - buildroot-ihost/board/sonoff/ihost/**.sh    — board hooks
#   - buildroot-external/rootfs-overlay/usr/libexec/*  — /share bridge services
#   - tests/ga_tests/**/*.sh                      — test runner + fixtures
#   - .github/workflows/*.yml                     — actionlint

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The linter ships pre-installed on ubuntu-latest; the action skips what is
      # already there and only calls apt when it is genuinely missing.
      - name: Install shellcheck
        uses: ./.github/actions/apt-install
        with:
          packages: shellcheck

      - name: Show shellcheck version
        run: shellcheck --version | head -3

      - name: Lint shell scripts
        run: |
          set -e
          # COMPUTED, not curated. Until 2026-08-18 this was a hand-maintained
          # list of `find` paths, and it covered 111 of the repository's 175
          # shell scripts — 37% went unchecked, silently, because a lint that
          # runs over fewer files is still green. The misses were all
          # near-misses, which is how this rots:
          #
          #   buildroot-ihost/rootfs-overlay/usr/libexec  — the list had ../sbin
          #   buildroot-ihost/rootfs-overlay/usr/sbin     — listed, but only ga-*
          #   buildroot-external/scripts                  — the list had ./scripts
          #   tests/provisioning_e2e                      — the list had tests/ga_tests
          #   buildroot-external/package/hassio           — never listed
          #   board/{rpi5-64,asus,odroid-c2,arm-uefi}     — only board/sonoff/ihost
          #
          # tests/provisioning_e2e is the fresh-flash gate; the scripts under
          # buildroot-external/rootfs-overlay/usr/sbin ship on devices. Nothing
          # broken was hiding in the gap when it was measured (0 parse errors,
          # 0 real findings), but the flasher repo's equivalent gap held a script
          # that had not parsed since 2026-02-16.
          #
          # So: every tracked file that IS a shell script, by extension or by
          # shebang. Adding a directory can no longer mean forgetting to lint it.
          mapfile -t targets < <(
            git ls-files -z \
              | while IFS= read -r -d '' f; do
                  [ -f "$f" ] || continue
                  case "$f" in
                    *.sh) printf '%s\n' "$f"; continue ;;
                    # Binary and non-shell by extension. `.img` earned its place the
                    # hard way: two bootloader images start with NUL bytes, and
                    # reading them made bash warn once per file.
                    *.bak|*.png|*.jpg|*.jpeg|*.gif|*.ico|*.pdf) continue ;;
                    *.img|*.raucb|*.tar|*.gz|*.xz|*.zip|*.bin|*.der|*.pem) continue ;;
                    *.patch|*.drawio|*.woff|*.woff2|*.ttf) continue ;;
                  esac
                  # Shebang sniff for the extension-less ones — the /share
                  # bridge services (ga-share-publish, which exists to contain a
                  # privilege escalation) have no suffix.
                  # `tr -d '\0'` on BOTH reads: the repo tracks binary files,
                  # and a NUL inside a command substitution makes bash print
                  # "ignored null byte in input" once per file. The warning is
                  # harmless, which is exactly why it must go — CI output people
                  # learn to ignore is CI output that has stopped working.
                  [ "$(head -c 2 "$f" 2>/dev/null | tr -d '\0')" = '#!' ] || continue
                  case "$(head -n 1 "$f" 2>/dev/null | tr -d '\0')" in
                    *sh*) printf '%s\n' "$f" ;;
                  esac
                done
          )
          # A lint that inspects nothing is a false green, not a clean tree.
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::collected zero shell scripts — the collection is broken, not the tree"
            exit 1
          fi
          echo "Scanning ${#targets[@]} shell scripts:"
          printf '  %s\n' "${targets[@]}"
          echo ""
          # Severity = error keeps us out of style-bikeshed land. SC1091 is
          # source-not-found (expected: we source files from /mnt/data that
          # don't exist in the repo). SC2154 is unset-var-from-sourced-config.
          shellcheck \
            --severity=error \
            --exclude=SC1091,SC2154 \
            --color=always \
            "${targets[@]}"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          # actionlint releases a small static binary; use the upstream
          # download script which always picks the right arch.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
            >/dev/null
          ./actionlint --version

      - name: Lint workflows
        run: |
          # actionlint scans .github/workflows/*.yml by default. It also runs
          # an embedded linter on every `run:` block — by default at full
          # severity, which floods CI with SC2086 / SC2012 / SC2129 style
          # nits from existing workflows. Override to error-only so a single
          # source of truth governs what counts as a fail.
          ./actionlint -color -shellcheck 'shellcheck --severity=error'

  # Host-runnable device-test suites. These need nothing but sh + jq, so they
  # can gate every PR instead of waiting for a build or a bench device.
  #
  # They were previously unreachable from CI: the comment in run_all.sh pointed
  # at a qemu-ci.yml lane that no longer exists, so `share_publish` — the
  # regression suite for the /share symlink escalation (Vuln-2) — had not run
  # automatically since that workflow was removed. Both suites exit non-zero on
  # failure, so no extra parsing is needed.
  host-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        uses: ./.github/actions/apt-install
        with:
          packages: jq

      - name: ga-share-publish (/share symlink hardening)
        run: sh tests/ga_tests/share_publish/test.sh

      - name: RAUC slot contract (parser + fail-closed)
        run: sh tests/ga_tests/rauc_slots/test.sh

      - name: ga-stage-vendored-components (trusted staging root)
        run: sh tests/ga_tests/stage_components/test.sh

      - name: hassos-apparmor (profile presence + atomic download)
        run: sh tests/ga_tests/apparmor_profile/test.sh

      - name: ga-publish-services (services address -> /share bridge)
        run: sh tests/ga_tests/publish_services/test.sh

  # Prove the GATES can go red AND green — the thing review cannot see.
  #
  # A guard that cannot fail is indistinguishable from a guard that works, and
  # on 2026-07-30 an adversarial re-read found several of one day's new guards
  # in exactly that state. The norm already asked for a red proof pasted into
  # the PR; a paste is evidence once. This runs the same evidence on every PR,
  # so a gate cannot quietly rot into decoration between reviews.
  #
  # Fixtures live in tests/gates/<gate>/{must-fail,must-pass}. must-pass is not
  # padding: a gate that flags everything gets overridden by reflex, which is a
  # slower way of having no gate at all.
  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate self-tests (each pattern fires on known-bad, stays quiet on known-good)
        run: ./tests/gates/run_gate_selftests.sh

      # The apt-install action, proven against the failure it was written for: a
      # hung mirror. Runs here rather than in version-check because it must run
      # even when version-check itself cannot — which was the situation on
      # 2026-08-19.
      - name: apt-install action (a hang must fail, not wedge)
        run: ./tests/gates/apt_install/selftest.sh

      # The lockstep gate's three verdicts must stay apart: drift FAILS, a canary
      # store is its own outcome, and a release revision like z2m's `2.12.1-3` is
      # not a canary. Runs the real check-images.sh over scratch pin files and a
      # throwaway store repo — no registry, no network.
      - name: Lockstep gate (drift vs canary vs revision)
        run: ./tests/gates/lockstep_prerelease/selftest.sh

      # scripts/repin-addons.py rewrites the bake pins to the store and stamps the
      # rc marker — the hand-edit that a typo used to turn into a red bake found
      # late. Its selftest drives BOTH repin and the REAL check-images.sh over the
      # same scratch fixtures, so a pin repin would write that the enforcing gate
      # then rejects cannot pass here, and --check is proven to go red on drift and
      # green on lockstep. No registry, no network.
      - name: Repin tool (agrees with the lockstep gate; red on drift, green on lockstep)
        run: ./tests/gates/repin_addons/selftest.sh

      # A pinned add-on that never made it into the image used to count as
      # "skipped" while the build suite still printed a pass line — and
      # sonoff_dongle_flasher had never once been checked, because the pin key
      # spells it with underscores and the tar with dashes. Presence is a local
      # fact, so this runs here with --no-registry on fixture filenames taken
      # from a real bake.
      - name: Baked add-on images (a pin that is not in the image must go red)
        run: ./tests/gates/baked_addon_images/selftest.sh

      # Same idea, applied to the on-device provisioning checks. They normally
      # need a flashed device, so they were unprovable in CI and PROV-06 in fact
      # reported "self-check PASSED" on a device with no identity at all (K31,
      # 2026-08-17). Running the live check script against fixture device trees
      # proves red AND green here, on every PR, with no hardware.
      - name: Provisioning phase invariants (red + green on fixture device trees)
        run: ./tests/ga_tests/provisioning/selftest.sh

      # The fresh-flash gate needs a card, a MUX and a power plug, so it cannot
      # run here — but its verdict logic can, and the exit code is what a bake
      # job would act on. Asserted without a pipe, because a pipe reports the
      # pipe's status and that is how a gate looks green while failing.
      - name: Provisioning gate verdict logic (exit codes on the same fixtures)
        run: ./tests/provisioning_e2e/selftest.sh
