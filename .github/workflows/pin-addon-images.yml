name: pin-addon-images

# The OS pins itself against the published add-on store instead of being pushed
# to.
#
# Until now every add-on's CI opened this repo's pin PR with a cross-repo write
# token (DOWNSTREAM_SYNC_PAT). That meant handing a write credential to each
# add-on repo — including one that is public — and it made the pin depend on
# some add-on happening to build. Here the direction is reversed: the store is
# PUBLIC, so this repo can read it with no credential at all and open its own
# PR with its own GITHUB_TOKEN.
#
# Proposes, never merges: a bake pin is a release decision.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/check-addon-pins.py"
      - ".github/workflows/pin-addon-images.yml"
      - "buildroot-external/package/hassio/addon-images.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: greenautarky/vibe_addons
          path: .store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --quiet "PyYAML>=6,<7"

      # On a PR: report only. Drift is not a reason to fail someone else's PR,
      # but an unreadable store or a comparison that inspected nothing is.
      - name: Compare pins against the published store
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-addon-pins.py --store .store || true

      - name: Update the pins
        if: github.event_name != 'pull_request'
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/check-addon-pins.py --store .store --apply
          if git diff --quiet buildroot-external/package/hassio/addon-images.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pins already match the store — nothing to propose"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --unified=0 buildroot-external/package/hassio/addon-images.json
          fi

      # FAIL-CLOSED. This step used to end `gh pr create ... || echo "PR for
      # $br already exists — branch updated"`, which turned EVERY creation
      # failure into a green run: the branch was pushed, no PR appeared, and
      # nobody noticed until a human diffed the pins by hand. Measured —
      # run 32704749191 (2026-08-24) logged
      #   pull request create failed: GraphQL: GitHub Actions is not permitted
      #   to create or approve pull requests (createPullRequest)
      #   PR for ci/pin-addon-images-ec30e67 already exists — branch updated
      # and exited 0; #385 (and #380 three days earlier) had to be opened by
      # hand. Now: "already exists" is checked EXPLICITLY (the one legitimate
      # no-op), creation goes through the REST API so the error comes back as
      # a printable response, and any failure fails the JOB with the compare
      # URL so a human can open the PR in one click.
      #
      # NOTE the underlying refusal is the repo's Actions policy
      # (can_approve_pull_request_reviews=false), which blocks PR creation for
      # GITHUB_TOKEN on REST exactly as on GraphQL — switching transports does
      # not fix it, it only makes the failure printable. Until an admin flips
      # that setting (see the error text below), this job now goes RED instead
      # of silently doing half its work.
      - name: Open the pin PR (fail-closed)
        if: github.event_name != 'pull_request' && steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          br="ci/pin-addon-images-$(git rev-parse --short HEAD)"
          git config user.name "ga-ci-bot"
          git config user.email "ci@greenautarky.com"
          git checkout -b "$br"
          git commit -am "chore(bake): pin add-on images to the published store versions"
          git push -f origin "$br"

          base="${{ github.event.repository.default_branch }}"
          compare="${{ github.server_url }}/${{ github.repository }}/compare/$base...$br?expand=1"

          existing=$(gh api "repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:$br&state=open" \
            --jq '.[0].html_url // empty')
          if [ -n "$existing" ]; then
            echo "PR already open: $existing — branch force-updated with the fresh diff"
            exit 0
          fi

          if resp=$(gh api "repos/${{ github.repository }}/pulls" \
              -f title="chore(bake): pin add-on images to the published store versions" \
              -f head="$br" \
              -f base="$base" \
              -f body="Opened by \`pin-addon-images\`. The versions come from the PUBLIC greenautarky/vibe_addons store — the same entry the Supervisor reads on the device — so this pins what devices would actually install. Review the diff and merge before the next OS bake." 2>&1); then
            echo "opened: $(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["html_url"])')"
          else
            echo "::error::PR creation FAILED for branch $br — the pin diff IS pushed, but no PR announces it. Failing the job so someone sees it."
            echo "::error::Open it by hand: $compare"
            echo "--- API response ---"
            printf '%s\n' "$resp"
            echo "--- If the response says Actions may not create PRs, an admin flips the policy with:"
            echo "    gh api -X PUT repos/${{ github.repository }}/actions/permissions/workflow -f default_workflow_permissions=read -F can_approve_pull_request_reviews=true"
            exit 1
          fi
