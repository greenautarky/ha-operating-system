name: Version Chain Check

on:
  push:
    branches: [master]
    # Run on any source change that could break the version chain or build
    # invariants. The earlier path-list (only hassio/** + check-images.sh)
    # missed openstick / wifi / kernel changes, ga_build.sh changes (where
    # MAKE_OVERRIDES lives), new test additions, and workflow self-edits.
    paths:
      # version.yaml was missing here until 2026-07-28 — the file the version
      # chain is ABOUT did not trigger the check that validates it. A release
      # bump (gaos_release, component pins) therefore went unvalidated until
      # some unrelated push under one of the other paths happened to run it.
      - 'version.yaml'
      - 'buildroot-external/**'
      - 'buildroot-ihost/**'
      - 'scripts/**'
      - 'tests/ga_tests/**'
      - '.github/workflows/version-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'version.yaml'
      - 'buildroot-external/**'
      - 'buildroot-ihost/**'
      - 'scripts/**'
      - 'tests/ga_tests/**'
      - '.github/workflows/version-check.yml'
  workflow_dispatch:

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq skopeo

      # The ga_manager packages went PRIVATE on 2026-07-29 (the public image
      # shipped the full addon source — see ADDON-IMAGE-DELIVERY.md). An
      # unauthenticated runner can no longer see them, so check-images.sh would
      # report them UNVERIFIED (exit 2) and this job would go permanently
      # yellow-then-red for a perfectly healthy registry.
      #
      # GHCR_READ_TOKEN = a read:packages-only token. It grants nothing but
      # pulling greenautarky images; it must NOT be a repo-scoped PAT.
      # Without the secret the job still runs and fails loudly rather than
      # skipping the check — a false green here is worse than a red one
      # (retro 2026-07-27: the version badge stayed green through a real
      # store/bake divergence for 21 minutes).
      - name: Log in to GHCR (private addon images)
        env:
          GHCR_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "::error::GHCR_READ_TOKEN secret is not set — private addon images cannot be verified."
            echo "Add a read:packages-only token as repo secrets GHCR_READ_USER + GHCR_READ_TOKEN."
            exit 1
          fi
          echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${GHCR_USER:-x-access-token}" --password-stdin
          echo "Logged in to ghcr.io as ${GHCR_USER:-x-access-token}"

      - name: Run image availability check
        run: ./scripts/check-images.sh

      - name: Run source-level build tests
        run: |
          # The runner needs an OUT arg to derive SRC=$OUT/.. — without it
          # the script exits at line 9 (${1:?Usage:...}) before any test
          # runs. We pass a dummy ga_output dir inside the workspace so
          # SRC=$GITHUB_WORKSPACE for source-level checks; all build-output
          # tests fail predictably because the dir is empty.
          export REPO_ROOT="${GITHUB_WORKSPACE}"
          export FRONTEND_ROOT=""  # skip frontend source checks in CI
          mkdir -p "${GITHUB_WORKSPACE}/ga_output"
          bash tests/ga_tests/run_build_tests.sh "${GITHUB_WORKSPACE}/ga_output" \
            2>&1 | tee test-output.txt
          rc=${PIPESTATUS[0]}
          # We only care about source-level failures here. Build-output
          # tests will run as part of the actual prod build (bake.yml in
          # the private ga-ops repo, on the ga-builder runner).
          # Filter is INCLUSIVE — only count FAILs from
          # source-level test prefixes (SRC-, VER-, XVER-). Anything
          # else is build-output-dependent and expected to fail in CI
          # where no rootfs/, target/, or version.json exists.
          src_fails=$(grep -E '^\s*FAIL\s+(SRC-|VER-|XVER-)' test-output.txt || true)
          if [ -n "$src_fails" ]; then
            echo "::error::Source-level tests failed:"
            echo "$src_fails"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            # Script exited non-zero — that's expected, build-output tests
            # have no rootfs to check against. We only care about source-level.
            echo "Note: script exited rc=$rc, but no source-level FAILs detected (build-output tests will run during the ga-ops bake against the real rootfs)."
          fi
          echo "Source-level tests passed."
