name: Secret Scan

# Why this exists alongside GitHub's own secret scanning:
#
# GitHub secret scanning + push protection are enabled on all our public repos,
# but they only match KNOWN PROVIDER token formats. The two settings that catch
# generic credentials — `secret_scanning_non_provider_patterns` and
# `secret_scanning_validity_checks` — are not available on this org's plan
# (verified 2026-07-28: repo-level PATCH returns 200 and the value stays
# `disabled`; org-level `secret_scanning_validity_checks_enabled` is False).
#
# That gap is not theoretical. The InfluxDB `device_writer` credential leaked
# into this repo's public history was a plain user/password pair — no provider
# pattern would ever have matched it.
#
# gitleaks closes that gap with entropy + regex rules. It also scans HISTORY,
# which push protection by construction cannot: push protection only guards
# commits going forward.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Monday 06:17 UTC, ahead of the CVE scan at 07:23
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the complete history instead of the recent range'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for anything but a PR diff — a shallow
          # clone silently scans almost nothing and still reports success.
          fetch-depth: 0

      # Pinned by DIGEST, not by tag: a moved tag can swap the scanner binary
      # underneath us. Same rule as the package source pins (SRC-PIN-01/02).
      # v8.30.1, resolved 2026-07-28. To update:
      #   docker buildx imagetools inspect ghcr.io/gitleaks/gitleaks:vX.Y.Z
      - name: Run gitleaks
        env:
          IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          mkdir -p reports

          # Scheduled and manual runs sweep the whole history; PR runs check
          # only what the PR adds, so the job stays fast on every push.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCOPE="--log-opts=origin/${{ github.base_ref }}..HEAD"
            echo "Scope: PR diff against ${{ github.base_ref }}"
          else
            SCOPE="--log-opts=--all"
            echo "Scope: complete history (all refs)"
          fi

          set +e
          # --config is passed explicitly rather than relying on auto-discovery:
          # if .gitleaks.toml is ever renamed or dropped, gitleaks errors out and
          # the rc>1 branch below fails the job, instead of silently reverting to
          # the default ruleset and re-reporting the revoked findings it records.
          docker run --rm -v "$PWD:/repo" -w /repo "$IMAGE" \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose \
            --report-format=sarif --report-path=/repo/reports/gitleaks.sarif \
            $SCOPE
          rc=$?
          set -e

          # gitleaks: 0 = clean, 1 = leaks found, anything else = it broke.
          # A scanner that failed to run must never read as "no leaks" — the
          # same fail-closed rule as the CVE scan (see docs/CVE-HANDLING.md).
          if [ "$rc" -gt 1 ]; then
            echo "::error::gitleaks did not run correctly (exit $rc) — this is NOT a clean result"
            exit 1
          fi

          # rc alone is not enough to tell "found something" from "could not
          # start". Measured against the pinned digest: a malformed or missing
          # --config makes gitleaks log `FTL unable to load gitleaks config`
          # and exit 1 — the SAME code as "leaks found". The job would still
          # fail, so the outcome was fail-closed, but it reported a secret that
          # does not exist and sent the reader hunting for it. The comment above
          # claiming rc>1 covers this was simply wrong.
          #
          # A run that produced no report did not scan. Say that instead.
          if [ ! -s reports/gitleaks.sarif ]; then
            echo "::error::gitleaks produced no SARIF report — it did not scan. This is NOT a clean result and NOT a finding; check the log above for a config or image error."
            exit 1
          fi

          COUNT=$(jq '[.runs[].results[]] | length' reports/gitleaks.sarif 2>/dev/null || echo "?")
          echo "findings=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "## Secret scan"
            echo ""
            echo "- Scope: \`$SCOPE\`"
            echo "- Findings: **$COUNT**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -eq 1 ]; then
            echo "::error::gitleaks found $COUNT potential secret(s) — see the SARIF artifact"
            exit 1
          fi
          echo "No secrets found."

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-${{ github.run_number }}
          path: reports/
          retention-days: 90
