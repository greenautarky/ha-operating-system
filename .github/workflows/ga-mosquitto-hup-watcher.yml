name: Build & Push (GHCR) - ga-mosquitto-hup-watcher

# Phase 1g sidecar image build. Triggers on changes to the watcher's
# Dockerfile / watch.sh / README. Multi-arch (amd64 + arm64) so the
# image works on ga-tools (= x86_64) AND on future ARM-based ops hosts.
#
# Image: ghcr.io/greenautarky/ga-mosquitto-hup-watcher:<version>
#
# See [[design_phase_1g_mosquitto_hup_2026_06_22]] for the design.

on:
  push:
    branches: [master]
    paths:
      - 'infrastructure/mosquitto-hup-watcher/**'
      - '.github/workflows/ga-mosquitto-hup-watcher.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.2.0)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          # workflow_dispatch → use the operator-supplied input.
          # push → read VERSION file if present, else default to "0.1.0".
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ -f infrastructure/mosquitto-hup-watcher/VERSION ]]; then
            VERSION="$(cat infrastructure/mosquitto-hup-watcher/VERSION | tr -d '[:space:]')"
          else
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/greenautarky/ga-mosquitto-hup-watcher
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: infrastructure/mosquitto-hup-watcher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
