# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.3.0-rc51  # marker baked into /etc/ga-release at build. rc51 = rc50 + the AI mode where the valve runs the plan (ADR-0021 amendment 2026-09-25, proven on a canary the same evening). (1) ga-heating 0.10.1 -> 0.11.0: in AI the valves run the room plan in their own z2m auto (clock symbol), only after every day of the mirrored plan reads back; a UI setpoint or a mode switch on the device puts the whole room manual for 3 h, then back to AI; overrides take valves out of auto and back; max 5 plan entries per day enforced server-side; a valve command that cannot be delivered is a warning, not a lost task. (2) ga_hmvapp_addon 2.4.0 -> 2.5.0: AI decisions are gated on the ROOM mode (a valve in auto still gets offsets); opening degree and mode requests as contract-2 proposals behind options, both off. (3) ga_manager 0.207.0 -> 0.208.0: a heating room that appears after rooms-sync still gets its first plan. (4) ga-frontend-bundle 1.19.0 -> 1.20.0: the room heading shows the room temperature again (from the ga_heating room: room sensor first, valve fallback). PREVIOUS rc50 (2026-09-24): rc50 = rc49 + the first bake under ADR-0027 D9 (one OTA key, one build mode) + ga_manager 0.202.0 -> 0.207.0: interview_state reaches the pairing feed (0.204.0); rooms-sync writes the first heating plan after an installation (0.205.0); ga.heating_plan warns on a heating room without a plan (0.206.0); ga.zigbee_commands reports commands a valve did not take, from zigbee2mqtt's own log, text-free (0.207.0); installation state stored and shown (0.203.0). ga-frontend-bundle 1.18.0 -> 1.19.0: Einstellungen carries household management, and an invite shows a shareable link. PREVIOUS rc49 (2026-09-24): rc49 = rc48 + two fixes found on a clean-flashed canary. (1) ga-heating 0.10.0 -> 0.10.1: a boost or an absence reaches the room's state when it is set. The service and the route stored the override and never re-rendered the room, so with a silent valve the card showed 'Inaktiv' while a holiday was stored. (2) greenautarky-site 2.9.4 -> 2.9.5: the account step survives a dropped request. A create_user cut off between credential and link left an address that could never be used again; the step now heals it after a password check and cannot be split by a disconnect. (3) ga_manager 0.201.0 -> 0.202.0: no device change (CI only) — its own bake-pin PR now carries expected.env, the first one that merged without a hand-added commit. PREVIOUS rc48 (2026-09-23): the resident's heating surface and the default plans.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.9.5"  # 2.9.5 (2026-09-24): the account step survives a dropped request — heal an unlinked credential after a password check, shielded creation (greenautarky-onboarding#64). PREVIOUS 2.9.4.
  greenautarky-telemetry:  "0.2.4"   # 0.2.4 (2026-09-17): async_set_preferences — one entry point for a consent decision (#2). https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.20.0"  # 1.20.0 (2026-09-25): room temperature badge back, from the ga_heating room entity (#37). 1.19.0 (2026-09-24): Einstellungen = management card, invite shows the shareable link (#34, #35). 1.18.0 (2026-09-23): the whole-home heating controls on a `Profil` tab — boost, alle AUS, Sonderplan (Krankheit/Urlaub) — with Ahmad's own labels from the previous system, the status always visible and the form behind a toggle. `Alle AUS` says at which temperature the valves open again, READ from each valve's frost_protection_temperature (7 °C on our fleet, not the 5 the vendor documents). 1.17.0 never shipped. Also: the thermostat card leads with the TARGET and the weekly plan is never an empty form (five fixed times, padded from what is already in force — never an invented value). The room views no longer badge the measurement. PREVIOUS 1.15.0: while the heating plan is paused, the card says for how long — remaining time AND wall-clock, plus what takes over at zero. The data was there all along (`manual_until` on the room entity, since ga_heating 0.5.0) and never rendered. Three ways it shows nothing rather than something wrong: no override, an expired one (ga_heating clears the attribute on its next tick — silence beats counting backwards), and a timestamp that does not parse. 1.14.0: un-confirmed intent expires after 8 s. In `auto` the plan owns the setpoint, so a write is accepted with 200 and changes nothing — the pending value was never confirmed, the early return fired on every state update for ever, and the card stopped following the device at all. PREVIOUS 1.13.0: four defects on the resident's screen, all measured in a browser on 2026-09-16 once rc37's registry fix made the cards visible at all. The card never said whether the room was being HEATED — the state lived in the `dial` variant only while the device ships `setpoint`, and was inferred from `target > current` rather than read from `hvac_action`, which is wrong in both directions and silently so. Setpoint presses were lost (nine gave seven steps): each press read the last value the backend confirmed, and every state update replaced the button mid-click; the card now carries the resident's intent, sends one command per burst, and binds its listener to the root. The 24-hour charts drew three curves per sensor under three identical labels, because `statistics-graph` names a series after the entity and never says which statistic it is — one curve per sensor now. And the sidebar stayed open on every first load: the asset fired its event at `home-assistant`, which exists in index.html from the first byte, before the app had attached the listener, then reported success — so the retry it had been given never ran. It waits for the effect now. PREVIOUS 1.12.0: the cards reach the browser. Home Assistant's frontend installs a scoped-custom-element-registry polyfill that replaces window.customElements with a new, empty registry on the app bundle's first line. Assets injected through add_extra_js_url are imported inline from index.html and race that bootstrap, so a card that registered before the swap defined itself into a registry the app then threw away — silently, with no error on either side, and the element never upgrades. Every first-party asset is now delivered as a Lovelace resource, which the panel loads after bootstrap; add_extra_js_url is kept as an explicit allow-list for assets that define no custom element; and ga-registry-guard fails loudly instead of registering into a registry that is about to be replaced. PREVIOUS 1.11.0: the resident's screen says what it means — devices carry a human name instead of a radio address, the 24-hour heating plan has a real time axis (the hour had lived only in a hover tooltip), and the history section renders only when Home Assistant's `history` integration is actually loaded, announcing its absence at console.warn with the cause instead of drawing a card that only reports being off. PREVIOUS 1.10.0: resident-clean UI defaults (hide Haushalt/Ohne Raum, collapse sidebar on first load). https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G). rc37: 1.9.1 pairs with site 2.1.1 for the scoping repair.
  ga-heating:              "0.11.0"  # 0.11.0 (2026-09-25): in AI the valves run the room plan in their own auto (ADR-0021 amendment 2026-09-25, ga-heating#42). 0.10.1 (2026-09-24): boost / absence / cancel re-render the room via _republish_room, so an override is visible when set (ga-heating#40). PREVIOUS 0.10.0.

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.9"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs). v1.2.9 lifts a blocking Supervisor job condition instead of retrying it for 8 min: 'StoreManager.add_repository blocked, supervisor needs to be updated first' is a job condition, not the transient git race the retry loop was built for. It left EVERY freshly flashed device with no store, no add-ons and no ga_manager while booting fine and answering on serial (K31, 2026-07-30). Pairs with the hassio.mk channel fix that removes the cause.
  ga-telemetry-config:  "1.0.3"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.5.3"  # 2025.11.5.3: the forward-port onto upstream 2025.11.5 (ha-supervisor #32), carrying the four API fields Core 2026.8/2026.9 require via aiohasupervisor 0.6.0 (#25) and reference_extra (#27). armv7 is kept OUT of the unsupported set — upstream #5620 would otherwise trip JobCondition.ARCHITECTURE_SUPPORTED and stop Updater.fetch_data, so the device would never read stable.json again; observed on K31 2026-09-09 and now asserted in CI. Proven on K31 the same day: the eight endpoints Core gathers at startup went from 4 of 8 unreadable to 8 of 8, healthy, 7/7 add-ons, restarts=0. PREVIOUS 2025.11.4.8.
