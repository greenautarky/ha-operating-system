# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built separately (see ga_manager etc.) and pinned via
# buildroot-external/package/hassio/addon-images.json — they are listed
# here for visibility, not consumed at OS build time.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.2.21-rc6  # marker baked into /etc/ga-release at build. BOSv1.2.21-rc6 = rc5 content PLUS the ga-update-hosts fleet-cutover hardening (#115): self-clean stale /etc/hosts GA lines (host + Supervisor container) so an old backend IP can never win the files lookup, and bounce endpoint-bound clients (fluent-bit/telegraf) via /mnt/data/.ga-services-applied-ip change-detection so a cutover re-resolves immediately without manual surgery. Bumped from rc5 so canaries on rc3/rc4/rc5 are OTA-distinguishable for the ga-tools→Hetzner endpoint cutover (K7 already manually cut over; rest self-heal on this OTA reboot). BOSv1.2.21-rc5 = rc4 content PLUS ga_manager 0.57.0 (ADR-0004/0005 zigbee live-maintenance + pairing + permit-join/remove + installation-window; pairs with fleet-mgr 0.34.0 managed role-based auth). NOTE: inherits the rc4 migration-IP cutover (ga-services.conf -> Hetzner .116 primary, old .142.217 fallback) -- for a zigbee canary test that is fine (connectivity via old fallback; zigbee is local). BOSv1.2.21-rc4 = rc3 content (edge-buffered telegraf + cred-reader, onboarding 1.0.4 LED, ga-bootstrap 1.2.8, ga_manager 0.53.0) PLUS the ga-tools→Hetzner migration IP cutover (ga-services.conf GA_OTA_IPS/GA_SERVICES_IP → new host 100.126.129.116, #111). Bumped from rc3 so the same-HAOS-version (16.3.1.9) bake is OTA-distinguishable for the canary cutover (devices carry rc2/rc3). BOSv1.2.21-rc3 = ga_manager 0.45.5 baked (device-id self-heal from /share/ga-fleet-mqtt.yaml username, kills the K6/K7/K10/K17/K49 cascade flap loop where all 5 devices collided on client_id="ga_manager_remote_<unknown>"). rc2 = ga_manager 0.45.4 baked (MQTT v5 + clean_start, didn't actually fix the bug; rc3 supersedes). rc1 = ga_manager 0.45.2 baked (2-client MQTT facade + privacy Layer-1/2/3 incl. SSID-redact with GA-prefix whitelist + nested-dict gate, ga-addon-prime Supervisor-ready probe + no-op-success). BOSv1.2.18+ = ga_manager 0.42.0 + path-watcher trampoline (= /share/ga-rauc-install-request → host .path/.service) for fleet-wide cascade without operator SSH.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-onboarding: "1.0.4"   # https://github.com/greenautarky/greenautarky-onboarding
  ga-frontend-bundle:       "1.0.1"  # https://github.com/greenautarky/ga-frontend-bundle (14 vendored Lovelace cards, ~6 MB; was embedded)

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.8"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs).
  ga-telemetry-config:  "1.0.0"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

addons:
  # Built by their own repos' CI; pinned for visibility. The actual
  # pin consumed at OS build is in buildroot-external/package/hassio/addon-images.json.
  ga_manager:               "0.45.2"  # 0.45.x = Phase 1 MQTT facade (2-client: local broker for Z2M/legacy + remote broker on ga-tools:1884 for ga/v1/* publishes). 0.45.1 fixed K0 canary bugs (creds-write HTTP route, identity fallback, SSID privacy redact, list recursion). 0.45.2 fixed Layer-3 whitelist nested-dict regression. 0.44.0 added self-update CLI fallback (= `docker exec hassio_cli ha addons update <self>` for the Supervisor 403 guard). 0.44.1 fixed `ha` CLI not in addon container. 0.43.0 = z2m/ui badges + cleanup. 0.42.0 path-watcher trampoline.
  ga_default_addon:         "1.1.2"
  ga_hmvapp_addon:          "1.1.7"

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.4.6"
