# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.3.0-rc10  # marker baked into /etc/ga-release at build. BOSv1.3.0-rc10 = rc9 PLUS the room-sync feature and the onboarding repair, and it exists because rc9 shipped neither. WHAT IS NEW: ga_manager 0.130.0 -> 0.132.0 and greenautarky-site 2.2.0 -> 2.3.0. THE PART THAT MATTERS TO A RESIDENT: on rc9 a device could finish provisioning, pass every check, and still show an empty screen with nobody able to complete setup on it. Converge armed the customer wizard only on the single run that created the HA owner, so any device whose owner already existed - an interrupted run, a watchdog, a reflash - never got the trigger file. The site component reads an ABSENT trigger as 'an old field-upgraded device' and answers completed=true, so the device reported itself set up while no resident account existed and the dashboard had nothing to draw. Measured on K31 the afternoon of 2026-08-25: three rooms, five Zigbee devices, Core onboarding finished, empty UI. The premise that default rests on - that provisioning always writes the entry - was true until the stage pipeline was retired on 2026-08-18, and nothing connected the two. Home Assistant's own onboarding had the same shape and the same cause: 0.130.0 completed it only when it created the owner, so an interruption left it permanently at done=['user']. Both now key on the STATE rather than on who created the owner - an existing owner means skip creation, never skip completion; an existing tenant means do not arm, an absent one means arm. An unreadable auth store refuses to arm and says so, because dropping a live resident into a setup wizard is damage they see while an unarmed wizard is a defect a check reports. GUARDED THREE WAYS, because a fix without a detector only covers the cause you already know: ga.wizard_state separates 'not finished' (a person is thinking) from 'never armed' (this device cannot onboard anyone) and stays quiet on genuinely older devices; ga.console_login probes the login endpoint rather than the secret file, because a device can be perfect except for the one door people come through - an SD flash takes the console secret with it and the only symptom is a bare 503; and FEAT-16/17/18 assert the same three states from the device test suite. FEAT-17 asks Core's live config rather than a .storage file Core may never write - the first version went red on a device that was entirely correct. ALSO IN THIS RELEASE: the rooms-sync feature across four repos - GACI pushes a flat's room list to the fleet-manager, which delivers it to the device; ga_manager gains the worker, the site component makes the rooms real, and device-api stops opening an MQTT socket entirely (ADR-0008). WHAT MUST BE PROVEN ON HARDWARE, and is deliberately not assumed: that a fresh flash reaches a working resident UI with NOBODY intervening. rc9 got there only because four operator steps were run by hand afterwards. PREVIOUS (rc9): BOSv1.3.0-rc9 = rc8 PLUS ONE THING: supervisor 2025.11.4.7 -> 2025.11.4.8. WHAT IT FIXES: the Supervisor image shipped its upstream base-python layer as the upstream tag left it. Upstream does not rebuild that tag, so its Alpine packages aged in place while Alpine kept publishing fixes on the very same 3.22 branch. Measured on the PUBLISHED armv7 images, 95 packages scanned on both sides: 2025.11.4.7 had 35 fixable HIGH/CRITICAL of which 2 CRITICAL (bind 26, libexpat 3, c-ares, libxml2, musl, musl-utils, nghttp2-libs, zlib); 2025.11.4.8 has 0. The identical package count is the coverage assertion - without it a scan that matched nothing reports clean and looks the same. The fix is one line in OUR Dockerfile (apk --no-cache upgrade ahead of apk add, ha-supervisor#29), not a newer base: there is no newer upstream armv7 base line, and the floating tag resolves to the same digest as the dated one. Every finding already had a fix waiting inside 3.22. GUARDED by ha-supervisor#30, a gating CVE scan between build and push whose coverage assertion exits 2 on a zero-package scan, with must-fail and must-pass fixtures that ship with it and run in CI. HOW THE PIN WAS CHOSEN, because it is the part that nearly went wrong: this fork publishes from a release line that is not its default branch, and the two carry different behaviour for the Core image the Supervisor pulls. The pin was therefore verified against the image the release line actually produced, not against whatever the default branch would build. Details and the reconciliation work are in the internal tracker. ALSO MEASURED, not changed: this fork tracks an upstream Supervisor release from 2025-11 while upstream has moved on by 594 commits, and upstream's current build matrix no longer includes armv7 at all - its base image dropped the per-architecture naming with it. Moving the fork forward therefore means owning the armv7 Supervisor build outright rather than bumping a version. ADR-0016 territory, a decision rather than a chore, and deliberately not started here. NOTHING ELSE CHANGED vs rc8: all 8 addon pins and all 6 component pins were re-measured against what is published and every one was already newest. WHAT MUST BE PROVEN ON HARDWARE, and is not assumed: fresh-SD cold boot; zero-touch provisioning; HA Core's own onboarding arriving COMPLETE without anyone clicking; then all three device suites UNPATCHED. PREVIOUS (rc8): BOSv1.3.0-rc8 = rc7 PLUS ONE THING, and it is the one a resident would have met first. WHAT IS NEW: ga_manager 0.129.0->0.130.0 — converge now FINISHES Home Assistant's own onboarding. Measured on K31 the morning of 2026-08-25: a device flashed from rc7 completed the GreenAutarky customer wizard and Home Assistant then asked the resident to enter a location the device already had (the Berlin seed converge writes on first boot). Core's store said done=["user"] and had said so since the flash. THREE THINGS WERE WRONG and the third is why nobody saw the first two: only core_config was attempted, and analytics + integration were never posted at all; it posted an EMPTY body; and it sat in a try/except logging a warning, while an HTTP 401 raises nothing — so the failure left NO log line whatsoever and the entire converge log on K31 contains not one core_config entry. THE ACTUAL BUG IS THE TOKEN: the onboarding endpoints are unauthenticated only WHILE the user step is pending, and the call that completes that step is the one returning the token for all the others. The old code's own comment guessed this and guessed wrong; the token sat in the response it already held and was discarded. Every remaining step now gets it, core_config is posted with the location/timezone/units converge already seeded, and each step reports its outcome at a level matching what it costs — a half-finished provisioning can no longer be silent. GUARDED, so the next fresh flash catches it instead of a person: provision-verify gains ha_onboarding_complete, reading CORE'S OWN store rather than converge's job output, naming the missing steps, and treating an absent store as skip and never as a pass. 15 tests, each defect injected separately. NOTHING ALSO IN rc8, and it is bookkeeping rather than behaviour: ga_zigbee2mqtt 2.12.1-3->2.12.1-4. That version exists because merging the z2m self-build branch to master fires a publish on all three of its trigger paths, and that publish would otherwise have REWRITTEN :2.12.1-3 — the tag rc7 pins and the canary was running, whose 41-of-41 device evidence is attached to that exact artefact. Same source, new version string, so the proven image stayed proven. Store and pin move together; z2m does not use the shared lockstep, so its store copy is hand-maintained and lagged by half a day until the pin-drift check said so. NOTHING ELSE CHANGED on the device: the four commits on master since rc7 are test and CI work (#394 canonical CVE gate, #395 three stale gate checks, #396 SD-01/02 naming the oldest artefact, #397 the device_features suite). WHAT MUST BE PROVEN ON HARDWARE, and is not assumed: fresh-SD cold boot; zero-touch provisioning; HA Core's onboarding arriving COMPLETE without anyone clicking; then all three device suites UNPATCHED. PREVIOUS (rc7): rc7 = rc5 PLUS everything below. WHY rc7 AND NOT rc6: an rc6 bake DID succeed (13:16 UTC) and its image is on the builder, but it carries the STABLE component set while its own updater.json declares beta - the artefact contradicts its marker. Reusing rc6 for a corrected image would put two materially different artefacts behind one /etc/ga-release value, the exact ambiguity rc38->rc39 already paid for. HOW THAT HAPPENED, because it is the interesting part: the defconfig said BETA and buildroot's .config said BETA, but version.json - the only carrier of channel-resolved component versions - was REUSED from a 2026-08-20 tree. ga_build.sh's update mode deletes four stamps and not .stamp_configured, so buildroot never re-ran CONFIGURE_CMDS. Worse: hassio.mk's OWN version.json validation lives inside those CONFIGURE_CMDS, so on a reused tree the check that exists to catch this never ran either - a skipped check reads exactly like a passed one. Fifth instance of 'reused state != declaration' here (pipelines vs build.yaml; bake vs submodule pointer; output tree vs buildroot; store vs pin; now version.json vs channel). Fixed at the root (os#391) plus a channel input, a post-build assertion and a stale-wipe in the bake (ga-ops#41, 24 CI fixtures, red-proved against this exact shape). WHAT IS NEW vs rc5: (A) CANARY BUILD ON THE BETA CHANNEL - the defconfig selects BR2_PACKAGE_HASSIO_CHANNEL_BETA, and the bake resolves Supervisor, Core and all five plugins from greenautarky/haos-version {channel}.json AT BUILD TIME and pre-loads them. So this image carries what the fleet gets NEXT: supervisor 2025.11.4.7 (the per-device Core-image-override fix #706/#23, proven on K31 by having our Supervisor pull and start a GA Core image with the real config) and the first two GA-BUILT Supervisor plugins, armv7-hassio-dns 2025.08.1 + armv7-hassio-cli 2025.10.1 - which exist because upstream's plugin repos now HARD-FAIL on armv7, the same trajectory that already ended HA Core armv7 (ADR-0016). A device flashed from this image also RUNS on beta; flip the defconfig back for a fleet build. (B) THE ROOM-THERMOSTAT FEATURE, WHOLE: ga-heating 0.1.0->0.2.0 (23 commits, six weeks unreleased - one override stack instead of three mechanisms; room thermostats that register their own entity id; a room with no reachable radiator or no thermometer SAYS so; multi-day/multi-room plans; dated absence plans on our own API; a health entity visible off the device) AND greenautarky-site 2.1.1->2.2.0 (the home model derives one thermostat per room instead of hiding valves). These are two halves of ONE feature that sat in two repos, each looking small; a third half - the fleet-manager not knowing ga-heating existed, so drift showed ZERO - landed as fm 0.105.0 together with an isolation fix so one component's GHCR 404 can no longer take the whole drift route down. (C) TWO SECURITY FIXES THAT WERE STRANDED: ga_influxdbv1 0.0.6->0.0.7 (the shared secret was world-readable on /share; published 08-21, pinned by nobody until the bake's source-drift gate refused this build over it) and ga_default_addon 1.3.1->1.4.0 (cloud DB credentials stop being baked into the image and become add-on options; 1.3.2 had been RED for three days because the store half was never landed). 1.4.0 also gates the cloud push behind an explicit legacy_cloud_push option, default false, so a current system cannot push even with credentials present - and fixes a LARGER leak found on the way: debug_environment() printed /data/options.json verbatim into the container log on every start, DB/INFLUXDB/MQTT passwords and the TB token in clear text, because the masking used a hand-kept key list. Rotating the affected cloud credentials is tracked separately and is the only thing that fully closes the exposure this release reduces; details are in the private tracker, not here. (D) mosquitto 7.2.2->7.2.3 (shared base resolver, no content change) and the host firewall now allows :80 as well as :8123, because current HA Core serves its UI on :80 by default and the allowlist would have blackholed it on eth0/wlan0 while the mesh still worked. The comma in CONTAINER_ALLOW_TCP is load-bearing: a space yields an nft set nft rejects, and ga-firewall-gate DELETES the table on a failed load, i.e. the device would ship UNFILTERED (verified with nft -c). WHAT MUST BE PROVEN ON HARDWARE, and is not assumed: fresh-SD cold boot; zero-touch provisioning; then BOTH device suites UNPATCHED - os_integrity now also asserts the supervisor channel against the defconfig and every plugin's image:tag against the channel JSON (OSI-19..24), and addons_running asserts the dns plugin actually RESOLVES for an add-on and for Core, because a running-but-broken resolver takes every image pull, every MQTT reconnect and Core itself down with it while the container reads as Up. Everything the rc5 entry says about the exec-bit class and the keyring line boundary applies unchanged. PREVIOUS (rc5): rc5 = rc4 PLUS two OS-layer changes and, for the first time, a deliberate CHANNEL choice. WHAT IS NEW: (A) mosquitto pin 7.2.2->7.2.3 (os#385) - the store moved when MQTT adopted the shared base resolver and the pin lagged over a weekend; the version-check gate caught it on master, which is the first time that gate earned its keep. (B) host firewall now allows :80 as well as :8123 (os#382): current HA Core serves its UI on :80 by default, and the allowlist would have blackholed it on eth0/wlan0 while the mesh still worked - an on-site-only breakage. The comma in CONTAINER_ALLOW_TCP is load-bearing: a space yields an nft set nft rejects, and ga-firewall-gate DELETES the table on a failed load, i.e. the device would ship UNFILTERED (verified with nft -c). (C) THIS IS A CANARY BUILD: the defconfig now selects BR2_PACKAGE_HASSIO_CHANNEL_BETA. The bake resolves Supervisor, Core and all five Supervisor plugins from greenautarky/haos-version {channel}.json AT BUILD TIME and pre-loads them into the image, so this image carries what the fleet gets NEXT: supervisor 2025.11.4.7 (the per-device Core-image-override fix, #706/#23 - proven on K31 2026-08-24 by having our Supervisor pull and start a GA Core image with the real config) and the first two GA-BUILT Supervisor plugins, armv7-hassio-dns 2025.08.1 + armv7-hassio-cli 2025.10.1. Those exist because upstream's plugin repos now HARD-FAIL on armv7 in their Dockerfiles - the images the fleet runs survive only as frozen tags, the same trajectory that already ended HA Core armv7 (ADR-0016). A device flashed from this image also RUNS on the beta channel; flip the defconfig back to stable for a fleet build. WHAT MUST BE PROVEN, and why it is not assumed: fresh-SD cold boot; zero-touch provisioning; then BOTH device suites UNPATCHED - os_integrity now also asserts the supervisor channel against this defconfig and every plugin's image:tag against the channel JSON (OSI-19..24), and addons_running asserts the dns plugin actually RESOLVES for an add-on and for Core, because a running-but-broken resolver takes every image pull, every MQTT reconnect and Core itself down with it while the container reads as Up. Everything the rc5 entry says about the exec-bit class and the keyring line boundary applies unchanged. PREVIOUS (rc5): rc5 = rc4 PLUS the fleet fix for a boot-blocking defect found by running the addons on a real device. THE DEFECT: the s6 scripts in ga-addon-base shipped 100644 (no exec bits) in BOTH flavours - the fork recreated upstream's files without their modes - so EVERY addon built on ga-addon-base-armv7:3.24 / ga-addon-debian-base:trixie crash-looped at /init with 'unable to exec .../base-addon-banner: Permission denied' (exit 126). Nothing caught it because every test - base CI smoke, CVE gate, publish checks, the QEMU pilots, even on-device throwaway runs - overrode the entrypoint; /init was the least- tested path and the only one a device uses. Found on K31 2026-08-21 the first time the real Supervisor started the addons on a fresh rc4 provisioning. FIXED three ways (ga-addon-base#4): git modes restored, Dockerfile chmod as a belt, and a NEW CI boot-test that runs the container via /init the way the Supervisor does (proven red against the broken :3.24, green after). All six fleet addons rebuilt FROM the fixed base and re-pinned: ga_manager 0.128.0->0.129.0 (also fixes a SECOND K31 finding - the health engine auto-restarted the dongle flasher that #199/ADR-0015 deliberately keep stopped; now skips INSTALL_ONLY addons, red-proof test added), mosquitto 7.2.1->7.2.2, ga_influxdbv1 0.0.5->0.0.6, ga_default_addon 1.3.0->1.3.1, ga_hmvapp_addon 1.4.0->1.4.1, ga_ihosthardwarecontrol 1.2.0->1.2.1. Two device test suites now exist (os_integrity: declared-vs-flashed; addons_running: every pinned addon up+answering, fleet-manager-independent) - on rc4 they passed 14/14 and 15/16 only AFTER a manual overlay chmod on K31; rc5 must pass BOTH UNPATCHED, which is the whole point of this build. OS layer (kernel 6.12.103, OpenSSL 3.5.7 via the submodule-sync fix) is unchanged from rc4 and already boot-proven, but rc5 re-proves boot on a fresh SD because the addon images changed. PREVIOUS (rc4): rc4 = rc3 REBUILT WITH THE DECLARED BUILDROOT. The rc3 image does not match the rc3 declaration: the bake's sync step moved the submodule POINTER but never ran `git submodule update`, so rc3 was built from buildroot 2025.02.11 and ships OpenSSL 3.4.4 while master declared 2025.02.16/OpenSSL 3.5.7 (os#369). Found on the flashed device (K31, 2026-08-20: `openssl version` = 3.4.4 against a merged declaration of 3.5.7), fixed in ga-ops#38 (submodule sync + a fail-closed assertion that the checkout matches the pin). Content is otherwise rc3's; the marker changes because the artefact changes — same rule as rc38->rc39. Kernel 6.12.103 was unaffected (defconfig lives in the main repo) and is already boot-proven on K31 from the rc3 flash. rc4 must re-prove: fresh-SD boot, and `openssl version` = 3.5.7 on the device. PREVIOUS (rc3): rc3 = rc2 PLUS the 2026-08-20 add-on base migration and the OS-layer bumps, and it exists because the rc2 IMAGE (baked 2026-08-18) predates all of it - reusing a marker for materially different content makes /etc/ga-release ambiguous, the exact confusion rc38->rc39 and rc1->rc2 already paid for. WHAT IS NEW: (A) every fleet add-on moved off its FROZEN upstream armv7 base onto a GreenAutarky-owned or current base, in lockstep pins (addon-images.json): ga_manager 0.113.0->0.128.0 (armv7 on ga-addon-base-armv7:3.24, aarch64/amd64 on hassio-addons/base:21.0.2 - the frozen 18.2.1 line measured 21 fixable HIGH/CRITICAL vs 0 on the new bases), mosquitto 7.1.2->7.2.1 (Debian trixie via ga-addon-debian-base, go-auth CGO plugin proven loading on RV1126; libwebsockets now cloned from github.com/warmcat pinned to a COMMIT after libwebsockets.org was unreachable on all ports), ga_influxdbv1 0.0.4->0.0.5 (trixie, glibc 2.41, OpenSSL 3.0.15->3.5.6, exercised INSERT/SELECT + nginx lua auth on device), ga_default_addon 1.2.0->1.3.0 and ga_hmvapp_addon 1.3.1->1.4.0 (Alpine 3.24/py3.14, Nuitka obfuscation proven, py3-influxdb moved apk->pip 5.3.2 because Alpine dropped the package after 3.21; NOTE pandas 2.2.3->3.0.3 is a MAJOR bump proven by import only - observe on canary), ga_ihosthardwarecontrol 1.1.3->1.2.0 (base declared in build.yaml for the first time; Node 22->24 proven by a cold CI npm install, serialport is Node-API/ABI-stable). All six published through CVE gates that now ASSERT COVERAGE (a bare trivy exit-code returns 0 on zero matched packages - measured, the gate reported success on an image it could not scan). (B) kernel 6.12.51->6.12.103 (#371): 52 stable point releases incl. a CISA-KEV-listed algif_aead CVE; all 5 out-of-tree patches apply clean; BOOTABILITY NOT YET PROVEN - first flash must be a fresh SD on a bench canary, an OTA that fails to boot rolls back and proves nothing about cold boot. (C) buildroot 2025.02.11->2025.02.16 (#369): OpenSSL 3.4.4->3.5.7 in the OS layer itself, equally unproven on hardware. PROMOTION GATE: unchanged from rc2 - [2] OTA install and [3] rollback were proven on K31 2026-08-18 for the rc2 artefact; rc3 must re-prove boot (fresh SD) because of (B) and (C). Everything the rc1 entry says about the line boundary and NOT raising hassos.ihost while v1.2 devices remain applies unchanged. PREVIOUS (rc2): rc2 = rc1 PLUS the 2026-08-17/18 provisioning series, and it exists because the rc1 IMAGE predates all of it: the only rc1 artefact is a DEV build from 2026-07-30 (gaos-rc1dev-20260730.img.xz on the bench), while nine commits landed after it. Reusing the rc1 marker for materially different content makes /etc/ga-release ambiguous - the exact confusion rc38 -> rc39 already paid for. WHAT IS NEW: (A) ga_manager pin 0.106.0 -> 0.113.0 (#335/#336/#339) - carries the two-marker convergence split (.ga_converged_base vs .ga_converged), set-hostname with internal_url, the /info hostname field, provision-verify as a job, and the downstream-lockstep retry. The two-marker split is the fix for a REAL defect measured on K31 2026-08-17: with one job runner, identity-write landed nine seconds AFTER converge had written its completion marker, so a device reported converged with a PASSING self-check while holding no device_id, url_prefix or PIN. (B) the fresh-flash provisioning gate (#332/#333/#338) - flash, boot, self-provision, with deadlines; its first hardware run on 2026-08-18 found THREE checks in the gate itself that could not do their job (a serial reader assuming a logged-in console, a boot proof passing on a stale udev symlink at t+6s, a byte count calling a binary absent from PATH), all fixed and fixture-pinned. (C) security.txt per RFC 9116 (#331). (D) shellcheck now covers 175 of 175 tracked shell scripts, computed rather than curated (#340) - it had covered 111. PROMOTION GATE STATUS for this line (KB #180), four items on real hardware: [1] keyring on device - not yet re-checked on rc2; [2] OTA install with the new chain - NOT YET POSSIBLE before this build: no bundle signed with the post-cut chain existed, so no v1.3 device had ever installed an OTA (K31 slot B empty, ever_installed=false, rollback.possible=false). rc2 is the first bundle that can prove it; [3] rollback - blocked behind [2]; [4] an old-key bundle REJECTED - **PASSED 2026-08-18 on K31**: rauc install of the pre-cut bos_ihost-16.3.1.9_prod_20260729185057.raucb failed CLOSED at 20% with 'signature verification failed: unable to get local issuer certificate', wrote nothing, and left slot A booted and the device fully functional. Everything the rc1 entry below says about the line boundary, the single trust anchor and NOT raising hassos.ihost while v1.2 devices remain applies unchanged to rc2. PREVIOUS (v1.3, rc1): marker baked into /etc/ga-release at build. FIRST BUILD OF THE v1.3 LINE. The line boundary is the OTA signing-key rotation (CLEAN CUT, operator decision 2026-07-29): the RAUC keyring goes from THREE trust anchors to exactly ONE, the new GreenAutarky OTA Root CA 2026 (C1:B7:57..., valid to 2041). Dropped: iHost RAUC Dev CA (FE:4E:81...) and the retired F13 CA (01:E7:CE...) - neither has a private key on the builder, so neither could ever sign anything - and the self-signed build cert (5E:D6:AF...) that install_rauc_certs() appended silently because it did not chain to the CA. The new signing cert DOES chain to the root, so nothing is appended, and the next signing-key rotation becomes a build-server change the fleet never sees. The retired-CA bridge is DELETED, not disabled (2026-07-30): GA_LEGACY_CA_BRIDGE, ota/legacy-signing-cert.pem and add_legacy_ca_if_enabled() are all gone, guarded by SRC-21 + KEYRING-06 asserting their ABSENCE. Bridge-forward for pre-cut devices is unaffected - that signs a NEW image with the OLD KEY (archived off the builder and retained there) and never needed the retired cert in a keyring. WHY A NEW LINE AND NOT rc40: a device on the v1.2 line CANNOT install this bundle or any later one - its keyring does not know this root. That is the definition of a line boundary here. Pre-cut devices are replaced or reflashed BY HAND, never migrated over the air. DO NOT raise hassos.ihost in stable.json while v1.2 devices remain: they would be offered an image they cannot verify. It fails closed, but it produces fleet-wide failed installs. Serve freshly flashed units explicitly via push-ota.sh. -rc1 until the promotion gate passes on real hardware (KB #180): keyring on device, OTA install with the new chain, rollback, and an old-key bundle REJECTED. PREVIOUS LINE (v1.2, rc39): marker baked into /etc/ga-release at build. BOSv1.2.21-rc39 = rc38 PLUS the 2026-07-29 add-on-boundary series: six changes that all move a file OFF the /share add-on<->host bridge, because /share is writable by every add-on declaring share:rw and several of those files are inputs to a decision rather than read-outs. (A) fluent-bit source ALLOWLIST (#275) — the systemd input no longer takes docker.service, the HA Core tail is parked, and container logs are matched by name suffix with a severity filter; PRIORITY does not bound container output because the journald driver stamps all stderr as PRIORITY 3. (B) host firewall DEFAULT-ON (#276) — denylist becomes allowlist on eth0/wlan0, SSH + the HA UI only, ICMPv6 ND/RA preserved; the escape hatch is /mnt/boot/ga-firewall-off. RPCBIND/NFS dropped from the defconfig (inherited from upstream HAOS, no device mounts NFS). (C) ethernet ABSENT MEANS OFF (#277) — polarity inverted, link is taken down not just deconfigured, and the operator override marker lives in the add-on-private dir and must name THIS device. (D) RAUC dual-slot snapshot published to the add-on-private dir (#279) — the rollback pre-flight decides from it. (E) device identity read from the add-on-private dir (#280) — device_id keys the MQTT ACLs, fleet attribution and the Loki/Influx labels. (F) vendored custom_components staged to the add-on-private dir (#285) — the biggest one: that tree is a CODE path, Core imports what the placer copies out of it, and the manifest version-gate is a CHANGE gate, not a TRUST gate (the writer owns both sides of the comparison). /share is still written for ga_manager < 0.105.0. PINS: ga_manager 0.100.0 -> 0.105.0 (five releases had piled up unpinned behind a version check that only compares the bake pin to the store, never to the source), mosquitto 7.1.1 -> 7.1.2 (files-only ACL denied every SUBSCRIBE on a FRESH broker start -> z2m crash-loop; image published 2026-07-17, never pinned), ga_influxdbv1 0.0.3 -> 0.0.4 (per_user_secrets prep, default-off no-op), ga-telemetry-config 1.0.1 -> 1.0.2 (three broken tier-0 journald filters: the kernel input was not restricted to the kernel transport, the supervisor filter matched the wrong field, dropbear was missing from auth). WHY rc39 AND NOT rc38: an rc38 image was already built and flashed to the bench on 2026-07-28; reusing the marker for materially different content makes /etc/ga-release ambiguous, which is the exact confusion a same-version cutover already causes. PREVIOUS (rc38): marker baked into /etc/ga-release at build. BOSv1.2.21-rc38 = rc37 PLUS the U-Boot autoboot lockdown — the FIRST device-visible bootloader change in this series, and the only reason this rc exists (components are unchanged from rc37: greenautarky-site 2.1.1, ga-frontend-bundle 1.9.1, ga_manager 0.99.0). CONFIG_BOOTDELAY moves 3 -> -2: "-2" is U-Boot's "autoboot with no delay and do NOT check for a keypress". Any value >= 0 leaves a serial window in which an attacker with physical access interrupts autoboot and appends init=/bin/sh to the bootargs, getting a root shell before any userspace auth exists. With an UNENCRYPTED rootfs that carries fleet-shared secrets (the shared root SSH key, the reusable NetBird setup key, the fleet-wide console-login HMAC), that is not one compromised device — it is a fleet compromise (EN 18031-1 SSM-3 / CCK-3, analysis 2026-07-28). OPERATIONAL CONSEQUENCE, read before flashing: the U-Boot prompt is no longer reachable on the serial console. Serial getty login, RAUC rollback and SD-MUX reflash are all unaffected and remain the recovery paths — but there is no longer a bootloader-level escape hatch, so a bad kernel must be recovered via RAUC or a reflash. BENCH-TEST ON A CANARY BEFORE THE RING: prove getty, rollback and reflash on K31 first. Guarded by UBOOT-01 (source config) and UBOOT-02 (built .config) in run_build_tests.sh.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.5.0"   # 2.2.0: one thermostat per room, derived rather than by hiding valves (#33) — the pair of ga-heating 0.2.0, released together 2026-08-24 for canary testing. PREVIOUS 2.1.1: OCI ghcr.io/greenautarky/greenautarky-site:2.1.1 — component rename greenautarky_onboarding -> greenautarky_site (#574); was greenautarky-onboarding 1.8.0. NOTE: GitHub SOURCE REPO not yet renamed — still https://github.com/greenautarky/greenautarky-onboarding. Room-Scoping Stage A+B COMPLETE (incr 1-3, WS+REST leak_guard) + entity scoping DEFAULT ON (only restricts real sub-users) rc36: 2.1.0 adds the resident self-service reset (Danger Zone) — see gaos_release (G); NO feature gate. rc37: 2.1.1 repairs Stage-B scoping — sub-user dashboards rendered BLANK on rc36 (leak_guard proxy + json_fragment filtering); see gaos_release.
  greenautarky-telemetry:  "0.2.3"   # https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.9.1"  # https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G). rc37: 1.9.1 pairs with site 2.1.1 for the scoping repair.
  ga-heating:              "0.2.1"  # 0.2.0 (2026-08-24, canary testing): one override stack instead of three mechanisms; room thermostats that register their own entity id and say when they have no reachable radiator or no thermometer; multi-day/multi-room plans; dated absence plans on our own API; a health entity visible off the device. 23 commits that had sat unreleased for six weeks. PREVIOUS 0.1.0: https://github.com/greenautarky/ga-heating — weekly heating plan: stored + executed on the device via climate.set_temperature (works with ANY thermostat), mirrored into a TRV that can hold a plan. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE, gm 0.86.0).

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.9"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs). v1.2.9 lifts a blocking Supervisor job condition instead of retrying it for 8 min: 'StoreManager.add_repository blocked, supervisor needs to be updated first' is a job condition, not the transient git race the retry loop was built for. It left EVERY freshly flashed device with no store, no add-ons and no ga_manager while booting fine and answering on serial (K31, 2026-07-30). Pairs with the hassio.mk channel fix that removes the cause.
  ga-telemetry-config:  "1.0.2"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.4.8"
