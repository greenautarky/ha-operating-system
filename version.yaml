# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.3.0-rc23  # marker baked into /etc/ga-release at build. rc23 = rc22 + the ADR-0021 heating decision contract v1, proven end to end on canary K31 on 2026-09-03: ga-heating 0.4.0 consumes a desired offset per valve (sensor.hm_<ieee>_desired_offset, contract 1, valid_until) through its own deadband, 10-minute rate limit and clamp and stays the ONLY sender on the valves; ga_hmvapp_addon 2.0.1 reads device state from Home Assistant instead of a recorder history that is empty on this line, publishes decisions instead of writing valves, keeps one long-lived MQTT client and a 60 s cycle, and writes a liveness row per room per cycle into gd_data.hm_liveness; ga_default_addon 2.1.0 reads the device identity itself. Device suite heating: 8 passed, 0 failed, 1 skipped on K31 (HEAT-05 saw 0 valve writes over 1856 add-on log lines, HEAT-06 a valid decision per valve, HEAT-07 a liveness row under 5 minutes, HEAT-08 one broker connection from the engine in 10 minutes). Store synced in lockstep. KNOWN, tracked in ADR-0021 open points 3 and 4: the engine reads a room's mode from the valve, which ga_heating drives in heat, so the AI branch does not run on a GA device; and a device with no gd_data.system_info row cannot bootstrap model state. Neither blocks the delivery seam this release proves.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.5.0"   # 2.2.0: one thermostat per room, derived rather than by hiding valves (#33) — the pair of ga-heating 0.2.0, released together 2026-08-24 for canary testing. PREVIOUS 2.1.1: OCI ghcr.io/greenautarky/greenautarky-site:2.1.1 — component rename greenautarky_onboarding -> greenautarky_site (#574); was greenautarky-onboarding 1.8.0. NOTE: GitHub SOURCE REPO not yet renamed — still https://github.com/greenautarky/greenautarky-onboarding. Room-Scoping Stage A+B COMPLETE (incr 1-3, WS+REST leak_guard) + entity scoping DEFAULT ON (only restricts real sub-users) rc36: 2.1.0 adds the resident self-service reset (Danger Zone) — see gaos_release (G); NO feature gate. rc37: 2.1.1 repairs Stage-B scoping — sub-user dashboards rendered BLANK on rc36 (leak_guard proxy + json_fragment filtering); see gaos_release.
  greenautarky-telemetry:  "0.2.3"   # https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.9.1"  # https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G). rc37: 1.9.1 pairs with site 2.1.1 for the scoping repair.
  ga-heating:              "0.4.0"  # 0.4.0 (2026-09-03, ADR-0021 §3): consumes the heating decision contract v1 — the closed engine (hmvapp) proposes an offset per valve via sensor.hm_<ieee>_desired_offset, ga_heating stays the only writer; expired/malformed decisions fall back to the room formula; attribute calibration gains source/reason. 0.3.0: valve calibration moved into ga_heating.

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.9"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs). v1.2.9 lifts a blocking Supervisor job condition instead of retrying it for 8 min: 'StoreManager.add_repository blocked, supervisor needs to be updated first' is a job condition, not the transient git race the retry loop was built for. It left EVERY freshly flashed device with no store, no add-ons and no ga_manager while booting fine and answering on serial (K31, 2026-07-30). Pairs with the hassio.mk channel fix that removes the cause.
  ga-telemetry-config:  "1.0.3"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.4.8"
