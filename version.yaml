# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.3.0-rc1  # marker baked into /etc/ga-release at build. FIRST BUILD OF THE v1.3 LINE. The line boundary is the OTA signing-key rotation (CLEAN CUT, operator decision 2026-07-29): the RAUC keyring goes from THREE trust anchors to exactly ONE, the new GreenAutarky OTA Root CA 2026 (C1:B7:57..., valid to 2041). Dropped: iHost RAUC Dev CA (FE:4E:81...) and the retired F13 CA (01:E7:CE...) - neither has a private key on the builder, so neither could ever sign anything - and the self-signed build cert (5E:D6:AF...) that install_rauc_certs() appended silently because it did not chain to the CA. The new signing cert DOES chain to the root, so nothing is appended, and the next signing-key rotation becomes a build-server change the fleet never sees. GA_LEGACY_CA_BRIDGE=false. WHY A NEW LINE AND NOT rc40: a device on the v1.2 line CANNOT install this bundle or any later one - its keyring does not know this root. That is the definition of a line boundary here. Pre-cut devices are replaced or reflashed BY HAND, never migrated over the air. DO NOT raise hassos.ihost in stable.json while v1.2 devices remain: they would be offered an image they cannot verify. It fails closed, but it produces fleet-wide failed installs. Serve freshly flashed units explicitly via push-ota.sh. -rc1 until the promotion gate passes on real hardware (KB #180): keyring on device, OTA install with the new chain, rollback, and an old-key bundle REJECTED. PREVIOUS LINE (v1.2, rc39): marker baked into /etc/ga-release at build. BOSv1.2.21-rc39 = rc38 PLUS the 2026-07-29 add-on-boundary series: six changes that all move a file OFF the /share add-on<->host bridge, because /share is writable by every add-on declaring share:rw and several of those files are inputs to a decision rather than read-outs. (A) fluent-bit source ALLOWLIST (#275) — the systemd input no longer takes docker.service, the HA Core tail is parked, and container logs are matched by name suffix with a severity filter; PRIORITY does not bound container output because the journald driver stamps all stderr as PRIORITY 3. (B) host firewall DEFAULT-ON (#276) — denylist becomes allowlist on eth0/wlan0, SSH + the HA UI only, ICMPv6 ND/RA preserved; the escape hatch is /mnt/boot/ga-firewall-off. RPCBIND/NFS dropped from the defconfig (inherited from upstream HAOS, no device mounts NFS). (C) ethernet ABSENT MEANS OFF (#277) — polarity inverted, link is taken down not just deconfigured, and the operator override marker lives in the add-on-private dir and must name THIS device. (D) RAUC dual-slot snapshot published to the add-on-private dir (#279) — the rollback pre-flight decides from it. (E) device identity read from the add-on-private dir (#280) — device_id keys the MQTT ACLs, fleet attribution and the Loki/Influx labels. (F) vendored custom_components staged to the add-on-private dir (#285) — the biggest one: that tree is a CODE path, Core imports what the placer copies out of it, and the manifest version-gate is a CHANGE gate, not a TRUST gate (the writer owns both sides of the comparison). /share is still written for ga_manager < 0.105.0. PINS: ga_manager 0.100.0 -> 0.105.0 (five releases had piled up unpinned behind a version check that only compares the bake pin to the store, never to the source), mosquitto 7.1.1 -> 7.1.2 (files-only ACL denied every SUBSCRIBE on a FRESH broker start -> z2m crash-loop; image published 2026-07-17, never pinned), ga_influxdbv1 0.0.3 -> 0.0.4 (per_user_secrets prep, default-off no-op), ga-telemetry-config 1.0.1 -> 1.0.2 (three broken tier-0 journald filters: the kernel input was not restricted to the kernel transport, the supervisor filter matched the wrong field, dropbear was missing from auth). WHY rc39 AND NOT rc38: an rc38 image was already built and flashed to the bench on 2026-07-28; reusing the marker for materially different content makes /etc/ga-release ambiguous, which is the exact confusion a same-version cutover already causes. PREVIOUS (rc38): marker baked into /etc/ga-release at build. BOSv1.2.21-rc38 = rc37 PLUS the U-Boot autoboot lockdown — the FIRST device-visible bootloader change in this series, and the only reason this rc exists (components are unchanged from rc37: greenautarky-site 2.1.1, ga-frontend-bundle 1.9.1, ga_manager 0.99.0). CONFIG_BOOTDELAY moves 3 -> -2: "-2" is U-Boot's "autoboot with no delay and do NOT check for a keypress". Any value >= 0 leaves a serial window in which an attacker with physical access interrupts autoboot and appends init=/bin/sh to the bootargs, getting a root shell before any userspace auth exists. With an UNENCRYPTED rootfs that carries fleet-shared secrets (the shared root SSH key, the reusable NetBird setup key, the fleet-wide console-login HMAC), that is not one compromised device — it is a fleet compromise (EN 18031-1 SSM-3 / CCK-3, analysis 2026-07-28). OPERATIONAL CONSEQUENCE, read before flashing: the U-Boot prompt is no longer reachable on the serial console. Serial getty login, RAUC rollback and SD-MUX reflash are all unaffected and remain the recovery paths — but there is no longer a bootloader-level escape hatch, so a bad kernel must be recovered via RAUC or a reflash. BENCH-TEST ON A CANARY BEFORE THE RING: prove getty, rollback and reflash on K31 first. Guarded by UBOOT-01 (source config) and UBOOT-02 (built .config) in run_build_tests.sh.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.1.1"   # OCI ghcr.io/greenautarky/greenautarky-site:2.1.1 — component rename greenautarky_onboarding -> greenautarky_site (#574); was greenautarky-onboarding 1.8.0. NOTE: GitHub SOURCE REPO not yet renamed — still https://github.com/greenautarky/greenautarky-onboarding. Room-Scoping Stage A+B COMPLETE (incr 1-3, WS+REST leak_guard) + entity scoping DEFAULT ON (only restricts real sub-users) rc36: 2.1.0 adds the resident self-service reset (Danger Zone) — see gaos_release (G); NO feature gate. rc37: 2.1.1 repairs Stage-B scoping — sub-user dashboards rendered BLANK on rc36 (leak_guard proxy + json_fragment filtering); see gaos_release.
  greenautarky-telemetry:  "0.2.3"   # https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.9.1"  # https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G). rc37: 1.9.1 pairs with site 2.1.1 for the scoping repair.
  ga-heating:              "0.1.0"  # https://github.com/greenautarky/ga-heating — weekly heating plan: stored + executed on the device via climate.set_temperature (works with ANY thermostat), mirrored into a TRV that can hold a plan. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE, gm 0.86.0).

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.9"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs). v1.2.9 lifts a blocking Supervisor job condition instead of retrying it for 8 min: 'StoreManager.add_repository blocked, supervisor needs to be updated first' is a job condition, not the transient git race the retry loop was built for. It left EVERY freshly flashed device with no store, no add-ons and no ga_manager while booting fine and answering on serial (K31, 2026-07-30). Pairs with the hassio.mk channel fix that removes the cause.
  ga-telemetry-config:  "1.0.2"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.4.6"
