# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.3.0-rc28  # marker baked into /etc/ga-release at build. rc28 = rc27 + the three defects the full rc27 canary regression found, none of which a green build could show. (1) #517: ga-ethernet-retire.path re-triggered its own unit as fast as PID 1 could schedule it, because a .path re-activates a unit that goes inactive while the watched path still exists, and the triggered service exited instantly on an unmet condition — one core pinned and the journal flooded on every device from its first converge until its next reboot, and the retire itself never ran again after the first time. (2) #520: the rauc_slots fixtures wrote into the DEVICE healthy-boot record instead of a per-run one, so running the suite made a device publish rollback.possible=true onto a slot with no OS on it; the guard now lives in the collector, where a call site cannot forget it. (3) #518: run_device_tests.sh refuses a checkout that declares a different release than the device, and waits for the add-ons to be up — both failure modes had produced confident wrong answers ABOUT the device. ga_manager 0.164.0 -> 0.165.0: addon-config push gains patch mode, so setting one option no longer resets its siblings (#257). Everything else carried unchanged from rc27.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.7.0"   # 2.7.0: personal dashboards are shown only to master users. 2.6.0: OCI ghcr.io/greenautarky/greenautarky-site:2.6.0 — setup calls instance_id.async_get once so Home Assistant materialises core.uuid; a fresh, fully onboarded device was shipping cloud telemetry with an EMPTY instance id (ADR-19, greenautarky-onboarding#40). 2.2.0: one thermostat per room, derived rather than by hiding valves (#33) — the pair of ga-heating 0.2.0, released together 2026-08-24 for canary testing. PREVIOUS 2.1.1: OCI ghcr.io/greenautarky/greenautarky-site:2.1.1 — component rename greenautarky_onboarding -> greenautarky_site (#574); was greenautarky-onboarding 1.8.0. NOTE: GitHub SOURCE REPO not yet renamed — still https://github.com/greenautarky/greenautarky-onboarding. Room-Scoping Stage A+B COMPLETE (incr 1-3, WS+REST leak_guard) + entity scoping DEFAULT ON (only restricts real sub-users) rc36: 2.1.0 adds the resident self-service reset (Danger Zone) — see gaos_release (G); NO feature gate. rc37: 2.1.1 repairs Stage-B scoping — sub-user dashboards rendered BLANK on rc36 (leak_guard proxy + json_fragment filtering); see gaos_release.
  greenautarky-telemetry:  "0.2.3"   # https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.10.0"  # 1.10.0: resident-clean UI defaults (hide Haushalt/Ohne Raum, collapse sidebar on first load). https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G). rc37: 1.9.1 pairs with site 2.1.1 for the scoping repair.
  ga-heating:              "0.5.0"  # 0.5.0 (2026-09-08, ADR-0021 open pt 3): manual override is a flat 3h cap (configurable via GA_HEATING_MANUAL_CAP_HOURS), reverted to auto on expiry — paired with hmvapp 2.2.0 reading the room mode from climate.<area>. 0.4.0 (2026-09-03, ADR-0021 §3): consumes the heating decision contract v1 — the closed engine (hmvapp) proposes an offset per valve via sensor.hm_<ieee>_desired_offset, ga_heating stays the only writer; expired/malformed decisions fall back to the room formula; attribute calibration gains source/reason. 0.3.0: valve calibration moved into ga_heating.

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.9"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs). v1.2.9 lifts a blocking Supervisor job condition instead of retrying it for 8 min: 'StoreManager.add_repository blocked, supervisor needs to be updated first' is a job condition, not the transient git race the retry loop was built for. It left EVERY freshly flashed device with no store, no add-ons and no ga_manager while booting fine and answering on serial (K31, 2026-07-30). Pairs with the hassio.mk channel fix that removes the cause.
  ga-telemetry-config:  "1.0.3"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.5.3"  # 2025.11.5.3: the forward-port onto upstream 2025.11.5 (ha-supervisor #32), carrying the four API fields Core 2026.8/2026.9 require via aiohasupervisor 0.6.0 (#25) and reference_extra (#27). armv7 is kept OUT of the unsupported set — upstream #5620 would otherwise trip JobCondition.ARCHITECTURE_SUPPORTED and stop Updater.fetch_data, so the device would never read stable.json again; observed on K31 2026-09-09 and now asserted in CI. Proven on K31 the same day: the eight endpoints Core gathers at startup went from 4 of 8 unreadable to 8 of 8, healthy, 7/7 add-ons, restarts=0. PREVIOUS 2025.11.4.8.
