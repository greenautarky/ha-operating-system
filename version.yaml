# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.3.0-rc36  # marker baked into /etc/ga-release at build. rc36 = rc35 + the resident's own screen, and one thing the device recorded for months and could never show. (1) greenautarky-site 2.7.3 -> 2.7.4: the stock-panel sweep removed four of its six panels and left `map` and `todo` — the two it had been EXTENDED for. Not ordering, not a rename: both survivors are registered by Home Assistant's OWN onboarding completion, which on a GA device fires while the resident walks through our wizard, long after every sweep has run. A one-shot mutation of a registry other integrations keep writing to loses that race by construction, and a third sweep would have lost it too; it now hangs on the registry's own change signal (frontend.EVENT_PANELS_UPDATED), edge-triggered and bounded. The resident's personal board leaves the sidebar via `sidebar_title=None` — Home Assistant's own filter — so the board stays reachable and still renders, where a name pattern would have hidden the wrong thing. (2) ga-frontend-bundle 1.10.0 -> 1.11.0: a device showed as a raw radio address where a name belongs, the 24-hour heating plan carried the hour only in a hover tooltip (on a tablet, no axis at all), and a history card rendered nothing but the announcement that it was switched off. (3) ga_manager 0.183.0 -> 0.186.0, which is where that third one came from: `ga_recorder.yaml` has declared `recorder:` since it was written, so every device STORES seven days — but `recorder` is the WRITER and `history` is the READER, a separate integration, and it was set up NOWHERE. A GA device deliberately has no `default_config:`, so anything Core provides must be named explicitly and `history` never was; measured on a canary 2026-09-15 with a 1.1 MB database written that minute behind a card saying the integration was disabled. The naive fix is inert: five consumers filtered the declaration through "is the component folder placed", which is right for a vendored component and silently fatal for a Core one. 0.186.0 splits the declaration into two halves that cannot be confused. 0.185.0 in the same jump: credentials delivered at runtime take effect IN-PROCESS instead of at the next add-on restart, and a push that cannot leave the device is loud instead of reporting success — on a freshly flashed device the credentials land AFTER the client started, so the pairing feed published into nothing for 41 minutes while every surface said it had worked. 0.184.0: the RAUC rollback verdict carries its mirror_of_booted / booted_ok evidence to /info and the panel. Expect exactly ONE Core restart per device on the first converge after 0.186.0 — the new key and the `packages:` anchor are load-requiring; the second converge is a no-op and a test pins it. PREVIOUS rc35 = rc34 + the one defect that made rc34 unshippable: its setup wizard rendered a blank page on a freshly flashed device, so a new device could not be onboarded at all. greenautarky-site 2.7.2 -> 2.7.3 (see that pin for the cause — it was structural, not a stale artifact). Two build-time guards land with it, because a green build could show neither: BLD-FE-03 asserts the vendored wizard bundle agrees with what the component serves (BLD-FE-02 passed on the broken artifact — that is the gap in one line), and the destructive e2e onboarding reset is now an opt-in the FIXTURE enforces rather than a convention a spec can forget. PREVIOUS rc34 = rc33 + three fixes, each of which a green build could not show. (1) #557: ga-manage-ethernet derives the device label from ga-identity.json instead of the legacy /mnt/data/ga-device-label, which NOTHING in the current provisioning path writes (the add-on has no /mnt/data mount) — so since #509 retired the flash-time marker after converge, the fleet ethernet override silently never applied on a freshly enrolled or reflashed device and it went dark at its first reboot (measured K39 09-09, K55 09-14); the same defect was fixed in ga-fluent-bit-env on 07-15 and this script never got the sweep. (2) ga_hmvapp_addon 2.2.0 -> 2.3.0: the heating engine falls back to the mean of the room's OWN valves' local_temperature when the room has neither its own sensor nor a neighbouring one — a K31 room holding one valve and no mapped sensor wrote decided=0 / reason=no_room_temperature into gd_data.hm_liveness on every 60 s cycle, so automatic heating never ran while the valve's temperature sat unused in the engine's own radiator_data; the fallback is announced at WARNING and recorded as room_temp_from_valve, never silent. (3) greenautarky-site 2.7.1 -> 2.7.2 repairs the setup wizard from the installer's feedback: the tier-0 analytics card was unreadable in dark mode because it styled on a CSS custom property defined nowhere in the frontend, so the light fallback always won; the wizard was a forward-only chain with no way back to a previous step (a reload restarted at welcome); and the language picker visibly did nothing because all seven step components carried German literals and never called localize. rc33 = rc32 + forward-compatible enrolment (#986): ga-enroll declares fleet_env (ADR-0027 D4), but on an HTTP 422 from a fleet-manager that predates that field it retries the enroll WITHOUT fleet_env — so a freshly-flashed device enrols against the current prod fm 0.124 (it was invisible before: the 422 left no fm row) and declares its environment again once fm is upgraded. rc32 = rc31 + ga_manager 0.182.0 -> 0.183.0: the HA MQTT integration config entry is now created through Core's config-flow API instead of a direct core.config_entries write. The direct write was dropped when Core rewrote that file from its in-memory set on the post-converge restart, so every fresh device came up with no MQTT integration, no z2m climate entities and dead heating while every gate stayed green. provision_verify's mqtt_entry check now reads Core's live state and is critical (a converge job fails instead of a silent green), a ga.mqtt_entry health check surfaces a missing/unloaded entry in the fleet view, and reconcile self-heals it (#988). rc31 = rc30 + ONE fix, and rc30 must not be rolled: on a device whose primary uplink is wlan0, ga-lte-standby-route withdrew the primary default route on every timer tick because it matched any default route on the interface and no device without a declared standby hop has a verdict file — the device dropped off the mesh right after the OTA (bench canary, 2026-09-14 00:26). The script now owns exactly one route (matched and deleted by its own metric) and manages nothing when no verdict exists; the lte_standby suite's fake ip carries a primary and a standby route and LSB-22/24 were inverted, red against rc30, green now. rc30: marker baked into /etc/ga-release at build. rc30 = rc29 + the week-38 landing (2026-09-13): enrolment declares its fleet environment (ADR-0027 D4); the LTE standby hop's host units — persistent deauth counter, health-gated standby route, WiFi power-save assert (ADR-0025 seams S1/S2); the USB host port is closed by default with a declared allowlist and the WiFi MAC posture is tested (ADR-0029 D3); the RAUC rollback verdict gains a third evidence — a byte-identical inactive slot — so a fresh device reports a rollback target from its first hour instead of never, with the IMG-01 build gate proving both slot pairs of every produced image are identical and non-blank; run_all.sh refuses to report a pass over zero tests. ga_manager 0.169.0 -> 0.182.0 (fleet-env-preserving reconcile, actor provenance in jobs.created_by, LTE monitoring hardening + expected/declared LTE + self-healing + liveness counters + modem-transition log). Previous marker comment (rc29): marker baked into /etc/ga-release at build. rc29 = rc28 + the customer's very first request. The device label's QR code points at `/`, and two independent defects on that one request each landed a customer somewhere other than where the label promised. (1) The `/` -> wizard redirect could silently never fire: Core builds the index route from a cached_property that binds the handler at FIRST ACCESS, so any hit before our component finished setting up froze the original handler in and the later class-level patch changed nothing — no error, no log line, won or lost per boot, which is why hand-testing called it fixed. A customer then landed in Home Assistant with no account. (2) The redirect dropped the query string, so the PIN the QR code carries never reached the setup panel that auto-fills it — true on EVERY device whose redirect worked, including ones that looked healthy, because every check asked for the status and the path and never whether anything survived. greenautarky-site 2.7.0 -> 2.7.1 fixes both. ga_manager 0.168.0 -> 0.169.0 adds ga.wizard_landing, which queries the outcome instead of the stored intent and probes `/` the way the QR code does. OB-WR-03 in the onboarding suite asserts the PIN survives. rc28 = rc27 + the three defects the full rc27 canary regression found. rc28 = rc27 + the three defects the full rc27 canary regression found, none of which a green build could show. (1) #517: ga-ethernet-retire.path re-triggered its own unit as fast as PID 1 could schedule it, because a .path re-activates a unit that goes inactive while the watched path still exists, and the triggered service exited instantly on an unmet condition — one core pinned and the journal flooded on every device from its first converge until its next reboot, and the retire itself never ran again after the first time. (2) #520: the rauc_slots fixtures wrote into the DEVICE healthy-boot record instead of a per-run one, so running the suite made a device publish rollback.possible=true onto a slot with no OS on it; the guard now lives in the collector, where a call site cannot forget it. (3) #518: run_device_tests.sh refuses a checkout that declares a different release than the device, and waits for the add-ons to be up — both failure modes had produced confident wrong answers ABOUT the device. ga_manager 0.164.0 -> 0.165.0: addon-config push gains patch mode, so setting one option no longer resets its siblings (#257). Everything else carried unchanged from rc27.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.7.4"   # 2.7.4: the stock-panel sweep is an invariant, not a schedule. Four of six panels went; `map` and `todo` stayed — the two the sweep had been extended for. Home Assistant registers both at ITS own onboarding completion, which on a GA device happens during our wizard, after every sweep; the fix subscribes to frontend.EVENT_PANELS_UPDATED instead of running a third time. The personal board leaves the sidebar through `sidebar_title=None` (HA's own filter), so it stays reachable. PREVIOUS 2.7.3: the setup wizard reaches the paths the component actually serves. 2.7.2 shipped a bundle that asked for a retired static mount and a retired API namespace, so every request 404'd, the panel element never upgraded, and a freshly flashed device rendered a BLANK page — onboarding was impossible and no gate said so (the hash check verified the bytes were unchanged and the file set intact; both were true, and neither answers whether the bytes are right). The cause was structural rather than stale: the component's namespace had never existed in the producer repository, and the bundle that had been correct for months was correct because its paths were rewritten AFTER vendoring — so every rebuild reproduced the defect and the day someone rebuilt, the wizard died. Fixed in the producer (every GA URL derives from one domain constant), plus a real CalVer stamped into the bundle before the build instead of the 0.0.0.dev0 placeholder, plus a gate comparing the bundle's paths and namespace tokens against URL_BASE/DOMAIN with 13 must-fail/must-pass fixtures. Also: rooms/sync no longer 500s the whole flat when one room cannot be matched — it aborted BEFORE placing devices, so areas existed with zero entities carrying an area_id and the heating engine saw rooms with no valves. PREVIOUS 2.7.2: setup-wizard fixes from the installer's feedback — dark-mode readability of the tier-0 analytics card (it used a CSS variable defined nowhere), a "Zurueck" step with browser-Back parity (the panel was a forward-only chain; no back out of the account step once it created the user, none across the PIN gate), and real DE/EN localisation (all seven steps were German literals with zero localize calls, so the picker changed nothing). EN legal texts deliberately still hold the reviewed German and await human legal review. PREVIOUS 2.7.1: the front door. `/` reaches the setup wizard even when Core cached its index route before our component set up (IndexView._route is a cached_property binding self.get at first access, so a class-level patch afterwards was a silent no-op and the redirect fired or did not depending on startup timing), AND the redirect now carries the device label's ?pin=&device= through, which it had always dropped — so a customer who scanned the QR code had to type the PIN anyway (#43). Guarded by OB-WR-01/03 in the onboarding suite and by ga.wizard_landing in ga_manager 0.169.0. 2.7.0: personal dashboards are shown only to master users. 2.6.0: OCI ghcr.io/greenautarky/greenautarky-site:2.6.0 — setup calls instance_id.async_get once so Home Assistant materialises core.uuid; a fresh, fully onboarded device was shipping cloud telemetry with an EMPTY instance id (ADR-19, greenautarky-onboarding#40). 2.2.0: one thermostat per room, derived rather than by hiding valves (#33) — the pair of ga-heating 0.2.0, released together 2026-08-24 for canary testing. PREVIOUS 2.1.1: OCI ghcr.io/greenautarky/greenautarky-site:2.1.1 — component rename greenautarky_onboarding -> greenautarky_site (#574); was greenautarky-onboarding 1.8.0. NOTE: GitHub SOURCE REPO not yet renamed — still https://github.com/greenautarky/greenautarky-onboarding. Room-Scoping Stage A+B COMPLETE (incr 1-3, WS+REST leak_guard) + entity scoping DEFAULT ON (only restricts real sub-users) rc36: 2.1.0 adds the resident self-service reset (Danger Zone) — see gaos_release (G); NO feature gate. rc37: 2.1.1 repairs Stage-B scoping — sub-user dashboards rendered BLANK on rc36 (leak_guard proxy + json_fragment filtering); see gaos_release.
  greenautarky-telemetry:  "0.2.3"   # https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.11.0"  # 1.11.0: the resident's screen says what it means — devices carry a human name instead of a radio address, the 24-hour heating plan has a real time axis (the hour had lived only in a hover tooltip), and the history section renders only when Home Assistant's `history` integration is actually loaded, announcing its absence at console.warn with the cause instead of drawing a card that only reports being off. PREVIOUS 1.10.0: resident-clean UI defaults (hide Haushalt/Ohne Raum, collapse sidebar on first load). https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G). rc37: 1.9.1 pairs with site 2.1.1 for the scoping repair.
  ga-heating:              "0.5.0"  # 0.5.0 (2026-09-08, ADR-0021 open pt 3): manual override is a flat 3h cap (configurable via GA_HEATING_MANUAL_CAP_HOURS), reverted to auto on expiry — paired with hmvapp 2.2.0 reading the room mode from climate.<area>. 0.4.0 (2026-09-03, ADR-0021 §3): consumes the heating decision contract v1 — the closed engine (hmvapp) proposes an offset per valve via sensor.hm_<ieee>_desired_offset, ga_heating stays the only writer; expired/malformed decisions fall back to the room formula; attribute calibration gains source/reason. 0.3.0: valve calibration moved into ga_heating.

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.9"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs). v1.2.9 lifts a blocking Supervisor job condition instead of retrying it for 8 min: 'StoreManager.add_repository blocked, supervisor needs to be updated first' is a job condition, not the transient git race the retry loop was built for. It left EVERY freshly flashed device with no store, no add-ons and no ga_manager while booting fine and answering on serial (K31, 2026-07-30). Pairs with the hassio.mk channel fix that removes the cause.
  ga-telemetry-config:  "1.0.3"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.5.3"  # 2025.11.5.3: the forward-port onto upstream 2025.11.5 (ha-supervisor #32), carrying the four API fields Core 2026.8/2026.9 require via aiohasupervisor 0.6.0 (#25) and reference_extra (#27). armv7 is kept OUT of the unsupported set — upstream #5620 would otherwise trip JobCondition.ARCHITECTURE_SUPPORTED and stop Updater.fetch_data, so the device would never read stable.json again; observed on K31 2026-09-09 and now asserted in CI. Proven on K31 the same day: the eight endpoints Core gathers at startup went from 4 of 8 unreadable to 8 of 8, healthy, 7/7 add-ons, restarts=0. PREVIOUS 2025.11.4.8.
