# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.3.0-rc45  # marker baked into /etc/ga-release at build. rc45 = rc44 + the ga-services.conf override LAYERING on the baked default instead of replacing it. It used to be `if [ -f override ]; then . override; else . default; fi`, so the one-line override a human actually writes — a file containing only GA_FLEET_ENV=staging — left GA_FLEET_HOST unset and ga-enroll exited 0 with "enrollment disabled on this image": no error, no retry, no fleet-manager row, and the device never enrolled again. The documented procedure (copy the whole file and edit) hides it, and so did the suite's own fixture, which writes a COMPLETE override. Swept across all three file-sourcing consumers — ga-enroll, ga-update-hosts, ga-resolve-ota — because ga-publish-services has read override-then-baked PER KEY since it was written, which is the proof that layering is the intended semantics and three consumers were simply never brought along. A full-copy override behaves identically, so nothing that works today changes; a partial one starts working instead of silently disabling the device. The one remaining skip is loud now: GA_FLEET_HOST missing from BOTH files is a broken image, not a choice, and it says so at WARNING with the consequence rather than as an info line. This is the precondition for moving the fleet to staging — it is not the whole precondition, since the flasher still seeds no GA_FLEET_ENV and a freshly flashed device therefore declares prod by default. ENV-FE-09/10/11 were red against master before landing. Previously: marker baked into /etc/ga-release at build. rc44 = rc43 + the OTA no longer switching the LAN socket back on. The .img and the .raucb were built from one boot.vfat, so /mnt/boot/ga-ethernet-force — which the SD image carries on purpose, because provisioning runs over the cable — travelled inside the bundle too, and RAUC's install_boot copies the bundle's boot partition over /mnt/boot wholesale, keeping only *.txt and grubenv. Measured on the rc43 bundle: unsquashfs -> boot.vfat -> `GA-ETH~1 112 ga-ethernet-force`. It was harmless only while ga-ethernet-retire.path won its race with ga-ethernet-guard.service and deleted the restored marker before anything read it; rc42 fixed that race and thereby turned a dormant bug into a fleet-wide posture change nobody had decided on — every updated device, customer units included, would bring the interface up at the post-update boot. The bundle now gets its own marker-free boot image built from a COPY of the boot tree, so the SD image does not depend on which genimage run goes last; the name inside the bundle stays boot.vfat because the manifest and every deployed install hook address it by that name. The board hook's comment claimed the opposite ("the first OTA drops the marker") and is corrected, since that is why it went unnoticed. BLD-ETH-01 asserts both halves on every build and carries two fixtures in one run — the bundle must not flag, the SD image must, so a detector that stopped matching cannot report every bundle clean forever. Which leaves the durable switch with the fleet, not the image: ga_manager's ethernet.force_enabled is set while provisioning and cleared only from the fleet-manager (ga-fleet-manager 0.144.0 makes that a step with a button instead of a runbook line). Previously: marker baked into /etc/ga-release at build. rc43 = rc42 + the correction rc42 earned on the bench within four minutes. The uplink ladder parked the only working uplink on K31: it counted an Ethernet profile with no cable, the loopback and the mesh WireGuard link (which rides on the uplink being parked) as places to fall to, so its "never park the last rung" rule never fired — by its own definition this was not the last rung. A spare rung now needs its MEDIUM: carrier on the wire, the SSID in the scan list, or a modem; anything that cannot be proven to carry traffic is not a spare. The host-side tests could not have caught it — the stub was honest, the world the fixture described was not. Previously: rc42 = rc41 + the uplink door, the staircase behind it, and a health check that stops calling a healthy device broken. rc42 = rc41 + the uplink door, the staircase behind it, and a health check that stops calling a healthy device broken. (1) OS: the flash-time Ethernet override is honoured for the boot in which it exists instead of being deleted three seconds before the reader looks — measured on a converged bench device, retire finished 12:48:11.850 and the guard read nothing at 12:48:14.940, so the documented on-site path (card into a reader, recreate the marker, boot) could not work on ANY converged device; that is how a field unit moved to an Ethernet-only site came up dark with no way in. The retirement now says at WARNING what the next boot will look like when the fleet has declared nothing. The LTE fallback no longer disables itself in silence when its build-time key is missing, and a network config imported from an SD card can no longer remove the built-in WiFi fallback for good. (2) OS: ga-uplink-ladder — every two minutes the device reads NetworkManager's verdict about the uplink it is USING, forces one probe only when that verdict already smells wrong (a metered SIM is not billed per minute for being healthy), and after three confirmed strikes parks the dead connection so it falls to the next rung. Never the last rung, and a reboot clears every park. (3) ga_manager 0.191.0 -> 0.192.0: ga.frontend_cards held a side-effect asset to a contract it never had and called two healthy devices crit over a sidebar that was demonstrably collapsed on the resident's screen. What an asset is now decides what "served" means, read from the shipped file rather than from a second list. Previously: rc41 = rc40 + a consent that takes effect when it is made. rc41 = rc40 + a consent that takes effect when it is made. (1) OS: ga-telemetry-consent-refresh.path re-evaluates the consent markers on every save of the resident's consent store and starts/stops the shippers to match — the markers used to be written once at boot, minutes BEFORE the wizard wrote the store, so every fresh device shipped nothing until somebody rebooted (measured 2026-09-13/16/17). (2) greenautarky-telemetry 0.2.3 -> 0.2.4 + greenautarky-site 2.9.1 -> 2.9.2: the wizard's telemetry step wrote two flat booleans into the telemetry component's dict and never touched the tiers the gate reads, so "yes to Tier 2" was stored as tier2:false; the component now has ONE entry point for a decision and the wizard calls it. Previously: rc40 = rc39 + the two halves of the manual mode a resident actually meets, and a wizard that cannot be completed from the outside. rc40 = rc39 + the two halves of the manual mode a resident actually meets, and a wizard that cannot be completed from the outside. (1) ga-heating 0.6.0 -> 0.6.2: the manual deadline is pushed into the state machine on the tick that records it (0.6.1) — on rc39 the store carried it while the card read None until a valve happened to report; and the 3 h cap now runs for a room WITHOUT a plan too, handing it back to `auto` where the engine decides (0.6.2) — on a fresh device that is every room, so the forgotten override the cap exists for was the one case it skipped. (2) greenautarky-site 2.9.0 -> 2.9.1: `complete`, `telemetry` and `ethernet` stand behind the onboarding PIN like the account step — an empty unauthenticated POST to `complete` marked a device as onboarded with no resident account. Both measured on K31 on 2026-09-16, as the resident, over the resident URL. Previously: rc39 = rc38 + the layer the heating contract actually lives on, and the clock it runs. rc39 = rc38 + the layer the heating contract actually lives on, and the clock it runs. (1) ga-heating 0.5.0 -> 0.6.0: a room thermostat now appears when its valves do. Measured on a commissioned flat 2026-09-16 — the component loaded at boot, the installer placed the valves forty minutes later through the app, and the flat then had NO room thermostat at all. No manual mode, no manual cap, no return to `auto`, because all three live on an entity that did not exist; a Core restart created all three rooms at once, which is what proved the cause. Nothing said so, and the resident's screen simply offered the raw valves while every surface reported the device healthy. Discovery ran once at setup, which is exactly the wrong moment: on a real installation the valves get their rooms AFTER the component is up. It re-runs on registry changes now — device, entity and area, debounced by ten seconds because a flat's devices are placed one after another. It ADDS rooms and never removes them: an entity that appears costs a resident nothing, one that vanishes under their finger breaks the card mid-tap and loses a mode they just set, so an area that loses its last valve keeps its thermostat until the next restart. (2) ga-frontend-bundle 1.13.0 -> 1.15.0. 1.15.0: while the plan is paused the card says for how long — `Manuell noch 2 h 14 min — bis 19:42`, under the mode buttons. ga_heating has capped manual overrides since 0.5.0 and carries `manual_until` on the room entity the whole time; none of it reached the screen, so "why did my temperature change back?" had no answer anywhere a resident looks. Both numbers on purpose — the remaining time answers how long, the wall-clock answers when, and the row names what takes over at zero. 1.14.0: intent the device never honours expires after 8 s. The optimistic-press fix from 1.13.0 showed a pending value until the backend confirmed it; where confirmation never came the card stopped following the device altogether — no current temperature, no mode, no running state, just a number the device did not have. A card frozen on a wrong number is worse than the lost press the optimism was built to fix. PREVIOUS rc38 = rc37 + the resident's screen as a resident actually meets it. Every item below was measured on a freshly commissioned flat on 2026-09-16, with a resident account, in a browser — not inferred from a green build. (1) ga-frontend-bundle 1.12.0 -> 1.13.0, four defects the registry fix of rc37 finally made visible. The card never said whether the room was being HEATED: the valve was 100 % open and `hvac_action` read `heating` while the card showed only the current temperature and the target. The running state existed in the `dial` variant alone — the device ships `setpoint`, so on the real screen it did not exist — and even there it was INFERRED from `target > current`, which is a different question: a valve holds `idle` above the room temperature when a window contact is open, and reports `heating` at equal temperatures while it catches up. It is read from `hvac_action` now, with the old comparison kept as a fallback that says it is one. Setpoint presses were LOST: nine produced seven steps. Two causes, each sufficient — every press read the value the backend last confirmed, so two presses inside one round trip both wrote the same number; and every state update rebuilt the card, so a press could land on a button that had already been detached. The card now carries the resident's intent, debounces one command per burst, and binds its listener to the root. The 24-hour charts drew three curves from ONE sensor under three identical labels, because `statistics-graph` names a series after the entity and never says which statistic it is. One curve per sensor now. The sidebar was open on every first load although the asset that should collapse it was imported and served: it asked for `home-assistant`, which exists in index.html from the first byte, fired its event at an element whose listener had not been attached yet, and reported success — so its retry loop never started. It waits for the EFFECT now. (2) greenautarky-site 2.7.5 -> 2.9.0. Devices kept the name zigbee2mqtt gave them — their radio address — everywhere a name belongs; a device placed in a room is now named from what it CAN DO (a climate entity makes a Thermostat), never from a model table, and a name a human chose is never touched. And a room now offers an ALLOW-list of controls instead of everything not explicitly hidden: a Sonoff valve's `smart_temperature_control` reached residents in English and unexplained because the vendor marked it a primary control, while its siblings `child_lock` and `open_window` were filtered for carrying `config` — whether a resident saw a vendor knob depended on how the vendor had labelled it (ADR-0014 Amendment 1). The wizard also accepts an e-mail address the way a person writes it: a capital letter used to end account creation with a generic credential error. (3) ga_manager 0.189.0 -> 0.191.0. `ga.frontend_cards` called a HEALTHY device crit because it knew only one of the two ways a card reaches the frontend — the fix it was built to watch had moved every card to Lovelace resources, and the detector, written the same afternoon, still demanded the index import list. New: `ga.device_entities` names a paired device that cannot be operated. One of four thermostats came up with `linkquality` and `last_seen` and no `climate` at all, in the right room, reporting over MQTT — while the app, the cloud record and the fleet all reported success. PREVIOUS rc37 = rc36 + the reason none of rc36's resident-facing work could be seen on a device. (1) ga-frontend-bundle 1.11.0 -> 1.12.0: not one GreenAutarky card registered in the browser, so every card slot the resident's screen asks for rendered Home Assistant's error card instead. Home Assistant's app bundle installs a scoped-custom-element-registry polyfill that REPLACES window.customElements with a fresh, empty registry on its first line. First-party assets were being injected with add_extra_js_url, which the frontend imports inline from index.html and therefore races that bootstrap: the assets defined their elements in the registry that was about to be discarded. No error is raised on either side — the definition succeeds, and the element simply never upgrades. 1.12.0 delivers every first-party asset as a Lovelace resource, which the panel loads AFTER bootstrap, keeps add_extra_js_url as an explicit allow-list for assets that define no element, and ships a ga-registry-guard that fails loudly when the registry it is registering into is not the one the app ends up using. (2) greenautarky-site 2.7.4 -> 2.7.5: the room sync could collide with ITSELF. Its name-collision guard seeded the set of claimed areas from PREVIOUS syncs, so on the second sync every room it had created the first time counted as a foreign claimant of its own name and the sync aborted. A flat therefore synced once and never again. (3) ga_manager 0.186.0 -> 0.189.0, which is what makes (1) detectable at all: the fleet reported a device as healthy while its resident saw nothing but error cards, because no surface compared what is SHIPPED with what actually REGISTERED in the browser and what is SERVED. ga.frontend_cards does exactly that comparison and fails closed; ga-fleet-manager 0.143.0 carries it per device, and the e2e suite asserts registration and the absence of hui-error-card, so a repeat is caught on the bench before it reaches a resident. 0.188.0 in the same jump: the MQTT command topics are rebound when the device identity arrives instead of being bound once at client start. PREVIOUS rc36 = rc35 + the resident's own screen, and one thing the device recorded for months and could never show. (1) greenautarky-site 2.7.3 -> 2.7.4: the stock-panel sweep removed four of its six panels and left `map` and `todo` — the two it had been EXTENDED for. Not ordering, not a rename: both survivors are registered by Home Assistant's OWN onboarding completion, which on a GA device fires while the resident walks through our wizard, long after every sweep has run. A one-shot mutation of a registry other integrations keep writing to loses that race by construction, and a third sweep would have lost it too; it now hangs on the registry's own change signal (frontend.EVENT_PANELS_UPDATED), edge-triggered and bounded. The resident's personal board leaves the sidebar via `sidebar_title=None` — Home Assistant's own filter — so the board stays reachable and still renders, where a name pattern would have hidden the wrong thing. (2) ga-frontend-bundle 1.10.0 -> 1.11.0: a device showed as a raw radio address where a name belongs, the 24-hour heating plan carried the hour only in a hover tooltip (on a tablet, no axis at all), and a history card rendered nothing but the announcement that it was switched off. (3) ga_manager 0.183.0 -> 0.186.0, which is where that third one came from: `ga_recorder.yaml` has declared `recorder:` since it was written, so every device STORES seven days — but `recorder` is the WRITER and `history` is the READER, a separate integration, and it was set up NOWHERE. A GA device deliberately has no `default_config:`, so anything Core provides must be named explicitly and `history` never was; measured on a canary 2026-09-15 with a 1.1 MB database written that minute behind a card saying the integration was disabled. The naive fix is inert: five consumers filtered the declaration through "is the component folder placed", which is right for a vendored component and silently fatal for a Core one. 0.186.0 splits the declaration into two halves that cannot be confused. 0.185.0 in the same jump: credentials delivered at runtime take effect IN-PROCESS instead of at the next add-on restart, and a push that cannot leave the device is loud instead of reporting success — on a freshly flashed device the credentials land AFTER the client started, so the pairing feed published into nothing for 41 minutes while every surface said it had worked. 0.184.0: the RAUC rollback verdict carries its mirror_of_booted / booted_ok evidence to /info and the panel. Expect exactly ONE Core restart per device on the first converge after 0.186.0 — the new key and the `packages:` anchor are load-requiring; the second converge is a no-op and a test pins it. PREVIOUS rc35 = rc34 + the one defect that made rc34 unshippable: its setup wizard rendered a blank page on a freshly flashed device, so a new device could not be onboarded at all. greenautarky-site 2.7.2 -> 2.7.3 (see that pin for the cause — it was structural, not a stale artifact). Two build-time guards land with it, because a green build could show neither: BLD-FE-03 asserts the vendored wizard bundle agrees with what the component serves (BLD-FE-02 passed on the broken artifact — that is the gap in one line), and the destructive e2e onboarding reset is now an opt-in the FIXTURE enforces rather than a convention a spec can forget. PREVIOUS rc34 = rc33 + three fixes, each of which a green build could not show. (1) #557: ga-manage-ethernet derives the device label from ga-identity.json instead of the legacy /mnt/data/ga-device-label, which NOTHING in the current provisioning path writes (the add-on has no /mnt/data mount) — so since #509 retired the flash-time marker after converge, the fleet ethernet override silently never applied on a freshly enrolled or reflashed device and it went dark at its first reboot (measured K39 09-09, K55 09-14); the same defect was fixed in ga-fluent-bit-env on 07-15 and this script never got the sweep. (2) ga_hmvapp_addon 2.2.0 -> 2.3.0: the heating engine falls back to the mean of the room's OWN valves' local_temperature when the room has neither its own sensor nor a neighbouring one — a K31 room holding one valve and no mapped sensor wrote decided=0 / reason=no_room_temperature into gd_data.hm_liveness on every 60 s cycle, so automatic heating never ran while the valve's temperature sat unused in the engine's own radiator_data; the fallback is announced at WARNING and recorded as room_temp_from_valve, never silent. (3) greenautarky-site 2.7.1 -> 2.7.2 repairs the setup wizard from the installer's feedback: the tier-0 analytics card was unreadable in dark mode because it styled on a CSS custom property defined nowhere in the frontend, so the light fallback always won; the wizard was a forward-only chain with no way back to a previous step (a reload restarted at welcome); and the language picker visibly did nothing because all seven step components carried German literals and never called localize. rc33 = rc32 + forward-compatible enrolment (#986): ga-enroll declares fleet_env (ADR-0027 D4), but on an HTTP 422 from a fleet-manager that predates that field it retries the enroll WITHOUT fleet_env — so a freshly-flashed device enrols against the current prod fm 0.124 (it was invisible before: the 422 left no fm row) and declares its environment again once fm is upgraded. rc32 = rc31 + ga_manager 0.182.0 -> 0.183.0: the HA MQTT integration config entry is now created through Core's config-flow API instead of a direct core.config_entries write. The direct write was dropped when Core rewrote that file from its in-memory set on the post-converge restart, so every fresh device came up with no MQTT integration, no z2m climate entities and dead heating while every gate stayed green. provision_verify's mqtt_entry check now reads Core's live state and is critical (a converge job fails instead of a silent green), a ga.mqtt_entry health check surfaces a missing/unloaded entry in the fleet view, and reconcile self-heals it (#988). rc31 = rc30 + ONE fix, and rc30 must not be rolled: on a device whose primary uplink is wlan0, ga-lte-standby-route withdrew the primary default route on every timer tick because it matched any default route on the interface and no device without a declared standby hop has a verdict file — the device dropped off the mesh right after the OTA (bench canary, 2026-09-14 00:26). The script now owns exactly one route (matched and deleted by its own metric) and manages nothing when no verdict exists; the lte_standby suite's fake ip carries a primary and a standby route and LSB-22/24 were inverted, red against rc30, green now. rc30: marker baked into /etc/ga-release at build. rc30 = rc29 + the week-38 landing (2026-09-13): enrolment declares its fleet environment (ADR-0027 D4); the LTE standby hop's host units — persistent deauth counter, health-gated standby route, WiFi power-save assert (ADR-0025 seams S1/S2); the USB host port is closed by default with a declared allowlist and the WiFi MAC posture is tested (ADR-0029 D3); the RAUC rollback verdict gains a third evidence — a byte-identical inactive slot — so a fresh device reports a rollback target from its first hour instead of never, with the IMG-01 build gate proving both slot pairs of every produced image are identical and non-blank; run_all.sh refuses to report a pass over zero tests. ga_manager 0.169.0 -> 0.182.0 (fleet-env-preserving reconcile, actor provenance in jobs.created_by, LTE monitoring hardening + expected/declared LTE + self-healing + liveness counters + modem-transition log). Previous marker comment (rc29): marker baked into /etc/ga-release at build. rc29 = rc28 + the customer's very first request. The device label's QR code points at `/`, and two independent defects on that one request each landed a customer somewhere other than where the label promised. (1) The `/` -> wizard redirect could silently never fire: Core builds the index route from a cached_property that binds the handler at FIRST ACCESS, so any hit before our component finished setting up froze the original handler in and the later class-level patch changed nothing — no error, no log line, won or lost per boot, which is why hand-testing called it fixed. A customer then landed in Home Assistant with no account. (2) The redirect dropped the query string, so the PIN the QR code carries never reached the setup panel that auto-fills it — true on EVERY device whose redirect worked, including ones that looked healthy, because every check asked for the status and the path and never whether anything survived. greenautarky-site 2.7.0 -> 2.7.1 fixes both. ga_manager 0.168.0 -> 0.169.0 adds ga.wizard_landing, which queries the outcome instead of the stored intent and probes `/` the way the QR code does. OB-WR-03 in the onboarding suite asserts the PIN survives. rc28 = rc27 + the three defects the full rc27 canary regression found. rc28 = rc27 + the three defects the full rc27 canary regression found, none of which a green build could show. (1) #517: ga-ethernet-retire.path re-triggered its own unit as fast as PID 1 could schedule it, because a .path re-activates a unit that goes inactive while the watched path still exists, and the triggered service exited instantly on an unmet condition — one core pinned and the journal flooded on every device from its first converge until its next reboot, and the retire itself never ran again after the first time. (2) #520: the rauc_slots fixtures wrote into the DEVICE healthy-boot record instead of a per-run one, so running the suite made a device publish rollback.possible=true onto a slot with no OS on it; the guard now lives in the collector, where a call site cannot forget it. (3) #518: run_device_tests.sh refuses a checkout that declares a different release than the device, and waits for the add-ons to be up — both failure modes had produced confident wrong answers ABOUT the device. ga_manager 0.164.0 -> 0.165.0: addon-config push gains patch mode, so setting one option no longer resets its siblings (#257). Everything else carried unchanged from rc27.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.9.2"   # 2.9.2 (2026-09-17): telemetry step records a consent through greenautarky_telemetry.async_set_preferences (#59). 2.9.1 (2026-09-16): complete/telemetry/ethernet behind the wizard PIN (#58). 2.9.0: a room offers a CHOSEN set of controls, not everything that is not hidden. A Sonoff valve publishes `smart_temperature_control` with `entity_category: None` — the vendor calls it a primary control — so it reached residents in English and unexplained, while its siblings `child_lock` and `open_window` were filtered for carrying `config`. Whether a resident saw a vendor knob depended on how the vendor had labelled it, which is a race against firmware nobody here controls. The device's ROLE now decides and each role names what it offers: climate -> {climate}, light -> {light}, switch -> {switch}, read from what the device exposes rather than from a model table (ADR-0014 Amendment 1). The allow-list governs CONTROLS only, so a valve's temperature reading keeps feeding the room's charts. 2.8.0: a device placed in a room gets a name a resident can read. Every paired device kept its radio address as its name, so `0x0cae5ffff…` appeared wherever a name belongs, and the humidity chart labelled three series from one sensor identically. The kind is derived from what the device CAN DO, never from a model table; a name a human chose is never touched; an undeterminable kind stays unnamed rather than guessed. Also in 2.8.0: the setup wizard accepts an e-mail address the way a person writes it — Home Assistant normalises a username with strip+casefold and refuses a credential that is not already in that form, so any capital letter ended the account step with a generic credential error and no hint about the input. PREVIOUS 2.7.5: the room sync could collide with itself. The guard that stops two rooms in one sync from claiming the same area name seeded its claimed-set from the names installed by PREVIOUS syncs, so from the second sync onward every area the sync had created the first time was treated as a foreign holder of its own name and the whole sync aborted before placing devices. The claimed-set is now seeded empty and filled only by THIS sync; a regression test drives two consecutive syncs of the same rooms and asserts the second one is a no-op instead of a failure. PREVIOUS 2.7.4: the stock-panel sweep is an invariant, not a schedule. Four of six panels went; `map` and `todo` stayed — the two the sweep had been extended for. Home Assistant registers both at ITS own onboarding completion, which on a GA device happens during our wizard, after every sweep; the fix subscribes to frontend.EVENT_PANELS_UPDATED instead of running a third time. The personal board leaves the sidebar through `sidebar_title=None` (HA's own filter), so it stays reachable. PREVIOUS 2.7.3: the setup wizard reaches the paths the component actually serves. 2.7.2 shipped a bundle that asked for a retired static mount and a retired API namespace, so every request 404'd, the panel element never upgraded, and a freshly flashed device rendered a BLANK page — onboarding was impossible and no gate said so (the hash check verified the bytes were unchanged and the file set intact; both were true, and neither answers whether the bytes are right). The cause was structural rather than stale: the component's namespace had never existed in the producer repository, and the bundle that had been correct for months was correct because its paths were rewritten AFTER vendoring — so every rebuild reproduced the defect and the day someone rebuilt, the wizard died. Fixed in the producer (every GA URL derives from one domain constant), plus a real CalVer stamped into the bundle before the build instead of the 0.0.0.dev0 placeholder, plus a gate comparing the bundle's paths and namespace tokens against URL_BASE/DOMAIN with 13 must-fail/must-pass fixtures. Also: rooms/sync no longer 500s the whole flat when one room cannot be matched — it aborted BEFORE placing devices, so areas existed with zero entities carrying an area_id and the heating engine saw rooms with no valves. PREVIOUS 2.7.2: setup-wizard fixes from the installer's feedback — dark-mode readability of the tier-0 analytics card (it used a CSS variable defined nowhere), a "Zurueck" step with browser-Back parity (the panel was a forward-only chain; no back out of the account step once it created the user, none across the PIN gate), and real DE/EN localisation (all seven steps were German literals with zero localize calls, so the picker changed nothing). EN legal texts deliberately still hold the reviewed German and await human legal review. PREVIOUS 2.7.1: the front door. `/` reaches the setup wizard even when Core cached its index route before our component set up (IndexView._route is a cached_property binding self.get at first access, so a class-level patch afterwards was a silent no-op and the redirect fired or did not depending on startup timing), AND the redirect now carries the device label's ?pin=&device= through, which it had always dropped — so a customer who scanned the QR code had to type the PIN anyway (#43). Guarded by OB-WR-01/03 in the onboarding suite and by ga.wizard_landing in ga_manager 0.169.0. 2.7.0: personal dashboards are shown only to master users. 2.6.0: OCI ghcr.io/greenautarky/greenautarky-site:2.6.0 — setup calls instance_id.async_get once so Home Assistant materialises core.uuid; a fresh, fully onboarded device was shipping cloud telemetry with an EMPTY instance id (ADR-19, greenautarky-onboarding#40). 2.2.0: one thermostat per room, derived rather than by hiding valves (#33) — the pair of ga-heating 0.2.0, released together 2026-08-24 for canary testing. PREVIOUS 2.1.1: OCI ghcr.io/greenautarky/greenautarky-site:2.1.1 — component rename greenautarky_onboarding -> greenautarky_site (#574); was greenautarky-onboarding 1.8.0. NOTE: GitHub SOURCE REPO not yet renamed — still https://github.com/greenautarky/greenautarky-onboarding. Room-Scoping Stage A+B COMPLETE (incr 1-3, WS+REST leak_guard) + entity scoping DEFAULT ON (only restricts real sub-users) rc36: 2.1.0 adds the resident self-service reset (Danger Zone) — see gaos_release (G); NO feature gate. rc37: 2.1.1 repairs Stage-B scoping — sub-user dashboards rendered BLANK on rc36 (leak_guard proxy + json_fragment filtering); see gaos_release.
  greenautarky-telemetry:  "0.2.4"   # 0.2.4 (2026-09-17): async_set_preferences — one entry point for a consent decision (#2). https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.15.0"  # 1.15.0: while the heating plan is paused, the card says for how long — remaining time AND wall-clock, plus what takes over at zero. The data was there all along (`manual_until` on the room entity, since ga_heating 0.5.0) and never rendered. Three ways it shows nothing rather than something wrong: no override, an expired one (ga_heating clears the attribute on its next tick — silence beats counting backwards), and a timestamp that does not parse. 1.14.0: un-confirmed intent expires after 8 s. In `auto` the plan owns the setpoint, so a write is accepted with 200 and changes nothing — the pending value was never confirmed, the early return fired on every state update for ever, and the card stopped following the device at all. PREVIOUS 1.13.0: four defects on the resident's screen, all measured in a browser on 2026-09-16 once rc37's registry fix made the cards visible at all. The card never said whether the room was being HEATED — the state lived in the `dial` variant only while the device ships `setpoint`, and was inferred from `target > current` rather than read from `hvac_action`, which is wrong in both directions and silently so. Setpoint presses were lost (nine gave seven steps): each press read the last value the backend confirmed, and every state update replaced the button mid-click; the card now carries the resident's intent, sends one command per burst, and binds its listener to the root. The 24-hour charts drew three curves per sensor under three identical labels, because `statistics-graph` names a series after the entity and never says which statistic it is — one curve per sensor now. And the sidebar stayed open on every first load: the asset fired its event at `home-assistant`, which exists in index.html from the first byte, before the app had attached the listener, then reported success — so the retry it had been given never ran. It waits for the effect now. PREVIOUS 1.12.0: the cards reach the browser. Home Assistant's frontend installs a scoped-custom-element-registry polyfill that replaces window.customElements with a new, empty registry on the app bundle's first line. Assets injected through add_extra_js_url are imported inline from index.html and race that bootstrap, so a card that registered before the swap defined itself into a registry the app then threw away — silently, with no error on either side, and the element never upgrades. Every first-party asset is now delivered as a Lovelace resource, which the panel loads after bootstrap; add_extra_js_url is kept as an explicit allow-list for assets that define no custom element; and ga-registry-guard fails loudly instead of registering into a registry that is about to be replaced. PREVIOUS 1.11.0: the resident's screen says what it means — devices carry a human name instead of a radio address, the 24-hour heating plan has a real time axis (the hour had lived only in a hover tooltip), and the history section renders only when Home Assistant's `history` integration is actually loaded, announcing its absence at console.warn with the cause instead of drawing a card that only reports being off. PREVIOUS 1.10.0: resident-clean UI defaults (hide Haushalt/Ohne Raum, collapse sidebar on first load). https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G). rc37: 1.9.1 pairs with site 2.1.1 for the scoping repair.
  ga-heating:              "0.6.2"  # 0.6.2 (2026-09-16): manual cap for rooms without a plan, expiry -> auto (#35); 0.6.1: deadline republished on the tick (#33). 0.6.0 (2026-09-16): a room thermostat appears when its valves do, not at the next restart. Discovery ran once at setup — the wrong moment, because on a real installation the valves get their rooms AFTER the component is up. Measured on K31: component up at boot, valves placed forty minutes later, flat left with no room thermostat and therefore no manual mode, no cap and no return to auto. Re-runs on device/entity/area registry changes, debounced 10 s, and ADDS rooms without ever removing them. PREVIOUS 0.5.0 (2026-09-08, ADR-0021 open pt 3): manual override is a flat 3h cap (configurable via GA_HEATING_MANUAL_CAP_HOURS), reverted to auto on expiry — paired with hmvapp 2.2.0 reading the room mode from climate.<area>. 0.4.0 (2026-09-03, ADR-0021 §3): consumes the heating decision contract v1 — the closed engine (hmvapp) proposes an offset per valve via sensor.hm_<ieee>_desired_offset, ga_heating stays the only writer; expired/malformed decisions fall back to the room formula; attribute calibration gains source/reason. 0.3.0: valve calibration moved into ga_heating.

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.9"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs). v1.2.9 lifts a blocking Supervisor job condition instead of retrying it for 8 min: 'StoreManager.add_repository blocked, supervisor needs to be updated first' is a job condition, not the transient git race the retry loop was built for. It left EVERY freshly flashed device with no store, no add-ons and no ga_manager while booting fine and answering on serial (K31, 2026-07-30). Pairs with the hassio.mk channel fix that removes the cause.
  ga-telemetry-config:  "1.0.3"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.5.3"  # 2025.11.5.3: the forward-port onto upstream 2025.11.5 (ha-supervisor #32), carrying the four API fields Core 2026.8/2026.9 require via aiohasupervisor 0.6.0 (#25) and reference_extra (#27). armv7 is kept OUT of the unsupported set — upstream #5620 would otherwise trip JobCondition.ARCHITECTURE_SUPPORTED and stop Updater.fetch_data, so the device would never read stable.json again; observed on K31 2026-09-09 and now asserted in CI. Proven on K31 the same day: the eight endpoints Core gathers at startup went from 4 of 8 unreadable to 8 of 8, healthy, 7/7 add-ons, restarts=0. PREVIOUS 2025.11.4.8.
