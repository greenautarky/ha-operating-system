# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.2.21-rc36  # marker baked into /etc/ga-release at build. BOSv1.2.21-rc36 = rc35 content PLUS the 2026-07-27 SECURITY BLOCK and the resident self-service reset. PRIMARILY A SECURITY RELEASE. (A) Vuln-2 #238: host->addon /share writes are symlink-safe (ga-share-publish, stage-root-only + rename()); addon containers run as uid 0, so /share permissions were inert and a symlink could escalate container->host-root. (B) Vuln-7 #239: root password fails CLOSED on GA_ENV=prod — a prod image can no longer ship passwordless root; build test ROOTPW-01 gates /etc/shadow = $6$. (C) Vuln-3 #241: the legacy CA:TRUE anchor is now gated behind GA_LEGACY_CA_BRIDGE. DEFAULT STAYS ON (behaviour-preserving kill-switch) — it CANNOT be flipped off yet: the mesh audit found >=16 active legacy-OS devices and 34 unresolvable peers, blocked on the inventory gap #534. KB #171. (D) Vuln-8 #242 + ga_manager 0.99.0: the per-device InfluxDB credential moves off /share (readable by EVERY share:rw addon — Samba, Node-RED, Z2M, file-editor) to an addon-private /data sidecar; ga-telegraf-env prefers /data and falls back to /share during the transition (build test CFG-28b). NOT YET CLOSED — the /share write deliberately remains until ADR-0003 Step 5 drops it once the fleet is fully on /data. (E) Vuln-11 #244: netbird pinned to an immutable commit SHA, telegraf to a sha256 archive hash — no more mutable-tag sources. Vuln-1 (shared device_writer influx account) was closed SERVER-SIDE on 2026-07-27 and needs nothing here; build test CFG-29 guards that telegraf.conf keeps using per-device ${INFLUX_USER}. (F) ga_manager 0.97.0 -> 0.99.0: 0.98.0 fixes three pre-existing tenant-wipe defects (phase 7 now RE-ARMS the onboarding wizard — a wiped device previously came back with no wizard, no site language and no rooms; phase 9 no longer asserts .storage/onboarding is absent, which contradicted the 0.31.0 keep-list and failed EVERY wipe; /config/ga/ is now wiped, so a departing tenant no longer hands their HA user ids to the next one), 0.99.0 the Vuln-8 sidecar. (G) greenautarky-site 2.1.0 + ga-frontend-bundle 1.9.0: resident self-service reset ("Danger Zone") — reset users / erase the site. *** SHIPS WITHOUT A FEATURE GATE (operator decision): on any rc36 device EVERY master sees the irreversible erase button. The only containment is the rollout ring; taking it back means an OTA. *** NOTE the tenant-wipe path has NEVER run on a baked device — all prior evidence comes from hand-patched canaries where /share and /config were kept consistent by hand. rc36 is the first OTA-delivered test of it. CANARY-ONLY. Real rootfs delta (ga-share-publish, rootpw, rauc CA gate, telegraf env, pkg pins) -> RAUC can effectuate it.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.1.0"   # OCI ghcr.io/greenautarky/greenautarky-site:2.1.0 — component rename greenautarky_onboarding -> greenautarky_site (#574); was greenautarky-onboarding 1.8.0. NOTE: GitHub SOURCE REPO not yet renamed — still https://github.com/greenautarky/greenautarky-onboarding. Room-Scoping Stage A+B COMPLETE (incr 1-3, WS+REST leak_guard) + entity scoping DEFAULT ON (only restricts real sub-users) rc36: 2.1.0 adds the resident self-service reset (Danger Zone) — see gaos_release (G); NO feature gate.
  greenautarky-telemetry:  "0.2.3"   # https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.9.0"  # https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G).
  ga-heating:              "0.1.0"  # https://github.com/greenautarky/ga-heating — weekly heating plan: stored + executed on the device via climate.set_temperature (works with ANY thermostat), mirrored into a TRV that can hold a plan. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE, gm 0.86.0).

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.8"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs).
  ga-telemetry-config:  "1.0.1"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.4.6"
