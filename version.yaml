# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.2.21-rc25  # marker baked into /etc/ga-release at build. BOSv1.2.21-rc25 = rc24 content PLUS onboarding 1.2.1 (#512, onboarding PR #12): join/setup-wizard UI repariert — das vendorte Bundle shippte nur den Entry-Chunk, jeder code-split import() 404te gegen Cores /frontend_latest, die Account-Felder des Wizards renderten nie (Kunde konnte per Browser nicht joinen; API-Pfad war ok). Fix: dedizierte Wizard-Compilation (frontend 2d0609e2e, gulp build-ga-wizard) mit publicPath auf dem Component-Mount /greenautarky_onboarding_static/ — ganze Compilation-Dirs vendored (928 JS, komplett per Konstruktion, keine Maps), Kollision mit Cores /frontend_latest strukturell unmoeglich. Bundle CI-gebaut (produce-bundle, Runner). VERIFY: Playwright-E2E (tests/e2e, -m e2e) gegen Canary — das #512-Gate muss GRUEN werden. CANARY-ONLY. Real rootfs delta = component overlay 1.2.0->1.2.1. Same HAOS 16.3.1.9 -> same-version cutover, per-rc-only. BOSv1.2.21-rc24 = rc23 content PLUS onboarding 1.1.0 -> 1.2.0 (onboarding PR #10, ADR-0006): personal dashboards auto-created per tenant user — create_user (auto-elected master) + sub_user/join each create ga-home-<name> (welcome view, matrix assignment, per-view visible reconcile), boot re-registers component-owned dashboards AND backfills pre-feature masters/sub-users (self-healing; skips admins/inactive; no-op without masters — prod devices unaffected). Component-owned by design (lovelace DashboardsCollection unreachable from a custom component; second instance would clobber customer dashboards) -> not listed in Settings->Dashboards, managed via master console/matrix. New test tiers in the component repo: tests/device (-m device, live canary via HA API) + tests/e2e (-m e2e, Playwright) — release checklist runs the device tier against a canary post-roll. CANARY-ONLY roll (sub-user surface stays server-gated; privacy review = pre-NON-canary gate). Real rootfs delta = the baked component overlay 1.1.0->1.2.0, RAUC effectuates. Same HAOS 16.3.1.9 -> same-version cutover, per-rc-only. BOSv1.2.21-rc23 = rc22 content PLUS: (1) ga_manager 0.80.0 (#506, gm #142) — fleet_endpoint IP-Selbstheilung: die fleet:-Consumer (component-sync, converge admin-credential) probieren jetzt Hostname -> host-resolved fleet_url_ip-Fallback (wie enroll_bind), weil fleet.greenautarky.com in der Addon-CoreDNS nicht aufloest; kein Hand-Eintrag der Mesh-IP beim Deploy mehr noetig. (2) onboarding 1.0.5 -> 1.1.0 — Sub-User-Consent-Build (server-enforced consent, orphan-disable; ADR-0006/0009). CANARY-ONLY: die Sub-User-UI ist server-gated (Master-flag + invite PIN), NON-canary bleibt privacy-review-gated. Kein rootfs-Code-Delta ausser addon-images-Pin (gm 0.80.0) + component-Pin (onboarding 1.1.0) — RAUC effektuiert ueber den gm-Addon-Update-Dispatch bzw. component-sync; onboarding wahlweise per Mesh (ADR-0013, jetzt funktional) statt Bake. Same HAOS 16.3.1.9 -> same-version cutover, per-rc-only. BOSv1.2.21-rc22 = rc21 content PLUS the REAL tier-0 Loki auth. rc21 (#180) patched network-details.conf — a scaffold whose own header says NOT YET INCLUDED and which no service loads; build tests CFG-42/43/44 asserted against that dead file, so they were green while nothing changed. The actual tier-0 loki OUTPUT lives in fluent-bit-tier0.conf, shipped by the ga-telemetry-config OCI overlay (now 1.0.1): it hard-coded Port 3100 and a shared literal Tenant_ID with no credentials at all. Since tier-1 is consent-gated and only 1 of 6 canaries has consent, tier-0 is the sole Loki writer on most of the fleet — auth_enabled=true would have blacked them out. Also: both fluent-bit units built the env file with inline shell, and systemd expands ${braced} vars in Exec* lines itself, so they wrote EMPTY LOKI_* values; the "key already present" guard then made that permanent (this took tier-0 down on all 6 canaries on 2026-07-10 and had to be repaired by hand). Both units now call /usr/libexec/ga-fluent-bit-env, which rewrites the env file in full on every start (so a wrong value heals, incl. the DEVICE_LABEL=unknown boot-race, Odoo #509) and always exits 0 (absent cred degrades to anonymous). Build tests are rewritten to derive each unit's config from its ExecStart -c flag, to reject ${braced} vars in Exec* lines, and to fail on any shipped config with a loki OUTPUT that no unit loads (CFG-42..46). CANARY-ONLY roll. Real rootfs delta (tier0.conf + both units + new /usr/libexec script) -> RAUC effectuates. Same HAOS 16.3.1.9 -> same-version cutover, per-rc-only. PREREQUISITE for Loki auth_enabled (LOKI-IDENTITY-STEP3.md step E). BOSv1.2.21-rc21 = rc20 content PLUS the tier-0/CFR fluent-bit Loki auth (#180): network-details.conf OUTPUT (the connectivity-flight-recorder / network_details stream) was hard-coded to loki.greenautarky.com:3100 with NO auth — now env-based (${LOKI_HOST}/${LOKI_PORT} + http_user/http_passwd/tenant_id) with anonymous-safe defaults, and fluent-bit-tier0.service reads the same ga-fleet-loki.yaml sidecar as tier-1 (guarded on LOKI_USER, anonymous-safe, independent of tier-1 start order). Closes the LAST gap before Loki auth_enabled=true can flip without silently dropping the tier-0 CFR stream (LOKI-IDENTITY-STEP3.md, build tests CFG-42/43/44). No behaviour change until Loki multi-tenancy + Caddy@loki are activated. CANARY-ONLY roll. Real rootfs delta (network-details.conf + fluent-bit-tier0.service) → RAUC effectuates. Same HAOS 16.3.1.9 → same-version cutover, per-rc-only (all canaries on rc20 carry the per-rc-aware ga-rauc-install, so NO GA_ALSO_PROD prod-slot copy needed). BOSv1.2.21-rc20 = rc19 content PLUS: (1) fluent-bit per-device Loki auth wiring (#172, ADR-0003 Step 3) — OUTPUT gains http_user/http_passwd/tenant_id from env with anonymous-safe defaults; reads the flat loki sidecar via the root-only /data glob. No behaviour change until Loki multi-tenancy + Caddy@loki are activated (LOKI-IDENTITY-STEP3.md). (2) ga_manager 0.79.0 pin (was 0.74.0): 0.76 creds-write + component-sync HTTP routes (the silent-405 fix — mesh delivery + unified creds were undispatchable before), 0.77 loki sidecar, 0.78 MQTT privacy-filter hardening (nested checks.details fail-closed + presence/info whitelists — both historical leak sites), 0.79 the fleet: block + /data credential relocation (device→fleet-manager identity; ADR-0003 Amendment 09b). CANARY-ONLY roll. Real rootfs delta (fluent-bit.service) → RAUC effectuates. Same HAOS 16.3.1.9 → same-version cutover; FIRST clean per-rc-only roll (all canaries on rc19 carry the per-rc-aware ga-rauc-install, so NO GA_ALSO_PROD prod-slot copy needed). BOSv1.2.21-rc19 = rc18 content PLUS: (1) per-rc canary OTA slots (#165 + ga_manager 0.71.0 #132) — ga-rauc-install reads an optional ga_release sidecar and pulls releases/<ver>/<rc>/… (prod-slot fallback on 404); push-ota --ga-release stages there. A canary build never occupies the prod slot again. FIRST roll onto rc18 hosts needs the prod slot staged too (GA_ALSO_PROD=1 in canary-ota-roll) since rc18 ga-rauc-install is pre-per-rc. (2) telegraf per-device InfluxDB cred fix (#169, ADR-0003 Step 2 Path A) — 87-influx-password.sh DELETED (no baked shared password; CFG-31 guards the placeholder), ExecStartPre hardened vs the /share mount boot-race (bounded 6x5s wait, loud logs, only writes creds when both fields non-empty). Devices 401 to InfluxDB until the fleet-manager delivers per-device creds (cohort-gated, fleet 0.53+ #146) — device_writer stays valid through the transition (D6). (3) ga_manager 0.74.0 pin (#168): 0.71 per-rc sidecar + 0.72 unified creds-write worker (ADR-0003 Step 1) + 0.73 zigbee software_build_id/date_code + 0.74 local status panel (full versions incl. vendored components + loaded state, feature rollup: master-users, creds files, boot slot, crash marker, drift). CANARY-ONLY roll. Real rootfs delta (telegraf.service + ga-rauc-install + deleted post-build script) so RAUC effectuates — NOT marker-only. Same HAOS 16.3.1.9 -> same-version cutover via dispatch. BOSv1.2.21-rc18 = rc15 content PLUS: (1) onboarding v1.0.5 — reproducible content-hashed producer + Ramin #498 copy-fixes (consistent Siezen, real umlauts, 'Fertig') + real GreenAutarky logo/wordmark + the sub-user-join wizard frontend (combined build from fix/onboarding-feedback-498 + ga/sub-user-join; ADR-0013 producer, fork-decoupled). (2) ga-frontend-bundle 1.0.2 — Master-User ga-master-card lock/unlock+remove selector fix (ADR-0006/0009). (3) ga_manager 0.70.0 — ADR-0012 vendored steady-state reconcile (0.66.x) + ADR-0013 mesh delivery (component-sync worker 0.68 + serve-route/dispatch/drift + verify-loaded 0.67 + placed_versions 0.70). CANARY-ONLY roll: the Master-User + sub-user UI ships but is server-gated (Master-flag /config file + invite PIN required) — privacy review is a pre-NON-canary gate, canary testing is fine. Same HAOS 16.3.1.9 -> same-version cutover, push-ota --force. BOSv1.2.21-rc15 = rc14 content PLUS: (1) greenautarky_telemetry Tier-2 component (0.2.3 — consent-tier storage backend, Privacy Tiers 1/2 opt-out/opt-in + WS API; version.yaml components pin #142, enabled on-device by ga_manager converge GA_INTEGRATIONS_TO_ENABLE #123; extracted standalone from ha-greenautarky-onboarding, canary-validated K0 on stock Core 2025.11.3 armv7). (2) Connectivity flight recorder — OS daemon ga-connectivity-recorder (#144) classifies the last offline gap (wifi/lte/ethernet/wan/mesh/broker/reboot/power) into /share; pairs with ga_manager 0.65.0 classifier (#124) + fleet-mgr 0.49.0 sticky last_offline (#140) -> ADR-0011. (3) ga_manager 0.65.1 (0.65.0 connectivity + 0.65.1 telemetry-enable; addon-images pin #145). (4) addon-images refresh (#141): z2m 2.12.1-1 (armv7 self-build), mosquitto -> ga_mosquitto 7.1.0, ga_tailscale 0.27.2, sonoff_dongle_flasher 1.3.4. (5) Core/frontend fork-ref retirement (#143 — deleted cut-release.sh/bump-release-version.sh + dead tests, de-forked test-all.sh; no rootfs impact). Real rootfs delta (telemetry component overlay + connectivity daemon) so RAUC effectuates on OTA -- NOT a marker-only no-op. Same HAOS 16.3.1.9 -> same-version cutover, OTA-distinguishable from rc14. BOSv1.2.21-rc14 = rc13 content PLUS the new NetBird join key (ADR-0010 §4, operator 2026-07-06): images now bake the reusable `device-enroll` setup key whose auto-group `enroll-quarantine` has exactly one policy — reach the fleet-host. Fresh devices therefore join the mesh NETWORK-quarantined until the pair/release promotes them (fleet-mgr 0.47.0 promote_peer: rename by mesh-IP + group move quarantine→kibus + cohort tags, default canary). Old `Remotes` key stays valid for existing devices; revoke once no supported image carries it. No rootfs code change — key file swap on the builder (secrets/netbird-setup-key.txt, backup .pre-enroll-key.bak). Same HAOS 16.3.1.9, OTA-distinguishable from rc13 (OTA irrelevant here — key only matters at first join). BOSv1.2.21-rc13 = BOSv1.2.21-rc13 = rc12 content PLUS the two live-E2E fixes (#468): ga-enroll writes host-resolved fleet_url_ip into the bridge state (#134 — addon CoreDNS cannot resolve fleet.greenautarky.com, see gotcha; proper CoreDNS fix = next Supervisor release, Odoo #477) AND ga_manager 0.64.1 pin (#135 via CI auto-lockstep: identity-write HTTP route [405 fix] + enroll_bind IP-fallback). Pairs with fleet-mgr 0.46.0 (deployed; NetBird rename token now installed on ga-newhost). P2 chain E2E-validated on K0 2026-07-06. Same HAOS 16.3.1.9 → same-version cutover, OTA-distinguishable from rc12. BOSv1.2.21-rc12 = BOSv1.2.21-rc12 = rc11 content PLUS device self-enrollment (ADR-0010 P1, #130, Odoo #467): ga-enroll.service POSTs /api/enroll at every boot (GA_FLEET_HOST=fleet.greenautarky.com in ga-services.conf, cutover-covered) — pending enrollment + enroll:pending tag fleet-side, GHCR pull creds ride back in the response to /mnt/data/ghcr-creds.json (= ga-bootstrap fallback 4, breaks the fresh-device chicken-and-egg), non-secret bridge /share/ga-enroll-state.json; ga_manager 0.63.0 (pin #131 via CI auto-lockstep) binds its /data token TOFU via /api/enroll/token. Pairs with fleet-mgr 0.45.0 (deployed). Chain E2E-validated on K0 2026-07-06 pre-bake. Same HAOS 16.3.1.9 → same-version cutover, OTA-distinguishable from rc11. BOSv1.2.21-rc11 = BOSv1.2.21-rc11 = rc10 content PLUS ga_manager 0.61.0 (#116, addon-images pin #126 via CI auto-lockstep): ga-services-reconcile worker — detect/clear a stale /mnt/data/ga-services.conf endpoint override (survives OTA, pins device to old backend) without SSH (#456 Gap D); pairs with fleet-mgr 0.42.0 routes. Same HAOS 16.3.1.9 → same-version cutover, OTA-distinguishable from rc10. BOSv1.2.21-rc10 = rc9 content PLUS Loki observability (#124): fluent-bit tier1 ships GA self-heal + ga_manager errors fleet-central — ga-wifi-watchdog degraded-TX triggers+recoveries (now logged <4>/<3>), ga-rauc-install OTA failures, ga-boot-check unclean-shutdown (<4>), ga-rtw-recover; + ga_manager addon WARNING/ERROR/CRITICAL. Same HAOS 16.3.1.9 → same-version cutover, OTA-distinguishable from rc9. BOSv1.2.21-rc9 = rc8 content PLUS ga_manager 0.60.0 (F3 store-reload→addon-update settle + F5 detached self-restart, #114) AND ga-wifi-watchdog (#122): periodic rtw88_8723ds runtime degraded-TX recovery — module-reload→guarded-reboot — the real fix for the K7/K17 "slow OTA" (firmware TX hang, not mesh). Same HAOS 16.3.1.9 → same-version cutover, OTA-distinguishable from rc8. BOSv1.2.21-rc8 = rc7 content PLUS MQTT broker host via ga-services.conf (#119). BOSv1.2.21-rc6 = rc5 content PLUS the ga-update-hosts fleet-cutover hardening (#115): self-clean stale /etc/hosts GA lines (host + Supervisor container) so an old backend IP can never win the files lookup, and bounce endpoint-bound clients (fluent-bit/telegraf) via /mnt/data/.ga-services-applied-ip change-detection so a cutover re-resolves immediately without manual surgery. Bumped from rc5 so canaries on rc3/rc4/rc5 are OTA-distinguishable for the ga-tools→Hetzner endpoint cutover (K7 already manually cut over; rest self-heal on this OTA reboot). BOSv1.2.21-rc5 = rc4 content PLUS ga_manager 0.57.0 (ADR-0004/0005 zigbee live-maintenance + pairing + permit-join/remove + installation-window; pairs with fleet-mgr 0.34.0 managed role-based auth). NOTE: inherits the rc4 migration-IP cutover (ga-services.conf -> Hetzner .116 primary, old .142.217 fallback) -- for a zigbee canary test that is fine (connectivity via old fallback; zigbee is local). BOSv1.2.21-rc4 = rc3 content (edge-buffered telegraf + cred-reader, onboarding 1.0.4 LED, ga-bootstrap 1.2.8, ga_manager 0.53.0) PLUS the ga-tools→Hetzner migration IP cutover (ga-services.conf GA_OTA_IPS/GA_SERVICES_IP → new host 100.126.129.116, #111). Bumped from rc3 so the same-HAOS-version (16.3.1.9) bake is OTA-distinguishable for the canary cutover (devices carry rc2/rc3). BOSv1.2.21-rc3 = ga_manager 0.45.5 baked (device-id self-heal from /share/ga-fleet-mqtt.yaml username, kills the K6/K7/K10/K17/K49 cascade flap loop where all 5 devices collided on client_id="ga_manager_remote_<unknown>"). rc2 = ga_manager 0.45.4 baked (MQTT v5 + clean_start, didn't actually fix the bug; rc3 supersedes). rc1 = ga_manager 0.45.2 baked (2-client MQTT facade + privacy Layer-1/2/3 incl. SSID-redact with GA-prefix whitelist + nested-dict gate, ga-addon-prime Supervisor-ready probe + no-op-success). BOSv1.2.18+ = ga_manager 0.42.0 + path-watcher trampoline (= /share/ga-rauc-install-request → host .path/.service) for fleet-wide cascade without operator SSH.

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-onboarding: "1.2.1"   # https://github.com/greenautarky/greenautarky-onboarding
  greenautarky-telemetry:  "0.2.3"   # https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.0.2"  # https://github.com/greenautarky/ga-frontend-bundle (14 vendored Lovelace cards, ~6 MB; was embedded)

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.8"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs).
  ga-telemetry-config:  "1.0.1"  # https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2025.11.3"
  homeassistant_supervisor:  "2025.11.4.6"
