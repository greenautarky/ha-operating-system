# Single source of truth for component + addon version pins.
#
# Components are pulled from GHCR as OCI artifacts at OS build time by
# scripts/sync-components.sh, which lays them out under
# buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
#
# Addons are built by their own repos' CI and pinned SOLELY in
# buildroot-external/package/hassio/addon-images.json — that file is the single
# source of truth for addon versions. They are deliberately NOT duplicated here
# (a "for visibility" copy just drifts — e.g. this file long showed ga_manager
# 0.45.2 while the real pin was 0.65.1). Check addon-images.json for addon pins.
#
# Bumping a version here + running scripts/sync-components.sh is the
# only OS-side change needed to ship a new component release.

gaos_release: BOSv1.5.3-rc2  # marker baked into /etc/ga-release at build. BOSv1.5.3-rc2 = rc1 + ga-heating 0.13.9 (a dial turned on one radiator now reaches the other radiators of the room; only the value is mirrored, mode and manual clock untouched, ga-heating#69) + ga-wlan0-deauth writes valid JSON on a boot with no deauth (SW-14) + time.cloudflare.com as last NTP fallback (google stays first). PREVIOUS BOSv1.5.3-rc1 = BOSv1.5.2 + ga_manager 0.264.0 (ga_manager watchdog on and admin-only sidebar, missing watchdog reported to the fm, zigbee false-positive fix, outdoor sensors and location checks, converge proof; the first reconcile restarts Core once, Odoo #1371), frontend bundle 1.23.8 (outdoor sensors on every room view, boost 15 min, badge icons), ga-heating 0.13.8, greenautarky_site 2.12.6 (console: admin button always logs in as admin, resident login on staging canaries only), ga-bootstrap 1.2.10 (first-boot store recovery, Odoo #1337). PREVIOUS BOSv1.5.2 = BOSv1.5.2-rc4 unchanged (final; same pins). PREVIOUS BOSv1.5.2-rc4 = rc3 + three add-on images rebuilt for CVE-2026-115557 (Python 3.14.8 -> 3.14.10, no code change): ga_manager 0.255.1, ga_default_addon 2.1.6, ga_hmvapp_addon 2.6.2. PREVIOUS BOSv1.5.2 = BOSv1.5.2-rc3 unchanged (final; same pins, channel promoted label-only). PREVIOUS BOSv1.5.2-rc3 = rc2 + rooms rename fix (Odoo #1336): ga_manager 0.254.0 keeps the room ref/kind at the rooms-sync door, greenautarky_site 2.12.4 adopts a renamed room instead of duplicating it; journald RAM-only now effective on iHost (the iHost drop-in no longer overrides Storage=volatile, #882); ga_manager 0.255.0 lets a tenant-wipe pass its verify phase (Odoo #1341). BOSv1.5.2-rc2 = rc1 + journald RAM-only with bounded persist-on-failure dump (#860), reproducible trixie build container (#862), HW-09 Zigbee UART (#864), boot-settle wait for TEL-10/NET-03 (#865), telegraf version stamp (#866), frontend bundle 1.23.7 + ga-heating 0.13.7 (Services rebuild, Urlaub as a plan — the holiday schedule is written into the valves and the resident plan restored afterwards, log names the account; bundle #55, heating #66, follow-ups Odoo #1316); built in FULL mode. rc1 = BOSv1.5.1 + ga_hmvapp_addon 2.6.1 ("Missing data" logged once per transition, Odoo #1225), z2m 2.12.1-10 (NWK guard log level, #1221), ga_manager 0.253.0 (Supervisor stats sweep every 300 s, Odoo #1203), onboarding 2.12.3 (Ethernet step records the chosen value), frontend bundle 1.23.6 (master card without full-site reset), suite preflight waits for Core API + InfluxDB (#803).

components:
  # Tier-2 component repos — each publishes a .tar.gz OCI artifact at
  # ghcr.io/greenautarky/<name>:<version> that contains a single top-
  # level dir matching the component's HA-integration domain name.
  # Extracted into buildroot-external/rootfs-overlay/usr/share/ga/custom_components/.
  greenautarky-site: "2.12.6"  # 2.12.4 (2026-10-26): rooms-sync adopts a room the resident renamed instead of building a duplicate area; the ref is recorded as an alias (Odoo #1336). PREVIOUS 2.12.3 (2026-10-16): The Ethernet step now records what the resident chose.. PREVIOUS 2.12.2 (2026-10-13): The wizard no longer shows the 'Ihr KI-Butler' info page.
  greenautarky-telemetry:  "0.2.4"   # 0.2.4 (2026-09-17): async_set_preferences — one entry point for a consent decision (#2). https://github.com/greenautarky/greenautarky-telemetry — consent-tier storage backend (Privacy Tiers 1/2 opt-out/opt-in) + WS API; extracted standalone from ha-greenautarky-onboarding v0.2.3. Enabled on-device by ga_manager converge (GA_INTEGRATIONS_TO_ENABLE).
  ga-frontend-bundle:       "1.23.8"  #      1.23.7 (2026-10-21): Services rebuild, Urlaub as a plan, room view groups (#55; needs ga_heating 0.13.7). PREVIOUS      1.23.6 (2026-10-16): the master card no longer offers the full-site reset (#54). PREVIOUS 1.23.5 (2026-10-08): each room view is headed by the room name, readings and target are labelled, the Heizplan draws old and new plan on one scale, Aktivitaet names balancing runs. PREVIOUS 1.23.4 (2026-10-08): Wartung shows a room sensor that has stopped talking (Ahmad #50). 1.23.3 (2026-10-07): names and texts escaped before rendering (#49). 1.23.2 (2026-10-07): house humidity for rooms without a hygrometer, radio health in Wartung (#48). 1.23.1 (2026-10-06): Aktivitaet shown in every room by default (#47).1.23.0 (2026-10-06): a way out of a running boost or Sonderplan (Beenden), a Wartung section that names the sensor that needs a battery, the balancing controls on the Profil card (hidden without ga_heating 0.13.0), room chips keep a click across the countdown tick, the heating log names the balancing hour (#44, carries Ahmad #42).1.22.0 (2026-10-05): thermostat card mode order AUS · MANUEL · KI with −/+ kept on an OFF room, the room temperature badge reads the ga_heating sensor, the 24 h curve draws the room not the radiator, and a new change-log card (Aktivität); requires ga-heating >= 0.12.0 (#40). 1.21.0 (2026-09-28): both Danger Zone buttons send their request again (#38; broken since 1.9.0). 1.20.0 (2026-09-25): room temperature badge back, from the ga_heating room entity (#37). 1.19.0 (2026-09-24): Einstellungen = management card, invite shows the shareable link (#34, #35). 1.18.0 (2026-09-23): the whole-home heating controls on a `Profil` tab — boost, alle AUS, Sonderplan (Krankheit/Urlaub) — with Ahmad's own labels from the previous system, the status always visible and the form behind a toggle. `Alle AUS` says at which temperature the valves open again, READ from each valve's frost_protection_temperature (7 °C on our fleet, not the 5 the vendor documents). 1.17.0 never shipped. Also: the thermostat card leads with the TARGET and the weekly plan is never an empty form (five fixed times, padded from what is already in force — never an invented value). The room views no longer badge the measurement. PREVIOUS 1.15.0: while the heating plan is paused, the card says for how long — remaining time AND wall-clock, plus what takes over at zero. The data was there all along (`manual_until` on the room entity, since ga_heating 0.5.0) and never rendered. Three ways it shows nothing rather than something wrong: no override, an expired one (ga_heating clears the attribute on its next tick — silence beats counting backwards), and a timestamp that does not parse. 1.14.0: un-confirmed intent expires after 8 s. In `auto` the plan owns the setpoint, so a write is accepted with 200 and changes nothing — the pending value was never confirmed, the early return fired on every state update for ever, and the card stopped following the device at all. PREVIOUS 1.13.0: four defects on the resident's screen, all measured in a browser on 2026-09-16 once rc37's registry fix made the cards visible at all. The card never said whether the room was being HEATED — the state lived in the `dial` variant only while the device ships `setpoint`, and was inferred from `target > current` rather than read from `hvac_action`, which is wrong in both directions and silently so. Setpoint presses were lost (nine gave seven steps): each press read the last value the backend confirmed, and every state update replaced the button mid-click; the card now carries the resident's intent, sends one command per burst, and binds its listener to the root. The 24-hour charts drew three curves per sensor under three identical labels, because `statistics-graph` names a series after the entity and never says which statistic it is — one curve per sensor now. And the sidebar stayed open on every first load: the asset fired its event at `home-assistant`, which exists in index.html from the first byte, before the app had attached the listener, then reported success — so the retry it had been given never ran. It waits for the effect now. PREVIOUS 1.12.0: the cards reach the browser. Home Assistant's frontend installs a scoped-custom-element-registry polyfill that replaces window.customElements with a new, empty registry on the app bundle's first line. Assets injected through add_extra_js_url are imported inline from index.html and race that bootstrap, so a card that registered before the swap defined itself into a registry the app then threw away — silently, with no error on either side, and the element never upgrades. Every first-party asset is now delivered as a Lovelace resource, which the panel loads after bootstrap; add_extra_js_url is kept as an explicit allow-list for assets that define no custom element; and ga-registry-guard fails loudly instead of registering into a registry that is about to be replaced. PREVIOUS 1.11.0: the resident's screen says what it means — devices carry a human name instead of a radio address, the 24-hour heating plan has a real time axis (the hour had lived only in a hover tooltip), and the history section renders only when Home Assistant's `history` integration is actually loaded, announcing its absence at console.warn with the cause instead of drawing a card that only reports being off. PREVIOUS 1.10.0: resident-clean UI defaults (hide Haushalt/Ohne Raum, collapse sidebar on first load). https://github.com/greenautarky/ga-frontend-bundle — ga-home strategy renders the server home_model (#569, no client re-derivation); FIRST-PARTY ga-thermostat-card DEFAULT = variant setpoint (Sollwert-Fokus, Ramin/KB #162, #518), admin/config-only; classic/dial/core/simple stay; cache-bust ?v= on served URLs; calls the renamed /api/greenautarky_site/* (#574). rc36: 1.9.0 adds the master-card Danger Zone UI (reset users / erase site) — see gaos_release (G). rc37: 1.9.1 pairs with site 2.1.1 for the scoping repair.
  ga-heating:              "0.13.9"  #      0.13.9 (2026-10-29): a dial on one radiator reaches the other radiators of the room (#69). PREVIOUS 0.13.8. 0.13.7 (2026-10-21): a holiday IS the plan (flat week mirrored into the valves, resident plan held in plan_backup), the log names who acted (#66). PREVIOUS      0.13.6 (2026-10-08): a balancing run names itself in every room log. PREVIOUS 0.13.5 (2026-10-07): a sensor that has stopped talking is not a measurement (#58); a room reporting the house average cannot be measured (#59); a substitution we provoked is forgiven (#61).0.13.4 (2026-10-07): a room with no thermometer takes the house average (#57). 0.13.3 (2026-10-07): a valve answering our write with its stored setpoint is our echo (#56). 0.13.2 (2026-10-06): a late echo of our own command is not a hand on the dial; valves_late shows radiators answering late (#54, #55 with Ahmad #53). 0.13.0 (2026-10-06): the balancing hour (ICHB) — services ichb / cancel_ichb, window > balancing > boost > absence > plan, valve ceiling to 100 % and given back on end, cancel and restart; a failed start leaves nothing behind; an open window marks the radiator unmeasurable; the change log names the run (#51, carries Ahmad #50).0.12.1 (2026-10-06): AUS or KI pressed on a radiator takes the room along and stays (no revert by the minute tick); KI on a radiator brings back a room switched off from the card; switching a room off sends one command per radiator; a press ends a running boost or Sonderplan; only a boost shows MANUEL on the card (#49, supersedes #48).  0.12.0 (2026-10-05): each room records what changed, when and why; a setpoint on an OFF room turns it on in MANUEL instead of heating under AUS; the minute tick re-checks AI per valve so a dial turn is not undone; KI or AUS pressed on a radiator takes the room along (known gaps F1/F2, KB #218) (#47). 0.11.3 (2026-09-30): a day with two slots at the same minute is refused. 0.11.2 (2026-09-28): after a Zigbee restore the rooms stay in AI — a delivery failure is not a refusal, a matching read-back wins, no commands to unknown valves and a settle window after a valve rejoins (ga-heating#44). 0.11.1 (2026-09-28): a room follows its area's valves at runtime; a valve's first setpoint is not a hand (ga-heating#43). 0.11.0 (2026-09-25): in AI the valves run the room plan in their own auto (ADR-0021 amendment 2026-09-25, ga-heating#42). 0.10.1 (2026-09-24): boost / absence / cancel re-render the room via _republish_room, so an override is visible when set (ga-heating#40). PREVIOUS 0.10.0.

rootfs_overlays:
  # Same OCI mechanism as `components:` above, different tarball shape —
  # the tarball ships rootfs-relative paths (usr/sbin/foo + etc/systemd/…
  # + their multi-user.target.wants/ symlinks) and extracts straight into
  # buildroot-external/rootfs-overlay/. Use this for first-boot / boot-
  # critical system services and config bundles that need to live in
  # their canonical rootfs locations to be picked up by systemd.
  ga-bootstrap:         "1.2.10"  # https://github.com/greenautarky/ga-bootstrap — first-boot orchestrator. v1.2.8 forces protected=false on ga_manager post-install (= enables docker_api self-update path; pre-1.2.8 fresh-flash devices needed manual operator toggle, see ha-os memory:bug_k49_supervisor_docker_sock_missing_2026_06_21). v1.2.2 adds EnvironmentFile=-/mnt/data/ga-bootstrap.env so on-device tests + operators can override GHCR_CREDS_FILE / BACKOFF_SEQUENCE without rebuilding (/etc is RO squashfs). v1.2.9 lifts a blocking Supervisor job condition instead of retrying it for 8 min: 'StoreManager.add_repository blocked, supervisor needs to be updated first' is a job condition, not the transient git race the retry loop was built for. It left EVERY freshly flashed device with no store, no add-ons and no ga_manager while booting fine and answering on serial (K31, 2026-07-30). Pairs with the hassio.mk channel fix that removes the cause.
  ga-telemetry-config:  "1.1.0"  # 1.1.0 (2026-10-11): tier-0 auth keeps the security evidence and drops connection bookkeeping (probe noise); slim record (MESSAGE, PRIORITY, SYSLOG_IDENTIFIER, UNIT, tier) — bench device 3.21 -> 0.07 MB/day of tier-0 (Odoo #1227). PREVIOUS 1.0.5 (2026-10-10): tier-0 cursor DBs run with DB.Sync Off — no fsync per journal line (Odoo #1224; gate fluent_bit_cursor_sync). PREVIOUS 1.0.4 (2026-10-08): tier-0 logs carry the label env (= the device's fleet env), ga_env kept one release as an alias (Odoo #1191). PREVIOUS 1.0.3: https://github.com/greenautarky/ga-telemetry-config — Tier-0 telemetry (boot-timing exporter + fluent-bit boot-log capture)

# Upstream base images — referenced by version.json + Supervisor config.
base_images:
  homeassistant_core:        "2026.8.2.1"  # 2026.8.2.1 (2026-09-30): same Core, rebuilt image with updated Python dependencies. 2026.8.2 (2026-09-28): the GA armv7 build (greenautarky/ga-core-armv7) — upstream stopped building armv7 Core in late 2025. Must equal the core of the channel file the build reads (defconfig channel + hassio.mk HASSIO_VERSION_URL: stable.json on haos-version candidate/stable-1.4 since BOSv1.4.0-rc5, dev.json before); hassio.mk refuses a bake where they differ. PREVIOUS 2025.11.3 (stock upstream).
  homeassistant_supervisor:  "2025.11.5.9"  #  2025.11.5.9 (2026-10-08): security backports (#7122/#7123/#7225/#6953), dependency fixes, Core startup window 3 -> 10 min (#6404). 2025.11.5.7 (BOSv1.4.0-rc6, published 2026-10-06, digest sha256:3b840d91…fdda): with auto_update off, plugin updates follow it like add-ons (ha-supervisor #42). 2025.11.5.6 (BOSv1.4.0-rc5, published 2026-10-06, digest sha256:8dcad223…bfc4): reads the haos-version base URL from /etc/ga-version-url (missing or invalid -> main, with a warning), plus security backports. 2025.11.5.5 (2026-09-30): same Supervisor, rebuilt on current packages. 2025.11.5.4 (2026-09-28): the default Core image follows the channel images.core, and a device on the upstream Core keeps it until its next Core update (ha-supervisor#36) — required for the GA armv7 Core. PREVIOUS 2025.11.5.3: the forward-port onto upstream 2025.11.5 (ha-supervisor #32), carrying the four API fields Core 2026.8/2026.9 require via aiohasupervisor 0.6.0 (#25) and reference_extra (#27). armv7 is kept OUT of the unsupported set — upstream #5620 would otherwise trip JobCondition.ARCHITECTURE_SUPPORTED and stop Updater.fetch_data, so the device would never read stable.json again; observed on K31 2026-09-09 and now asserted in CI. Proven on K31 the same day: the eight endpoints Core gathers at startup went from 4 of 8 unreadable to 8 of 8, healthy, 7/7 add-ons, restarts=0. PREVIOUS 2025.11.4.8.
